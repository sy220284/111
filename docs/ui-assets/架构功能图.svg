<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-label="111 架构功能图：Compose 界面层、状态与策略层、协议层、原生内核层四层结构，底部横贯 CI 验收与发布门禁">
  <rect width="1280" height="1040" fill="#FCFBFA"/>
  <g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">

