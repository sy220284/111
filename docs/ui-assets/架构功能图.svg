    <!-- 图例 -->
    <text x="56" y="1020" font-size="11" fill="#56646D">实线箭头 = 调用/数据方向 · 暖铜标题 = 层级 · 红铜边框 = 安全关键件 · 图源：docs/ui-assets/架构功能图.svg</text>
