    <text x="938" y="484" font-size="12" fill="#56646D">GlobalWorkSnapshot</text>
    <text x="938" y="502" font-size="12" fill="#56646D">备份/升级/重启独占保护</text>

    <!-- 箭头 L2→L3 -->
