<svg xmlns="http://www.w3.org/2000/svg" width="1690" height="940" viewBox="0 0 1690 940"><rect width="1690" height="940" fill="#F3F5F6"/><g font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><text x="26" y="37" font-size="25" fill="#263139" font-weight="700">111 · 原生任务体验</text><text x="310" y="36" font-size="13" fill="#56646D" font-weight="400">移动端设计参考 · 四种状态 · 393dp</text><text x="26" y="76" font-size="16" fill="#263139" font-weight="600">01 / 空闲首页</text><g transform="translate(26,94)"><rect x="0" y="0" width="393" height="800" rx="24" fill="#FFFFFF" stroke="#D8DEE1"/><text x="18" y="31" font-size="12" fill="#263139" font-weight="600">9:41</text><text x="20" y="73" font-size="22" fill="#263139" font-weight="400">☰</text><text x="346" y="73" font-size="20" fill="#263139" font-weight="400">＋</text><path d="M0 88h393" stroke="#D8DEE1"/><text x="196" y="338" font-size="16" fill="#263139" font-weight="400"></text><text x="88" y="363" font-size="25" fill="#263139" font-weight="600">今天想做什么？</text><text x="67" y="395" font-size="14" fill="#56646D" font-weight="400">提出问题，或交给 Codex 一项任务</text><rect x="14" y="669" width="365" height="104" rx="18" fill="#F6F7F8" stroke="#D8DEE1"/><text x="29" y="696" font-size="15" fill="#56646D" font-weight="400">交给 Codex 一项任务</text><text x="29" y="741" font-size="14" fill="#263139" font-weight="400">＋     默认模型</text><text x="264" y="741" font-size="22" fill="#263139" font-weight="400">···</text><rect x="327" y="721" width="36" height="36" rx="18" fill="#263139" stroke="#263139"/><text x="337" y="745" font-size="22" fill="#FFFFFF" font-weight="600">↑</text></g><text x="441" y="76" font-size="16" fill="#263139" font-weight="600">02 / 原生对话</text><g transform="translate(441,94)"><rect x="0" y="0" width="393" height="800" rx="24" fill="#FFFFFF" stroke="#D8DEE1"/><text x="18" y="31" font-size="12" fill="#263139" font-weight="600">9:41</text><text x="20" y="73" font-size="22" fill="#263139" font-weight="400">☰</text><text x="346" y="73" font-size="20" fill="#263139" font-weight="400">＋</text><path d="M0 88h393" stroke="#D8DEE1"/><text x="24" y="131" font-size="22" fill="#56646D" font-weight="600">›</text><text x="49" y="131" font-size="16" fill="#263139" font-weight="400">梳理项目的所有功能链路，</text><text x="49" y="155" font-size="16" fill="#263139" font-weight="400">检查问题并完成修复。</text><text x="24" y="214" font-size="16" fill="#263139" font-weight="400">已定位 3 处状态处理问题。</text><text x="24" y="239" font-size="16" fill="#263139" font-weight="400">正在检查任务恢复和配置写入。</text><rect x="18" y="269" width="357" height="52" rx="10" fill="#F6F7F8" stroke="#D8DEE1"/><text x="32" y="300" font-size="14" fill="#56646D" font-weight="400">执行中 · 读取配置</text><text x="24" y="374" font-size="16" fill="#263139" font-weight="400">下一步会核验修复结果。</text><rect x="14" y="669" width="365" height="104" rx="18" fill="#F6F7F8" stroke="#D8DEE1"/><text x="29" y="696" font-size="15" fill="#56646D" font-weight="400">交给 Codex 一项任务</text><text x="29" y="741" font-size="14" fill="#263139" font-weight="400">＋     默认模型</text><text x="264" y="741" font-size="22" fill="#263139" font-weight="400">···</text><rect x="327" y="721" width="36" height="36" rx="18" fill="#263139" stroke="#263139"/><text x="337" y="745" font-size="22" fill="#FFFFFF" font-weight="600">↑</text></g><text x="856" y="76" font-size="16" fill="#263139" font-weight="600">03 / 按需能力</text><g transform="translate(856,94)"><rect x="0" y="0" width="393" height="800" rx="24" fill="#FFFFFF" stroke="#D8DEE1"/><text x="18" y="31" font-size="12" fill="#263139" font-weight="600">9:41</text><text x="20" y="73" font-size="22" fill="#263139" font-weight="400">☰</text><text x="346" y="73" font-size="20" fill="#263139" font-weight="400">＋</text><path d="M0 88h393" stroke="#D8DEE1"/><text x="24" y="125" font-size="23" fill="#263139" font-weight="600">工具与扩展</text><text x="24" y="151" font-size="13" fill="#56646D" font-weight="400">选择当前任务所需能力</text><text x="24" y="202" font-size="16" fill="#263139" font-weight="600">技能</text><text x="24" y="224" font-size="12" fill="#56646D" font-weight="400">任务方法与工作规范</text><text x="352" y="210" font-size="20" fill="#56646D" font-weight="400">›</text><path d="M24 239h345" stroke="#D8DEE1"/><text x="24" y="274" font-size="16" fill="#263139" font-weight="600">插件</text><text x="24" y="296" font-size="12" fill="#56646D" font-weight="400">安装与管理扩展</text><text x="352" y="282" font-size="20" fill="#56646D" font-weight="400">›</text><path d="M24 311h345" stroke="#D8DEE1"/><text x="24" y="346" font-size="16" fill="#263139" font-weight="600">MCP 工具</text><text x="24" y="368" font-size="12" fill="#56646D" font-weight="400">外部工具服务</text><text x="352" y="354" font-size="20" fill="#56646D" font-weight="400">›</text><path d="M24 383h345" stroke="#D8DEE1"/><text x="24" y="418" font-size="16" fill="#263139" font-weight="600">连接应用</text><text x="24" y="440" font-size="12" fill="#56646D" font-weight="400">已授权的应用资源</text><text x="352" y="426" font-size="20" fill="#56646D" font-weight="400">›</text><path d="M24 455h345" stroke="#D8DEE1"/><text x="24" y="490" font-size="16" fill="#263139" font-weight="600">内核能力</text><text x="24" y="512" font-size="12" fill="#56646D" font-weight="400">常用功能与高级开关</text><text x="352" y="498" font-size="20" fill="#56646D" font-weight="400">›</text><path d="M24 527h345" stroke="#D8DEE1"/><rect x="24" y="570" width="345" height="48" rx="11" fill="#263139" stroke="#263139"/><text x="79" y="600" font-size="15" fill="#FFFFFF" font-weight="600">让 Codex 检查所需能力</text></g><text x="1271" y="76" font-size="16" fill="#263139" font-weight="600">04 / 待恢复保护</text><g transform="translate(1271,94)"><rect x="0" y="0" width="393" height="800" rx="24" fill="#FFFFFF" stroke="#D8DEE1"/><text x="18" y="31" font-size="12" fill="#263139" font-weight="600">9:41</text><text x="20" y="73" font-size="22" fill="#263139" font-weight="400">☰</text><text x="346" y="73" font-size="20" fill="#263139" font-weight="400">＋</text><path d="M0 88h393" stroke="#D8DEE1"/><rect x="14" y="669" width="365" height="104" rx="18" fill="#F6F7F8" stroke="#D8DEE1"/><text x="29" y="696" font-size="15" fill="#56646D" font-weight="400">交给 Codex 一项任务</text><text x="29" y="741" font-size="14" fill="#263139" font-weight="400">＋     默认模型</text><text x="264" y="741" font-size="22" fill="#263139" font-weight="400">···</text><rect x="327" y="721" width="36" height="36" rx="18" fill="#263139" stroke="#263139"/><text x="337" y="745" font-size="22" fill="#FFFFFF" font-weight="600">↑</text><rect x="0" y="88" width="393" height="712" fill="#263139" opacity=".18"/><rect x="25" y="265" width="343" height="266" rx="20" fill="#FFFFFF" stroke="#D8DEE1"/><text x="47" y="303" font-size="21" fill="#263139" font-weight="600">备份已验证</text><text x="47" y="339" font-size="14" fill="#263139" font-weight="400">恢复完成或取消前暂停新任务。</text><text x="47" y="364" font-size="14" fill="#56646D" font-weight="400">避免覆盖刚刚新增的数据。</text><rect x="47" y="397" width="299" height="48" rx="10" fill="#263139" stroke="#263139"/><text x="127" y="427" font-size="15" fill="#FFFFFF" font-weight="600">关闭应用以恢复</text><rect x="47" y="457" width="299" height="48" rx="10" fill="#FFFFFF" stroke="#D8DEE1"/><text x="148" y="487" font-size="15" fill="#263139" font-weight="400">取消本次恢复</text></g></g></svg>
