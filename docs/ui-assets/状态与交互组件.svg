<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="640" viewBox="0 0 1050 640"><rect width="1050" height="640" fill="#F9F9F8"/><text x="32" y="47" font-size="25" font-weight="600" fill="#263139">111 · 状态与交互组件</text><text x="32" y="73" font-size="13" fill="#56646D">共享组件 / 实际业务状态 / 典雅白 / 48dp 触控</text><g transform="translate(32 98)"><rect width="310" height="236" rx="18" fill="#FFFFFF" stroke="#D8DEE1"/><text x="18" y="31" fill="#805A3F" font-size="14" font-weight="600">01 空态与恢复</text><path d="M18 45H292" stroke="#D8DEE1"/><text x="18" y="76" fill="#263139" font-size="18" font-weight="600">已读取，无匹配项</text><text x="18" y="99" fill="#56646D" font-size="13">更换关键词重新查询</text><circle cx="155" cy="135" r="17" fill="#C8483E"/><path d="M148 135l5 5 9-11" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><rect x="18" y="177" width="274" height="42" rx="12" fill="#263139"/><text x="155" y="203" fill="#FFFFFF" text-anchor="middle" font-size="14">重新搜索</text></g><g transform="translate(370 98)"><rect width="310" height="236" rx="18" fill="#FFFFFF" stroke="#D8DEE1"/><text x="18" y="31" fill="#805A3F" font-size="14" font-weight="600">02 真实加载</text><path d="M18 45H292" stroke="#D8DEE1"/><text x="18" y="76" fill="#263139" font-size="18" font-weight="600">正在读取会话</text><text x="18" y="99" fill="#56646D" font-size="13">未知进度不显示假百分比</text><rect x="18" y="121" width="270" height="9" rx="4.5" fill="#D8DEE1"/><rect x="18" y="121" width="88" height="9" rx="4.5" fill="#C8483E"/><rect x="18" y="145" width="218" height="14" rx="7" fill="#E9ECEC"/><rect x="18" y="170" width="180" height="14" rx="7" fill="#E9ECEC"/></g><g transform="translate(708 98)"><rect width="310" height="236" rx="18" fill="#FFFFFF" stroke="#D8DEE1"/><text x="18" y="31" fill="#805A3F" font-size="14" font-weight="600">03 风险与错误</text><path d="M18 45H292" stroke="#D8DEE1"/><text x="18" y="76" fill="#263139" font-size="18" font-weight="600">读取失败</text><text x="18" y="99" fill="#56646D" font-size="13">保留