name: GitHub Android CI 编译环境
description: Provision the pinned official JDK, Python, and Android build packages.
inputs:
  mode:
    required: true
    description: build, native or v8
runs:
  using: composite
  steps:
    - name: 安装固定版本的 JDK 和 Python
      shell: bash
      run: python3 tools/build/platform_toolchain.py host "$RUNNER_TEMP/111-platform" jdk python
    - name: 安装并核对固定 Android SDK
      shell: bash
      env:
        CI_ANDROID_MODE: ${{ inputs.mode }}
      run: bash .github/scripts/ci-android-sdk.sh "$CI_ANDROID_MODE"
    - name: 校验固定 Gradle Wrapper
      if: inputs.mode == 'build'
      shell: bash
      run: |
        printf '%s  %s\n' 621008afc4f5d59357fcf06ffa644dd5aade5e091bdc363742710445f73cdaf8 android-app/gradle/wrapper/gradle-wrapper.jar | sha256sum -c -
    - name: 使用项目 Gradle Wrapper 和官方依赖缓存
      if: inputs.mode == 'build'
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
