name: GitHub Rust CI 环境
description: Official rustup toolchain and immutable source dependency cache.
inputs:
  target:
    required: false
    default: ''
    description: Optional Android target
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
      with:
        toolchain: '1.99.1'
        targets: ${{ inputs.target }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/registry/index
          ~/.cargo/git/db
        key: cargo-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream/codex/codex-rs/Cargo.lock') }}-${{ inputs.target || 'host' }}
        restore-keys: |
          cargo-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream/codex/codex-rs/Cargo.lock') }}-
