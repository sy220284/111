name: 源码恢复验证
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'embedded/**'
      - 'plugin-testing-kit/**'
      - 'tools/bundled/**'
      - 'resources/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'tools/analysis/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/source-restoration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'embedded/**'
      - 'plugin-testing-kit/**'
      - 'tools/bundled/**'
      - 'resources/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'tools/analysis/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/source-restoration.yml'
  workflow_dispatch:

jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出恢复源码
        uses: actions/checkout@v4
      - name: 使用 Node.js 22.16
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: 按锁定版本安装运行依赖与 TypeScript 语法分析器
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 先检查函数证据与源码指纹，防止改名后索引/账本陈旧
        run: |
          npm run check:source-fingerprint
          npm run check:function-evidence
          npm run audit:functions
      - name: 执行源码与功能级离线验证（含跨版本只读匹配器）
        run: npm test
      - name: 实测 CLI 帮助入口（独立标记运行兼容状态）
        id: cli_runtime
        run: |
          if timeout 45s npm run verify:runtime; then
            exit 0
          fi
          echo "CLI 启动失败，重跑一次输出 CommonJS 加载调用位置"
          NODE_DEBUG=module timeout 45s npm run verify:runtime
      - name: 记录真实运行结果到工作流摘要
        if: always()
        run: |
          if [ "${{ steps.cli_runtime.outcome }}" = "success" ]; then
            echo "CLI --help：真实 Node 入口通过（不代表完整业务会话通过）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CLI --help：真实 Node 入口未通过，需按本次日志修复运行时兼容；静态测试结果不能替代运行验收。" >> "$GITHUB_STEP_SUMMARY"
          fi

  code-graph:
    name: 全量依赖和函数候选调用图分析
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: 安装锁定版本依赖并执行调用图边界回归
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:code-graph
      - name: 生成完整依赖/函数调用候选图及带证据语义清单
        run: |
          set -euo pipefail
          node --max-old-space-size=4096 tools/analysis/code-graph.cjs scan --full --output "$RUNNER_TEMP/111-code-graph.json" > /dev/null
          node --max-old-space-size=4096 tools/analysis/closure-audit.cjs \
            --graph "$RUNNER_TEMP/111-code-graph.json" \
            --output "$RUNNER_TEMP/111-code-semantic-closure.json"
          node - "$RUNNER_TEMP/111-code-graph.json" <<'NODE'
          const fs=require('node:fs');
          const graph=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(graph.errors.length)throw Error('Graph parser or relative dependency errors: '+JSON.stringify(graph.errors.slice(0,5)));
          if(graph.summary.modules!==2553)throw Error('2551 main modules + 2 runtime adapter modules were not scanned');
          const text=[
            '## 111 依赖与函数候选调用图',
            '- 已扫描模块：'+graph.summary.modules,
            '- 静态模块依赖：'+graph.summary.moduleDependencies,
            '- 调用表达式：'+graph.summary.callExpressions,
            '- 候选函数调用：'+graph.summary.candidateResolvedCalls,
            '- 无法可靠解析的调用表达式：'+graph.summary.unresolvedCallExpressions,
            '- 已有定向测试语义证据：'+graph.summary.recordedSemantics,
            '**注意：候选调用边不等于已在运行时实际执行，也不是完整的语义恢复。**'
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text+'\n');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/111-code-graph-summary.json', JSON.stringify(graph.summary,null,2)+'\n');
          NODE
      - name: 上传可重复审计的依赖图谱与汇总
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 111-code-graph-evidence
          path: |
            ${{ runner.temp }}/111-code-graph.json
            ${{ runner.temp }}/111-code-graph-summary.json
            ${{ runner.temp }}/111-code-semantic-closure.json
          retention-days: 30
          if-no-files-found: error
