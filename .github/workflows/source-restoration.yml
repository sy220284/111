name: 源码恢复验证
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/source-restoration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/source-restoration.yml'
  workflow_dispatch:

jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出恢复源码
        uses: actions/checkout@v4
      - name: 使用 Node.js 22.16
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: 按锁定版本安装运行依赖与 TypeScript 语法分析器
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 输出函数索引实际指纹以便精确复核
        continue-on-error: true
        run: node scripts/source-function-index.cjs --check
      - name: 先检查函数证据与源码指纹，防止改名后索引/账本陈旧
        run: |
          npm run check:source-fingerprint
          npm run check:function-evidence
          npm run audit:functions
      - name: 执行源码与功能级离线验证
        run: npm test
      - name: 实测 CLI 帮助入口（独立标记运行兼容状态）
        id: cli_runtime
        run: |
          if timeout 45s npm run verify:runtime; then
            exit 0
          fi
          echo "CLI 启动失败，重跑一次输出 CommonJS 加载调用位置"
          NODE_DEBUG=module timeout 45s npm run verify:runtime
      - name: 记录真实运行结果到工作流摘要
        if: always()
        run: |
          if [ "${{ steps.cli_runtime.outcome }}" = "success" ]; then
            echo "CLI --help：真实 Node 入口通过（不代表完整业务会话通过）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CLI --help：真实 Node 入口未通过，需按本次日志修复运行时兼容；静态测试结果不能替代运行验收。" >> "$GITHUB_STEP_SUMMARY"
          fi
