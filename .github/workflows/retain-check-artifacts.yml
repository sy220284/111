name: 仓库管家（检查产物、分支与缓存）

on:
  workflow_run:
    workflows: ['111 Android 正式发布']
    types: [completed]
    branches: [main]
  pull_request_target:
    types: [closed, synchronize]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只预览，不删除
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: retain-check-artifacts-main
  cancel-in-progress: false

jobs:
  superseded-queue:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request_target' && github.event.action == 'synchronize' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Privileged operation: always execute trusted main, never PR source.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/ci
      - name: 验证过期作业判定
        run: python3 -m unittest discover -s .github/scripts -p test_ci_queue_policy.py
      - name: 收敛已被替代的空闲验收队列
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          if [ -n "$PR_NUMBER" ]; then args+=(--pr "$PR_NUMBER"); fi
          if [ "$DRY_RUN" != true ]; then args+=(--apply); fi
          python3 .github/scripts/ci_queue_policy.py "${args[@]}"
  retain:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == false)
    permissions:
      contents: read
      actions: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/scripts
            .github/ci
      - name: 检查清理规则
        run: python3 -m unittest discover -s .github/scripts -p test_retain_check_artifacts.py
      - name: 清理已被新版替代的检查产物
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          if [ "$DRY_RUN" != true ]; then args+=(--apply); fi
          python3 .github/scripts/retain_check_artifacts.py "${args[@]}"
  stewardship:
    needs: retain
    if: needs.retain.result == 'success'
    permissions:
      contents: write
      actions: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/scripts
            .github/ci
      - name: 验证管家规则
        run: python3 -m unittest discover -s .github/scripts -p test_repository_steward.py
      - name: 清理安全合并分支与失效缓存
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          if [ "$DRY_RUN" != true ]; then args+=(--apply); fi
          python3 .github/scripts/repository_steward.py "${args[@]}"
