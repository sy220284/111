name: 仓库管家（检查产物、分支与缓存）

on:
  workflow_run:
    workflows: ['111 Android 正式发布']
    types: [completed]
    branches: [main]
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只预览，不删除
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: retain-check-artifacts-main
  cancel-in-progress: false

jobs:
  retain:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'pull_request_target' && github.event.pull_request.merged == false)
    permissions:
      contents: read
      actions: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/scripts
            .github/ci
      - name: 检查清理规则
        run: python3 -m unittest discover -s .github/scripts -p test_retain_check_artifacts.py
      - name: 清理已被新版替代的检查产物
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          if [ "$DRY_RUN" != true ]; then args+=(--apply); fi
          python3 .github/scripts/retain_check_artifacts.py "${args[@]}"
  stewardship:
    needs: retain
    if: needs.retain.result == 'success'
    permissions:
      contents: write
      actions: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/scripts
            .github/ci
      - name: 验证管家规则
        run: python3 -m unittest discover -s .github/scripts -p test_repository_steward.py
      - name: 清理安全合并分支与失效缓存
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          if [ "$DRY_RUN" != true ]; then args+=(--apply); fi
          python3 .github/scripts/repository_steward.py "${args[@]}"
