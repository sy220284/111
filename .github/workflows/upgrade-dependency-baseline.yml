name: 111 技术栈升级候选依赖基线
on:
  push:
    branches: [upgrade/111-tech-stack-20261127]
permissions:
  contents: write
jobs:
  baseline:
    if: github.repository == 'sy220284/111' && github.ref == 'refs/heads/upgrade/111-tech-stack-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 固定官方 npm、Python ABI 与签名 APT 工具版本
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/dev/resolve_upgrade_locks.py
          git diff --check
          git add -- tools/runtime/npm-lock.json tools/dev/requirements-host.lock tools/build/native-toolchain.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '锁定经核验的 npm、Python ABI 和原生辅助工具发行版本'
            gh auth setup-git
            git push origin HEAD:refs/heads/upgrade/111-tech-stack-20261127
          fi
          python3 -m unittest discover -s tools/dev -p 'test_*.py'
          python3 -m unittest discover -s tools/build -p 'test_*.py'
          python3 -m unittest discover -s android-app/tools -p 'test_v8_toolchain_provenance.py'
      - name: 候选版本编译环境
        uses: ./.github/actions/ci-android
        with:
          mode: build
      - name: 从官方仓库真实生成依赖基线
        shell: bash
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/dependency-baseline.jks"
          keytool -genkeypair -noprompt -keystore "$STORE" -storetype PKCS12 -alias 111-release -keyalg RSA -keysize 2048 -validity 1 -storepass ci-only-password -keypass ci-only-password -dname "CN=111 dependency baseline"
          export CODEX_RELEASE_KEYSTORE_PATH="$STORE" CODEX_RELEASE_PASSWORD=ci-only-password CODEX_RELEASE_KEY_ALIAS=111-release
          tasks=(:app:verifyAndroidTestRuntime :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease :app:assembleRelease)
          ./android-app/gradlew -p android-app "${tasks[@]}" -PcodexReleaseVersionName=0.1.0-111.999 -PcodexReleaseVersionCode=999 --write-locks --write-verification-metadata sha256 --no-daemon --stacktrace
          test -s android-app/app/gradle.lockfile
          test -s android-app/gradle/verification-metadata.xml
          # Existing accepted artifact hashes must never be widened or replaced.
          git show HEAD:android-app/gradle/verification-metadata.xml > "$RUNNER_TEMP/old-verification.xml"
          python3 - "$RUNNER_TEMP/old-verification.xml" android-app/gradle/verification-metadata.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          ns = {'v':'https://schema.gradle.org/dependency-verification'}
          def parse(path):
              r = ET.parse(path).getroot()
              conf = r.find('v:configuration', ns)
              assert conf.findtext('v:verify-metadata', namespaces=ns) == 'true'
              artifacts = {}
              for c in r.findall('v:components/v:component', ns):
                  for a in c.findall('v:artifact', ns):
                      k = (c.get('group'), c.get('name'), c.get('version'), a.get('name'))
                      assert k not in artifacts, k
                      artifacts[k] = {h.get('value') for h in a.findall('v:sha256', ns)}
              return artifacts
          old, new = map(parse, sys.argv[1:])
          for k, hashes in old.items():
              assert new.get(k) == hashes, ('已有可信摘要变化', k)
          for k in new.keys() - old.keys():
              assert len(new[k]) == 1 and all(len(h) == 64 for h in new[k]), ('新增摘要异常', k)
          print('保留已有摘要:', len(old), '新增待审查摘要:', len(new.keys()-old.keys()))
          PY
          ./android-app/gradlew -p android-app "${tasks[@]}" -PcodexReleaseVersionName=0.1.0-111.999 -PcodexReleaseVersionCode=999 --dependency-verification strict --no-daemon --stacktrace
      - name: 保留可审查的依赖锁和构建报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 111-upgrade-gradle-baseline-review
          path: |
            android-app/app/gradle.lockfile
            android-app/gradle/verification-metadata.xml
            android-app/app/build/reports/
          if-no-files-found: error
      - name: 将实际严格验收通过的基线提交到候选分支
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          git add -- android-app/app/gradle.lockfile android-app/gradle/verification-metadata.xml
          git rm -- .github/workflows/upgrade-dependency-baseline.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '生成新版 Gradle 真实依赖锁并通过严格编译检查'
          gh auth setup-git
          git push origin HEAD:refs/heads/upgrade/111-tech-stack-20261127
