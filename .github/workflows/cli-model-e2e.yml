name: CLI 本地模型流端到端验收
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'docs/verification/2026-10-28-全仓联合验收触发.md'
      - 'tests/cli-live-model-turn.test.cjs'
      - 'core/**'
      - 'plugins/**'
      - 'embedded/**'
      - 'plugin-testing-kit/**'
      - 'tools/bundled/**'
      - 'bin/**'
      - 'runtime/**'
      - 'package.json'
      - '.github/workflows/cli-model-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'docs/verification/2026-10-28-全仓联合验收触发.md'
      - 'tests/cli-live-model-turn.test.cjs'
      - 'core/**'
      - 'plugins/**'
      - 'embedded/**'
      - 'plugin-testing-kit/**'
      - 'tools/bundled/**'
      - 'bin/**'
      - 'runtime/**'
      - 'package.json'
      - '.github/workflows/cli-model-e2e.yml'
permissions:
  contents: read
jobs:
  local-model-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: 安装固定版本依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 真正运行 CLI 模型流业务链，连接本地模拟服务
        run: npm run check:cli-live-model-turn
