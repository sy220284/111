name: 源码恢复交付门禁

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  restoration-delivery:
    name: 恢复交付真实性检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 固定检出当前 PR SHA 和完整历史
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 使用仓库固定 Node 版本
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: 按 lockfile 安装 AST 检查依赖（禁止安装脚本）
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 使用 PR base 原版门禁审查，禁止 PR 自改验证器自放行
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/check-restoration-delivery.cjs" > "$RUNNER_TEMP/trusted-restoration-gate.cjs"
          node "$RUNNER_TEMP/trusted-restoration-gate.cjs"
      - name: 测试候选门禁的正反例
        run: node --test tests/restoration-delivery-gate.test.cjs
      - name: 门禁源码变更时也执行提案自身的验证与增量测试
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA"...HEAD | grep -Fxq 'scripts/check-restoration-delivery.cjs'; then
            node scripts/check-restoration-delivery.cjs
          fi
