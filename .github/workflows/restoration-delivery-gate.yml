name: 源码恢复交付门禁

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  restoration-delivery:
    name: 恢复交付真实性检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 固定检出当前 PR SHA 和完整历史
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 使用仓库固定 Node 版本
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: 安装 PR 的测试依赖，禁用安装脚本
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 按 PR base 锁文件隔离安装可信检查器依赖
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/111-gate-trusted"
          mkdir -p "$trusted"
          git show "$BASE_SHA:package.json" > "$trusted/package.json"
          git show "$BASE_SHA:package-lock.json" > "$trusted/package-lock.json"
          git show "$BASE_SHA:scripts/check-restoration-delivery.cjs" > "$trusted/trusted-gate.cjs"
          npm ci --prefix "$trusted" --ignore-scripts --no-audit --no-fund
      - name: 使用可信基线验证器检查真实 PR，并运行所改动的测试
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/111-gate-trusted/node_modules
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/111-gate-trusted/trusted-gate.cjs"
      - name: 验证门禁提案自己的正反例
        run: node --test tests/governance/restoration-delivery-gate.test.cjs
      - name: 门禁源码变更时也执行提案自身验证
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA"...HEAD | grep -Fxq 'scripts/check-restoration-delivery.cjs'; then
            node scripts/check-restoration-delivery.cjs
          fi
