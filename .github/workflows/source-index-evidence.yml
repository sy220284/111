name: 源码真实指纹重算取证
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'plugins/**'
      - 'embedded/**'
      - 'plugin-testing-kit/**'
      - 'tools/bundled/**'
      - 'scripts/source-function-index.cjs'
      - '.github/workflows/source-index-evidence.yml'
permissions:
  contents: read
jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: 固定依赖安装
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 独立重算2551个模块完整AST与源码指纹
        run: |
          set -euo pipefail
          node scripts/source-function-index.cjs --full > /dev/null
          echo 'SOURCE_INDEX_EVIDENCE_BEGIN'
          cat resources/function-summary.json
          echo 'SOURCE_INDEX_EVIDENCE_END'
      - name: 上传完整重算证据供审查后更新仓库
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 111-source-index-recomputed
          path: |
            resources/function-summary.json
            .generated/module-index.json
            .generated/function-callsites.json
          retention-days: 30
          if-no-files-found: error
