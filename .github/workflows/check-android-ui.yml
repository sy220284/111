name: 安卓界面与协议独立验收

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/check-android-ui.yml"
      - ".github/workflows/build-android.yml"
      - ".github/workflows/build-native-codex.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/select_native_artifacts.py"
      - ".github/scripts/test_native_reuse.py"
      - "CODEX_UPSTREAM_COMMIT"
      - "upstream/codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-android-ui-check-${{ github.ref_name }}
  # Keep the latest branch revision under test; older revisions are superseded.
  cancel-in-progress: true

jobs:
  verify-ui:
    name: Kotlin 编译、协议单元测试与 Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 仅检出 Android UI 源码
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /android-app/
            /upstream/codex/codex-rs/app-server-protocol/src/protocol/common.rs
          sparse-checkout-cone-mode: false
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android API 35
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: 对照官方 Codex 接口清单，验证 UI 中所有协议方法
        run: |
          python3 android-app/tools/verify_protocol_methods.py \
            --protocol upstream/codex/codex-rs/app-server-protocol/src/protocol/common.rs \
            --sources android-app/app/src/main/java
      - name: 自动核对28个页面与实际RPC引用并生成审计矩阵
        run: |
          python3 android-app/tools/audit_ui_feature_coverage.py \
            --sources android-app/app/src/main/java \
            --protocol upstream/codex/codex-rs/app-server-protocol/src/protocol/common.rs \
            --policy android-app/tools/ui_surface_policy.json \
            --report ui-coverage.md \
            --json-report ui-coverage.json
      - name: 验证 Compose、协议测试与静态检查
        run: gradle -p android-app :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: 保存测试与 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-ui-check-reports
          path: |
            android-app/app/build/reports/tests/
            android-app/app/build/reports/lint-results-debug.html
            android-app/app/build/test-results/testDebugUnitTest/
            ui-coverage.md
            ui-coverage.json
          if-no-files-found: ignore
          retention-days: 14
      - name: 保存独立编译的 UI 与设备测试安装包
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-ui-apks
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

  ui-emulator:
    name: Android 35 · ${{ matrix.width_dp }}dp UI 交互与截图验收
    needs: verify-ui
    strategy:
      fail-fast: false
      matrix:
        width_dp: [360, 393, 411]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: 取回 UI APK
        uses: actions/download-artifact@v4
        with:
          name: codex-android-ui-apks
          path: apks
      - name: 允许模拟器硬件加速
        run: |
          sudo adduser "$USER" kvm || true
          sudo chmod 666 /dev/kvm
      - name: 在真实 Android 环境验证侧栏导航并生成首页截图
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          # 使用 AOSP 系统镜像，避免不参与测试的 Pixel Launcher 进程
          # 在动态切换 360/393/411dp 后产生 ANR 系统弹窗，污染证据截图。
          target: default
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r apks/debug/app-debug.apk
            adb install -r apks/androidTest/debug/app-debug-androidTest.apk
            # The three phone-width checks share the same Android 35 APK, and never run 320dp.
            adb shell wm size ${{ matrix.width_dp }}x800
            adb shell wm density 160
            test "$(adb shell wm size | awk '/Override size:/ {print $3}' | tr -d '\r')" = "${{ matrix.width_dp }}x800"
            test "$(adb shell wm density | awk '/(Override|Physical) density:/ {value=$3} END {print value}' | tr -d '\r')" = "160"
            # The instrumentation test captures the home screen after a visible
            # Compose assertion, so slow devices cannot record the splash screen.
            adb shell am start -W -n io.github.sy220284.codexandroid/.MainActivity
            mkdir -p ui-screenshots
            adb shell am instrument -w -r -e class io.github.sy220284.codexandroid.UiNavigationInstrumentedTest,io.github.sy220284.codexandroid.CodexOverlayInstrumentedTest,io.github.sy220284.codexandroid.UiPopulatedSubpagesInstrumentedTest io.github.sy220284.codexandroid.test/androidx.test.runner.AndroidJUnitRunner | tee ui-instrument-result.log
            # Collect images even when assertions fail, so the failing state can be inspected.
            missing=0
            for SCREEN in home sidebar chat settings-hub tools-sheet attachment-sheet engine-status model-sheet account appearance mode-sheet terminal-confirm evidence-sheet thread-library thread-full-search account-usage account-limits workspace-files chat-toolbar diff-reader plugins account-sessions plugin-search audit-providers audit-skills audit-apps audit-mcp audit-hooks audit-environments audit-security audit-config audit-diagnostics audit-queue audit-approvals audit-provider-editor audit-config-editor audit-environment-editor audit-security-profiles audit-about audit-permission-request audit-thread-context audit-thread-history audit-advanced-timeline audit-thread-attachments audit-review-sheet audit-goals-sheet audit-mcp-tool-form audit-mcp-resource audit-mcp-elicitation audit-plugin-detail; do
              if adb pull "/sdcard/Android/data/io.github.sy220284.codexandroid/files/${SCREEN}-android35.png" "ui-screenshots/${SCREEN}-android35.png" >/dev/null 2>&1 && test -s "ui-screenshots/${SCREEN}-android35.png"; then
                echo "SCREENSHOT_OK ${SCREEN}"
              else
                echo "SCREENSHOT_MISSING ${SCREEN}"
                missing=$((missing + 1))
              fi
            done
            # A portable offline visual gallery is included in the artifact.
            python3 - <<'PY'
            from pathlib import Path
            from html import escape
            files = sorted(Path("ui-screenshots").glob("*.png"))
            cards = "".join(
                '<a class="card" href="' + escape(f.name) + '"><img loading="lazy" src="' +
                escape(f.name) + '" alt="' + escape(f.stem) + '"><span>' +
                escape(f.stem) + '</span></a>'
                for f in files
            )
            html = ('<!doctype html><html lang="zh-CN"><meta charset="utf-8">'
                    '<meta name="viewport" content="width=device-width,initial-scale=1">'
                    '<title>Codex Android · CI 界面验收</title>'
                    '<style>body{font:15px system-ui,sans-serif;background:#f6f7f7;'
                    'color:#263139;margin:24px}h1{font-size:24px}small{color:#56646d}'
                    '.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));'
                    'gap:20px}.card{display:block;text-decoration:none;color:inherit;background:white;'
                    'border:1px solid #d8dee1;border-radius:12px;padding:10px}'
                    'img{width:100%;height:350px;object-fit:contain;display:block}'
                    'span{display:block;font-size:12px;word-break:break-all;margin-top:9px}</style>'
                    '<h1>Android 35 · 逐页截图</h1><small>当前实际捕获 ' +
                    str(len(files)) + ' 张。点击查看完整原图；所有屏幕来自设备端。</small>'
                    '<div class="grid">' + cards + '</div></html>')
            Path("ui-screenshots/index.html").write_text(html, encoding="utf-8")
            PY
            # Fail strict verification after preserving debugging evidence.
            grep -Fq 'OK (' ui-instrument-result.log
            test "$missing" -eq 0
            file ui-screenshots/*.png
      - name: 保存 UI 设备测试与真实屏幕截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-ui-device-evidence-${{ matrix.width_dp }}dp
          path: |
            ui-instrument-result.log
            ui-screenshots/
          if-no-files-found: ignore
          retention-days: 14
