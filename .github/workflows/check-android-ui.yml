name: 安卓界面与协议独立验收

on:
  # Feature work is verified by its PR once. Main continues to run the same
  # acceptance after merge for the signed release gate.
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "docs/设计系统.md"
      - "docs/对标应用29项界面交付核对表-20261123.md"
      - "docs/第五版接口与界面组件映射矩阵.md"
      - "docs/接口协议动作清单与落地验收台账-20261122.md"
      - "docs/第五版全接口组件与功能接入说明.md"
      - "docs/ui-assets/**"
      - ".github/workflows/check-android-ui.yml"
      - ".github/workflows/build-android.yml"
      - ".github/workflows/build-native-codex.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/select_release_candidate.py"
      - ".github/scripts/test_select_release_candidate.py"
      - ".github/scripts/verify_release_acceptance.py"
      - ".github/scripts/test_verify_release_acceptance.py"
      - ".github/scripts/select_native_artifacts.py"
      - ".github/scripts/test_native_reuse.py"
      - ".github/scripts/test_ci_scope.py"
      - "upstream/codex/codex-rs/**"
  pull_request:
    paths:
      - "android-app/**"
      - "docs/设计系统.md"
      - "docs/对标应用29项界面交付核对表-20261123.md"
      - "docs/第五版接口与界面组件映射矩阵.md"
      - "docs/接口协议动作清单与落地验收台账-20261122.md"
      - "docs/第五版全接口组件与功能接入说明.md"
      - "docs/ui-assets/**"
      - ".github/workflows/check-android-ui.yml"
      - ".github/workflows/build-android.yml"
      - ".github/workflows/build-native-codex.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/select_release_candidate.py"
      - ".github/scripts/test_select_release_candidate.py"
      - ".github/scripts/verify_release_acceptance.py"
      - ".github/scripts/test_verify_release_acceptance.py"
      - ".github/scripts/select_native_artifacts.py"
      - ".github/scripts/test_native_reuse.py"
      - ".github/scripts/test_ci_scope.py"
      - "upstream/codex/codex-rs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-android-ui-check-${{ github.ref_name }}
  # Keep the latest branch revision under test; older revisions are superseded.
  cancel-in-progress: true

jobs:
  verify-ui:
    name: Kotlin 编译、协议单元测试与 Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 仅检出 Android UI 源码
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /android-app/
            /.github/workflows/
            /.github/scripts/
            /docs/设计系统.md
            /docs/对标应用29项界面交付核对表-20261123.md
            /docs/第五版接口与界面组件映射矩阵.md
            /docs/接口协议动作清单与落地验收台账-20261122.md
            /docs/ui-assets/
            /upstream/codex/codex-rs/app-server-protocol/src/protocol/common.rs
            /upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/thread.rs
            /upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/turn.rs
            /upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/project.rs
            /upstream/codex/codex-rs/app-server-protocol/schema/json/v2/
          sparse-checkout-cone-mode: false
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android API 35
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: 验证 CI 触发范围与原生产物复用不变量
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_ci_scope.py'
          python3 -m unittest discover -s .github/scripts -p 'test_native_reuse.py'
      - name: 校验官方Rust协议方法、方向、DTO和通知清单
        run: python3 -m unittest discover -s android-app/tools -p 'test_protocol_contract.py'
      - name: 对照Rust类型与稳定JSON Schema校验请求响应字段
        run: |
          python3 android-app/tools/check_protocol_schema_alignment.py \
            --protocol upstream/codex/codex-rs/app-server-protocol/src/protocol/common.rs \
            --schemas upstream/codex/codex-rs/app-server-protocol/schema/json/v2 \
            --thread-types upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/thread.rs \
            --turn-types upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/turn.rs \
            --android-project android-app/app/src/main/java/io/github/sy220284/codexandroid/ProjectRequestContract.kt \
            --android-turn android-app/app/src/main/java/io/github/sy220284/codexandroid/TurnRequestContract.kt \
            --android-connection android-app/app/src/main/java/io/github/sy220284/codexandroid/CodexConnection.kt \
            --report protocol-contract-audit.json
          python3 -m unittest discover -s android-app/tools -p 'test_check_protocol_schema_alignment.py'
      - name: 验证协议校验器正确区分请求与通知
        run: python3 -m unittest discover -s android-app/tools -p 'test_verify_protocol_methods.py'
      - name: 对照官方 Codex 接口清单，验证 UI 中所有协议方法
        run: |
          python3 android-app/tools/verify_protocol_methods.py \
            --protocol upstream/codex/codex-rs/app-server-protocol/src/protocol/common.rs \
            --sources android-app/app/src/main/java
      - name: UI调用表达式与普通协议字符串分层检查
        run: python3 -m unittest discover -s android-app/tools -p 'test_audit_ui_rpc_calls.py'
      - name: 审核技能与插件写入状态及检索关键词绑定
        run: python3 -m unittest discover -s android-app/tools -p 'test_ui_mutation_keys.py'
      - name: 自动核对可见页面与实际RPC引用并生成审计矩阵
        run: |
          python3 android-app/tools/audit_ui_feature_coverage.py \
            --sources android-app/app/src/main/java \
            --protocol upstream/codex/codex-rs/app-server-protocol/src/protocol/common.rs \
            --policy android-app/tools/ui_surface_policy.json \
            --report ui-coverage.md \
            --json-report ui-coverage.json
      - name: 全量核查功能入口、路由、回归证据与官方协议方法
        run: |
          python3 -m unittest discover -s android-app/tools -p 'test_check_full_feature_workflows.py'
          python3 android-app/tools/check_full_feature_workflows.py \
            --repository . \
            --json-report full-feature-workflows.json \
            --report full-feature-workflows.md
      - name: 检查全页面及子页面共享交互覆盖
        run: python3 android-app/tools/check_interaction_coverage.py --repository . --report interaction-coverage.json
      - name: 从唯一协议策略核对 UI 组件映射文档
        run: |
          python3 android-app/tools/sync_ui_protocol_docs.py --check
          python3 -m unittest discover -s android-app/tools -p 'test_sync_ui_protocol_docs.py'
      - name: 三方核验上游协议、Android 方法目录与界面层级
        run: |
          python3 android-app/tools/check_ui_protocol_matrix.py \
            --matrix android-app/app/src/main/java/io/github/sy220284/codexandroid/UiProtocolMatrix.kt \
            --policy android-app/tools/ui_surface_policy.json \
            --protocol upstream/codex/codex-rs/app-server-protocol/src/protocol/common.rs \
            --pages android-app/app/src/main/java/io/github/sy220284/codexandroid/AppNavigation.kt \
            --features android-app/app/src/main/java/io/github/sy220284/codexandroid/UiFeatureCatalog.kt \
            --sources android-app/app/src/main/java
          python3 android-app/tools/test_check_ui_protocol_matrix.py
      - name: 检查 Kotlin 源文件体量并阻断超大文件回归
        run: |
          python3 android-app/tools/check_kotlin_file_budget.py \
            --sources android-app/app/src/main/java --max-lines 760
      - name: 自动核验 Compose 主题颜色与设计文档一致
        run: |
          python3 android-app/tools/check_design_system_tokens.py \
            --source android-app/app/src/main/java/io/github/sy220284/codexandroid/VisualSystem.kt \
            --spec docs/设计系统.md \
            --tokens docs/ui-assets/tokens.json \
            --motion android-app/app/src/main/java/io/github/sy220284/codexandroid/InteractionSystem.kt
          python3 android-app/tools/test_check_design_system_tokens.py
      - name: 逐份核验 UI 素材、Android 原生矢量资源、调用页面与测试声明
        run: |
          python3 -m unittest discover -s android-app/tools -p 'test_check_ui_assets.py'
          python3 android-app/tools/check_ui_assets.py --repository . --report ui-assets-audit.json --markdown ui-assets-audit.md
      - name: 核验生产共享控件及旧控件迁移
        run: |
          python3 -m unittest discover -s android-app/tools -p 'test_check_component_system.py'
          python3 android-app/tools/check_component_system.py --repository . --report component-system-audit.json
      - name: 验证截图收集器会自动发现新增页面与阻断缺失截图
        run: python3 -m unittest discover -s android-app/tools -p 'test_collect_ui_screenshots.py'
      - name: 验证自更新证据判定与安装完成条件
        run: python3 -m unittest discover -s android-app/tools -p 'test_verify_self_update_open.py'
      - name: 验证 Compose、协议测试与静态检查
        run: gradle -p android-app :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: 使用真实 Kotlin 请求样例逐字段校验 Rust Schema
        run: |
          test -s android-app/app/build/protocol-fixtures/requests.json
          python3 -m venv .ci-schema-venv
          .ci-schema-venv/bin/python -m pip install --disable-pip-version-check 'jsonschema==4.26.0'
          .ci-schema-venv/bin/python -m unittest discover \
            -s android-app/tools -p 'test_check_protocol_wire_fixtures.py'
          .ci-schema-venv/bin/python android-app/tools/check_protocol_wire_fixtures.py \
            --protocol upstream/codex/codex-rs/app-server-protocol/src/protocol/common.rs \
            --schemas upstream/codex/codex-rs/app-server-protocol/schema/json/v2 \
            --project-rust upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/project.rs \
            --thread-rust upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/thread.rs \
            --turn-rust upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/turn.rs \
            --fixtures android-app/app/build/protocol-fixtures/requests.json \
            --report wire-fixtures-audit.json
      - name: 保存测试与 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-ui-check-reports
          path: |
            component-system-audit.json
            ui-assets-audit.json
            ui-assets-audit.md
            android-app/app/build/reports/tests/
            android-app/app/build/reports/lint-results-debug.html
            android-app/app/build/test-results/testDebugUnitTest/
            ui-coverage.md
            ui-coverage.json
            full-feature-workflows.md
            full-feature-workflows.json
            interaction-coverage.json
            protocol-contract-audit.json
            wire-fixtures-audit.json
            android-app/app/build/protocol-fixtures/requests.json
          if-no-files-found: ignore
          retention-days: 14
      - name: 保存独立编译的 UI 与设备测试安装包
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-ui-apks
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

  ui-emulator:
    name: Android 35 · ${{ matrix.width_dp }}dp UI 交互与截图验收
    needs: verify-ui
    strategy:
      fail-fast: false
      matrix:
        width_dp: [360, 393, 411]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: 检出截图采集器
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /android-app/tools/collect_ui_screenshots.py
            /android-app/tools/verify_self_update_open.py
          sparse-checkout-cone-mode: false
      - name: 取回 UI APK
        uses: actions/download-artifact@v4
        with:
          name: codex-android-ui-apks
          path: apks
      - name: 允许模拟器硬件加速
        run: |
          sudo adduser "$USER" kvm || true
          sudo chmod 666 /dev/kvm
      - name: 在真实 Android 环境验证侧栏导航并生成首页截图
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          # 使用 AOSP 系统镜像，避免不参与测试的 Pixel Launcher 进程
          # 在动态切换 360/393/411dp 后产生 ANR 系统弹窗，污染证据截图。
          target: default
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r apks/debug/app-debug.apk
            adb shell appops set io.github.sy220284.codexandroid MANAGE_EXTERNAL_STORAGE allow
            adb install -r apks/androidTest/debug/app-debug-androidTest.apk
            # The three phone-width checks share the same Android 35 APK, and never run 320dp.
            adb shell wm size ${{ matrix.width_dp }}x800
            adb shell wm density 160
            # The emulator has a hardware keyboard. Explicitly allow the software IME,
            # otherwise performTextInput succeeds while keyboard screenshots are false positives.
            adb shell settings put secure show_ime_with_hard_keyboard 1
            test "$(adb shell settings get secure show_ime_with_hard_keyboard | tr -d '\r')" = "1"
            adb shell ime list -s
            test "$(adb shell ime list -s | tr -d '\r' | grep -c .)" -gt 0
            test "$(adb shell wm size | awk '/Override size:/ {print $3}' | tr -d '\r')" = "${{ matrix.width_dp }}x800"
            test "$(adb shell wm density | awk '/(Override|Physical) density:/ {value=$3} END {print value}' | tr -d '\r')" = "160"
            # The instrumentation test captures the home screen after a visible
            # Compose assertion, so slow devices cannot record the splash screen.
            adb shell am start -W -n io.github.sy220284.codexandroid/.MainActivity
            mkdir -p ui-screenshots
            # Clipboard-copy validation creates an Android system preview overlay. Run it last
            # so the overlay cannot cover screenshots of later business pages.
            adb shell am instrument -w -r -e class io.github.sy220284.codexandroid.UiNavigationInstrumentedTest,io.github.sy220284.codexandroid.UiPopulatedSubpagesInstrumentedTest,io.github.sy220284.codexandroid.CodexInteractionComponentsInstrumentedTest,io.github.sy220284.codexandroid.CodexOverlayInstrumentedTest,io.github.sy220284.codexandroid.EngineSettingInstrumentedTest,io.github.sy220284.codexandroid.SelfUpdateInstallerIntentInstrumentedTest io.github.sy220284.codexandroid.test/androidx.test.runner.AndroidJUnitRunner | tee ui-instrument-result.log
            # The emulator runner executes each script line separately.
            # A single Python process collects all screenshots even after test failure.
            python3 android-app/tools/collect_ui_screenshots.py
            grep -Fq 'OK (' ui-instrument-result.log
            test ! -s ui-screenshots/missing.txt
            file ui-screenshots/*.png
            # Only the 393dp emulator replaces the running app, then presses the
            # system installer's actual Install and Open buttons. Execute after
            # screenshots: package replacement kills the old app process.
            if [ "${{ matrix.width_dp }}" = "393" ]; then bash -o pipefail -c 'python3 android-app/tools/verify_self_update_open.py --apk apks/debug/app-debug.apk --commit "${{ github.sha }}" --report self-update-open.json --screenshot self-update-after-open.png 2>&1 | tee self-update-open.log'; fi
      - name: 保存 UI 设备测试与真实屏幕截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-ui-device-evidence-${{ matrix.width_dp }}dp
          path: |
            ui-instrument-result.log
            self-update-open.log
            self-update-open.json
            self-update-after-open.png
            ui-screenshots/
          if-no-files-found: ignore
          retention-days: 14
