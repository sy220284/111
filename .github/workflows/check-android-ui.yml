name: 安卓界面与协议独立验收

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/check-android-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-android-ui-check
  cancel-in-progress: true

jobs:
  verify-ui:
    name: Kotlin 编译、协议单元测试与 Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 仅检出 Android UI 源码
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /android-app/
            /upstream/codex/codex-rs/app-server-protocol/src/protocol/common.rs
          sparse-checkout-cone-mode: false
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android API 35
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: 对照官方 Codex 接口清单，验证 UI 中所有协议方法
        run: |
          python3 android-app/tools/verify_protocol_methods.py \
            --protocol upstream/codex/codex-rs/app-server-protocol/src/protocol/common.rs \
            --sources android-app/app/src/main/java
      - name: 验证 Compose、协议测试与静态检查
        run: gradle -p android-app :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: 保存测试与 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-ui-check-reports
          path: |
            android-app/app/build/reports/tests/
            android-app/app/build/reports/lint-results-debug.html
            android-app/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
      - name: 保存独立编译的 UI 与设备测试安装包
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-ui-apks
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

  ui-emulator:
    name: Android 模拟器侧栏交互与截图验收
    needs: verify-ui
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: 取回 UI APK
        uses: actions/download-artifact@v4
        with:
          name: codex-android-ui-apks
          path: apks
      - name: 允许模拟器硬件加速
        run: |
          sudo adduser "$USER" kvm || true
          sudo chmod 666 /dev/kvm
      - name: 在真实 Android 环境验证侧栏导航并生成首页截图
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r apks/debug/app-debug.apk
            adb install -r apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class io.github.sy220284.codexandroid.UiNavigationInstrumentedTest io.github.sy220284.codexandroid.test/androidx.test.runner.AndroidJUnitRunner | tee ui-instrument-result.log
            grep -Fq 'OK (' ui-instrument-result.log
            adb shell am start -W -n io.github.sy220284.codexandroid/.MainActivity
            mkdir -p ui-screenshots
            adb exec-out screencap -p > ui-screenshots/home-android35.png
            adb pull /sdcard/Android/data/io.github.sy220284.codexandroid/files/sidebar-android35.png ui-screenshots/sidebar-android35.png
            test -s ui-screenshots/home-android35.png
            test -s ui-screenshots/sidebar-android35.png
            file ui-screenshots/*.png
      - name: 保存 UI 设备测试与真实屏幕截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-ui-device-evidence
          path: |
            ui-instrument-result.log
            ui-screenshots/
          if-no-files-found: ignore
          retention-days: 14
