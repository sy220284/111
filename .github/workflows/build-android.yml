name: 安卓版本构建与验证

on:
  push:
    branches: [main]
    paths:
      - "android-app/app/**"
      - "android-app/build.gradle.kts"
      - "android-app/settings.gradle.kts"
      - "android-app/gradle.properties"
      - "android-app/tools/package_native_runtime.sh"
      - ".github/scripts/prepare-android-patcher.sh"
      - ".github/scripts/create-android-update-fixture.sh"
      - ".github/scripts/audit_apk_contents.py"
      - ".github/workflows/build-android.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/select_release_candidate.py"
      - ".github/scripts/test_select_release_candidate.py"
      - ".github/scripts/verify_release_acceptance.py"
      - ".github/scripts/test_verify_release_acceptance.py"
      - ".github/scripts/select_native_artifacts.py"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 原生 PR 验收限定的源提交 SHA；手动启动时留空
        required: false
        type: string
  workflow_run:
    workflows: ["编译 Android 原生 Codex 核心"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-android-build-${{ github.ref_name }}
  # Only the newest branch build is retained; older APKs are superseded.
  cancel-in-progress: true

jobs:
  preflight:
    name: 判断本次 push 是否等待原生工作流
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/scripts
      - name: 分类本次提交所涉及的构建输入
        id: decide
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 .github/scripts/decide_android_build.py \
            --before "$BEFORE_SHA" --after "$GITHUB_SHA" --output "$GITHUB_OUTPUT"

  build:
    needs: preflight
    if: >-
      always() &&
      ((github.event_name == 'push' &&
        needs.preflight.result == 'success' &&
        needs.preflight.outputs.should_build == 'true') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_sha == github.sha) ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.expected_sha == '' || inputs.expected_sha == github.sha)))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: 检出 Android 工程及源码版本标记
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            android-app
            upstream/codex/codex-rs/model-provider/catalogs
            CODEX_UPSTREAM_COMMIT
            .github/scripts
      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android 平台
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: 核验源码与编译配置并复用 ARM64 原生核心
        id: native
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(python3 .github/scripts/select_native_artifacts.py \
            --repo "$GITHUB_REPOSITORY" \
            --abis arm64-v8a)" || {
            echo "::error::当前源码没有可复用的 ARM64 原生核心，请先完成自动触发的原生构建"
            exit 1
          }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ARM64 复用已验证的内核构建：$RUN_ID"
      - name: 取回 ARM64 原生核心
        uses: actions/download-artifact@v4
        with:
          name: codex-android-native-arm64-v8a
          run-id: ${{ steps.native.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-arm64
      - name: 核验并装配 ARM64 手机原生核心
        shell: bash
        run: |
          set -euo pipefail
          STRIP="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          bash android-app/tools/package_native_runtime.sh arm64-v8a "$RUNNER_TEMP/native-arm64" "$STRIP"
          head -n 1 CODEX_UPSTREAM_COMMIT
      - name: 下载并校验官方安卓增量恢复组件
        shell: bash
        run: bash .github/scripts/prepare-android-patcher.sh arm64-v8a
      - name: 制作可在安卓端回放的真实增量更新样本
        shell: bash
        run: bash .github/scripts/create-android-update-fixture.sh
      - name: 编译 Android APK 和设备测试包（单元测试由独立 UI 工作流执行）
        run: gradle -p android-app :app:assembleDebug :app:assembleDebugAndroidTest -PcodexSplitAbi=true -PcodexReleaseTargetAbi=arm64-v8a --no-daemon --stacktrace
      - name: 验证 ARM64 APK 的原生功能组件和 ABI
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk"
          test -s "$APK"
          test -s "android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          unzip -tqq "$APK"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-arm64-files"
          for LIB in server code_mode_host rg git; do
            grep -Fxq "lib/arm64-v8a/libcodex_$LIB.so" "$RUNNER_TEMP/apk-arm64-files"
          done
          grep -Fxq 'lib/arm64-v8a/libhpatchz.so' "$RUNNER_TEMP/apk-arm64-files"
          grep -Fxq 'classes.dex' "$RUNNER_TEMP/apk-arm64-files"
          if grep -Eq '^lib/x86_64/' "$RUNNER_TEMP/apk-arm64-files"; then
            echo "::error::ARM64 手机 APK 混入 x86_64 原生库"
            exit 1
          fi
          python3 .github/scripts/audit_apk_contents.py --apk "$APK" --abi arm64-v8a --mode full
          sha256sum "$APK"

      - name: 上传 ARM64 安卓手机专用 APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-arm64-apk
          path: android-app/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: 上传设备仪器测试 APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-instrumentation-apk
          path: android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 30

  runtime-test:
    name: Android 35 真实内核及异常恢复验收
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出同提交 Android 工程与原生配方
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            android-app
            CODEX_UPSTREAM_COMMIT
            .github/scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: 核验与复用 x86_64 Android 原生核心
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(python3 .github/scripts/select_native_artifacts.py --repo "$GITHUB_REPOSITORY" --abis x86_64)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: codex-android-native-x86_64
          run-id: ${{ steps.native.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-x86
      - name: 装配仅供 Android 模拟器验收的真实内核 APK
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          STRIP="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          bash android-app/tools/package_native_runtime.sh x86_64 "$RUNNER_TEMP/native-x86" "$STRIP"
          bash .github/scripts/prepare-android-patcher.sh x86_64
          bash .github/scripts/create-android-update-fixture.sh
          gradle -p android-app :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
          python3 .github/scripts/audit_apk_contents.py --apk android-app/app/build/outputs/apk/debug/app-debug.apk --abi x86_64 --mode full
      - name: 允许模拟器硬件加速
        run: |
          sudo adduser "$USER" kvm || true
          sudo chmod 666 /dev/kvm
      - name: 执行真实内核启动、终端、回收与恢复
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-android-runtime-tests.sh android-app/app/build/outputs/apk/debug/app-debug.apk android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk x86_64 runtime-evidence
      - name: 保存真实内核验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-real-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 30

  verify-apk:
    name: ARM64 手机安装包二次核验
    needs: [build, runtime-test]
    # On workflow_run/dispatch, the push-only preflight is skipped. Avoid
    # inheriting its implicit success() guard through the build dependency.
    if: always() && needs.build.result == 'success' && needs.runtime-test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Jobs have separate workspaces. The APK and its audit script are both
      # required; the upload artifact contains only the APK, not repository files.
      - name: 检出 APK 安全检查脚本
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /.github/scripts/audit_apk_contents.py
          sparse-checkout-cone-mode: false
      - name: 取回 ARM64 原生 APK
        uses: actions/download-artifact@v4
        with:
          name: codex-android-arm64-apk
          path: apks
      - name: 验证完整性、ABI 与关键原生组件
        shell: bash
        run: |
          set -euo pipefail
          APK="apks/app-arm64-v8a-debug.apk"
          test -s "$APK"
          unzip -tqq "$APK"
          for LIB in server code_mode_host rg git; do
            unzip -Z1 "$APK" | grep -Fxq "lib/arm64-v8a/libcodex_$LIB.so"
          done
          if unzip -Z1 "$APK" | grep -Eq '^lib/x86_64/'; then
            echo "::error::ARM64 手机安装包混入其他架构"
            exit 1
          fi
          python3 .github/scripts/audit_apk_contents.py --apk "$APK" --abi arm64-v8a --mode full
          sha256sum "$APK"
