name: 安卓版本构建与验证

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: 检出项目
        uses: actions/checkout@v4
      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
      - name: 安装 Android 平台
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: 拉取官方 ARM64 Codex App Server 核心
        shell: bash
        run: |
          set -euo pipefail
          VERSION="rust-v0.171.0"
          ARCHIVE="$RUNNER_TEMP/codex-app-server.tar.gz"
          URL="https://github.com/openai/codex/releases/download/${VERSION}/codex-app-server-aarch64-unknown-linux-musl.tar.gz"
          curl -fL --retry 4 --retry-delay 3 -o "$ARCHIVE" "$URL"
          echo "565429aaa1f81c8b24d1747cb71670b9dfd1fd476094375e195d81d5c119a30a  $ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/codex-unpacked"
          tar -tzf "$ARCHIVE" | head -40
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/codex-unpacked"
          find "$RUNNER_TEMP/codex-unpacked" -maxdepth 3 -type f -print
          BINARY="$(find "$RUNNER_TEMP/codex-unpacked" -type f -name 'codex-app-server' -print -quit)"
          test -n "$BINARY"
          file "$BINARY"
          readelf -h "$BINARY" | grep -q 'AArch64'
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a
          cp "$BINARY" android-app/app/src/main/jniLibs/arm64-v8a/libcodex_server.so
          chmod 755 android-app/app/src/main/jniLibs/arm64-v8a/libcodex_server.so
          echo "${VERSION}" > android-app/app/src/main/assets-core-version.txt
      - name: 编译 Android Debug APK
        run: gradle -p android-app :app:assembleDebug --no-daemon --stacktrace
      - name: 核查 APK 含运行核心及应用代码
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libcodex_server.so'
          unzip -l "$APK" | grep 'classes.dex'
          sha256sum "$APK"
      - name: 上传可安装包
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
