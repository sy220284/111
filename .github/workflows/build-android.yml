name: 安卓版本构建与验证

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"
      - ".github/scripts/select_native_artifacts.py"
  workflow_dispatch:
  workflow_run:
    workflows: ["编译 Android 原生 Codex 核心"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-android-build-${{ github.ref_name }}
  # Only the newest branch build is retained; older APKs are superseded.
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: 检出 Android 工程及源码版本标记
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            android-app
            CODEX_UPSTREAM_COMMIT
            .github/scripts
      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android 平台
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: 核实源码及 Rust/NDK 编译配置，复用完整双架构内核
        id: native
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(python3 .github/scripts/select_native_artifacts.py \
            --repo "$GITHUB_REPOSITORY" --abis arm64-v8a x86_64)" || {
            echo "::error::当前源码没有可复用的完整 ARM64 / x86_64 原生内核，请先完成自动触发的原生构建"
            exit 1
          }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "两种架构使用相同已验证内核构建：$RUN_ID"
      - name: 取回 ARM64 原生核心
        uses: actions/download-artifact@v4
        with:
          name: codex-android-native-arm64-v8a
          run-id: ${{ steps.native.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-arm64
      - name: 取回 x86_64 原生核心
        uses: actions/download-artifact@v4
        with:
          name: codex-android-native-x86_64
          run-id: ${{ steps.native.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-x86
      - name: 核验 Android 原生二进制并装配到 APK
        shell: bash
        run: |
          set -euo pipefail
          for ABI in arm64-v8a x86_64; do
            if [ "$ABI" = arm64-v8a ]; then
              SRC_DIR="$RUNNER_TEMP/native-arm64"
              ARCH="AArch64"
            else
              SRC_DIR="$RUNNER_TEMP/native-x86"
              ARCH="X86-64"
            fi
            mapfile -t FOUND < <(find "$SRC_DIR" -type f -name codex-app-server)
            if [ "${#FOUND[@]}" != "1" ]; then
              echo "$ABI 原生内核产物数量异常：${#FOUND[@]}" >&2
              exit 1
            fi
            SRC="${FOUND[0]}"
            file "$SRC"
            readelf -h "$SRC" | grep -q "$ARCH"
            readelf -l "$SRC" | grep -q '/system/bin/linker64'
            mapfile -t LOAD_ALIGNS < <(readelf -Wl "$SRC" | awk '$1=="LOAD" {print $NF}')
            if [ "${#LOAD_ALIGNS[@]}" -eq 0 ]; then
              echo "$ABI 没有可检查的 ELF 加载段" >&2
              exit 1
            fi
            for ALIGN in "${LOAD_ALIGNS[@]}"; do
              if (( ALIGN < 16384 )); then
                echo "$ABI ELF 加载段对齐不足 16 KB：$ALIGN" >&2
                exit 1
              fi
            done
            TARGET="android-app/app/src/main/jniLibs/$ABI"
            mkdir -p "$TARGET"
            cp "$SRC" "$TARGET/libcodex_server.so"
            chmod 755 "$TARGET/libcodex_server.so"
            echo "$ABI 原始内核大小："
            du -h "$TARGET/libcodex_server.so"
            STRIP="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
            test -x "$STRIP"
            "$STRIP" --strip-all "$TARGET/libcodex_server.so"
            readelf -h "$TARGET/libcodex_server.so" | grep -q "$ARCH"
            readelf -l "$TARGET/libcodex_server.so" | grep -q '/system/bin/linker64'
            echo "$ABI 发布内核大小："
            du -h "$TARGET/libcodex_server.so"
            sha256sum "$TARGET/libcodex_server.so"
          done
          head -n 1 CODEX_UPSTREAM_COMMIT
      - name: 下载并校验官方安卓增量恢复组件
        shell: bash
        run: bash .github/scripts/prepare-android-patcher.sh arm64-v8a x86_64
      - name: 编译 APK 并验证审批协议测试
        run: gradle -p android-app :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest -PcodexSplitAbi=true --no-daemon --stacktrace
      - name: 验证 ARM64 / x86_64 独立 APK 的内核与 ABI
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="android-app/app/build/outputs/apk/debug"
          test -s "android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          for ABI in arm64-v8a x86_64; do
            APK="$APK_DIR/app-$ABI-debug.apk"
            test -s "$APK"
            unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-filelist-$ABI"
            grep -Fxq "lib/$ABI/libcodex_server.so" "$RUNNER_TEMP/apk-filelist-$ABI"
            grep -Fxq 'classes.dex' "$RUNNER_TEMP/apk-filelist-$ABI"
            OTHER="x86_64"
            if [ "$ABI" = x86_64 ]; then OTHER="arm64-v8a"; fi
            if grep -Fxq "lib/$OTHER/libcodex_server.so" "$RUNNER_TEMP/apk-filelist-$ABI"; then
              echo "$ABI APK 包含了另一架构的核心，拆包失败" >&2
              exit 1
            fi
            ls -lh "$APK"
            sha256sum "$APK"
          done
      - name: 上传 ARM64 安卓手机专用 APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-arm64-apk
          path: android-app/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: 上传 x86_64 模拟器专用 APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-x86_64-apk
          path: android-app/app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: 上传设备仪器测试 APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-instrumentation-apk
          path: android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 30

  android-emulator:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 55
    steps:
      - name: 取回 x86_64 原生运行包
        uses: actions/download-artifact@v4
        with:
          name: codex-android-x86_64-apk
          path: apks/device
      - name: 取回设备仪器测试包
        uses: actions/download-artifact@v4
        with:
          name: codex-android-instrumentation-apk
          path: apks/test
      - name: 允许虚拟机加速
        run: |
          sudo adduser "$USER" kvm || true
          sudo chmod 666 /dev/kvm
      - name: 在 Android 35 模拟器中验证 Codex 核心
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r apks/device/app-x86_64-debug.apk
            adb install -r apks/test/app-debug-androidTest.apk
            # Keep full native-core acceptance at the representative 393dp phone width.
            adb shell wm size 393x800
            adb shell wm density 160
            test "$(adb shell wm size | awk '/Override size:/ {print $3}' | tr -d '\r')" = "393x800"
            test "$(adb shell wm density | awk '/(Override|Physical) density:/ {value=$3} END {print value}' | tr -d '\r')" = "160"
            adb shell am instrument -w -r io.github.sy220284.codexandroid.test/androidx.test.runner.AndroidJUnitRunner | tee instrument-result.log
            grep -Fq 'OK (' instrument-result.log
      - name: 保存设备测试证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-device-test-results
          path: instrument-result.log
          if-no-files-found: ignore
