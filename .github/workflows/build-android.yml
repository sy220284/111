name: 安卓版本构建与验证

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["编译 Android 原生 Codex 核心"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-android-build
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: 检出 Android 工程及源码版本标记
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            android-app
            CODEX_UPSTREAM_COMMIT
      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android 平台
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: 选择当前版本最近一次成功的原生核心构建
        id: native
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMPLETED_NATIVE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_run ]; then
            RUN_ID="$COMPLETED_NATIVE_RUN"
          else
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-native-codex.yml --limit 40 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId // empty')"
          fi
          if [ -z "$RUN_ID" ]; then
            echo "当前仓库尚无成功的 Android NDK 核心构建。先运行『编译 Android 原生 Codex 核心』。" >&2
            exit 1
          fi
          NATIVE_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')"
          NATIVE_VERSION_FILE="$(gh api "repos/$GITHUB_REPOSITORY/contents/CODEX_UPSTREAM_COMMIT?ref=$NATIVE_COMMIT" --jq '.content' | base64 --decode)"
          NATIVE_UPSTREAM="$(printf '%s\n' "$NATIVE_VERSION_FILE" | sed -n '1p')"
          CURRENT_UPSTREAM="$(sed -n '1p' CODEX_UPSTREAM_COMMIT)"
          if [ "$NATIVE_UPSTREAM" != "$CURRENT_UPSTREAM" ]; then
            echo "原生内核源码版本 ($NATIVE_UPSTREAM) 与 Android 仓库当前源码 ($CURRENT_UPSTREAM) 不一致，必须重新编译。" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "原生核心已通过源码版本一致性核验：$NATIVE_UPSTREAM；构建编号：$RUN_ID"
      - name: 取回 ARM64 原生核心
        uses: actions/download-artifact@v4
        with:
          name: codex-android-native-arm64-v8a
          run-id: ${{ steps.native.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-arm64
      - name: 取回 x86_64 原生核心
        uses: actions/download-artifact@v4
        with:
          name: codex-android-native-x86_64
          run-id: ${{ steps.native.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-x86
      - name: 核验 Android 原生二进制并装配到 APK
        shell: bash
        run: |
          set -euo pipefail
          for ABI in arm64-v8a x86_64; do
            if [ "$ABI" = arm64-v8a ]; then
              SRC_DIR="$RUNNER_TEMP/native-arm64"
              ARCH="AArch64"
            else
              SRC_DIR="$RUNNER_TEMP/native-x86"
              ARCH="X86-64"
            fi
            mapfile -t FOUND < <(find "$SRC_DIR" -type f -name codex-app-server)
            if [ "${#FOUND[@]}" != "1" ]; then
              echo "$ABI 原生内核产物数量异常：${#FOUND[@]}" >&2
              exit 1
            fi
            SRC="${FOUND[0]}"
            file "$SRC"
            readelf -h "$SRC" | grep -q "$ARCH"
            readelf -l "$SRC" | grep -q '/system/bin/linker64'
            mapfile -t LOAD_ALIGNS < <(readelf -Wl "$SRC" | awk '$1=="LOAD" {print $NF}')
            if [ "${#LOAD_ALIGNS[@]}" -eq 0 ]; then
              echo "$ABI 没有可检查的 ELF 加载段" >&2
              exit 1
            fi
            for ALIGN in "${LOAD_ALIGNS[@]}"; do
              if (( ALIGN < 16384 )); then
                echo "$ABI ELF 加载段对齐不足 16 KB：$ALIGN" >&2
                exit 1
              fi
            done
            TARGET="android-app/app/src/main/jniLibs/$ABI"
            mkdir -p "$TARGET"
            cp "$SRC" "$TARGET/libcodex_server.so"
            chmod 755 "$TARGET/libcodex_server.so"
            sha256sum "$TARGET/libcodex_server.so"
          done
          head -n 1 CODEX_UPSTREAM_COMMIT
      - name: 编译 APK 并验证审批协议测试
        run: gradle -p android-app :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: 确认 APK 包含 Android 原生内核
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test -s "android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libcodex_server.so'
          unzip -l "$APK" | grep 'lib/x86_64/libcodex_server.so'
          unzip -l "$APK" | grep 'classes.dex'
          sha256sum "$APK"
      - name: 上传可安装包和设备测试包
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-native-apks
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 30

  android-emulator:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 55
    steps:
      - name: 取回已通过构建的 APK
        uses: actions/download-artifact@v4
        with:
          name: codex-android-native-apks
          path: apks
      - name: 允许虚拟机加速
        run: |
          sudo adduser "$USER" kvm || true
          sudo chmod 666 /dev/kvm
      - name: 在 Android 35 模拟器中验证 Codex 核心
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r apks/debug/app-debug.apk
            adb install -r apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r io.github.sy220284.codexandroid.test/androidx.test.runner.AndroidJUnitRunner | tee instrument-result.log
            grep -Fq 'OK (' instrument-result.log
      - name: 保存设备测试证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-device-test-results
          path: instrument-result.log
          if-no-files-found: ignore
