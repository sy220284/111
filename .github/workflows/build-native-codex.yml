name: 编译 Android 原生 Codex 核心

on:
  workflow_call:
    inputs:
      include_arm:
        type: boolean
        default: true
      include_x86:
        type: boolean
        default: false
      native_key:
        type: string
        default: ''
    outputs:
      arm_run_id:
        value: ${{ jobs.verified.outputs.arm_run_id }}
      x86_run_id:
        value: ${{ jobs.verified.outputs.x86_run_id }}
  workflow_dispatch:
    inputs:
      v8_only:
        description: 仅预构建所选 ABI 的 V8，供后续产品原生构建复用
        type: boolean
        default: false
      include_arm:
        type: boolean
        default: true
      include_x86:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Serialize identical native inputs; each consumer checks for the completed
  # artifact after acquiring the lock. Unlike PR acceptance, never replace a
  # different waiting consumer merely because another branch requested it.
  group: android-native-codex-${{ inputs.native_key || github.sha }}
  queue: max
  cancel-in-progress: false

jobs:
  reuse:
    name: 复用已验证原生内核（源码及编译配置一致）
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      arm_run_id: ${{ steps.detect.outputs.arm_run_id }}
      x86_run_id: ${{ steps.detect.outputs.x86_run_id }}
      reuse: ${{ steps.detect.outputs.reuse }}
      provider_reuse: ${{ steps.detect.outputs.provider_reuse }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/scripts
            .github/ci
            tools/build
      - name: 安装固定 CI 工具
        run: python3 tools/build/platform_toolchain.py host "$RUNNER_TEMP/111-platform" python gh
      - name: 查找已验证的 ARM64 手机核心及手动选定的测试核心
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V8_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.v8_only }}
          INCLUDE_ARM: ${{ inputs.include_arm }}
          INCLUDE_X86: ${{ inputs.include_x86 }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ABI_MATRIX_JSON: '[{"rust_target":"aarch64-linux-android","clang":"aarch64-linux-android29-clang","clangxx":"aarch64-linux-android29-clang++","abi":"arm64-v8a","elf_arch":"AArch64"},{"rust_target":"x86_64-linux-android","clang":"x86_64-linux-android29-clang","clangxx":"x86_64-linux-android29-clang++","abi":"x86_64","elf_arch":"X86-64"}]'
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ]; then
            LIVE_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
            test "$LIVE_HEAD" = "$CANDIDATE_SHA" || { echo "::error::候选已被新 head 替代，停止占用原生构建锁"; exit 1; }
          fi
          if [ "$INCLUDE_ARM" != true ] && [ "$INCLUDE_X86" != true ]; then
            echo "::error::必须请求至少一种 ABI"
            exit 2
          fi
          MISSING='[]'
          for ABI in $(jq -r '.[].abi' <<< "$ABI_MATRIX_JSON"); do
            if [ "$ABI" = 'arm64-v8a' ] && [ "$INCLUDE_ARM" != true ]; then continue; fi
            if [ "$ABI" = 'x86_64' ] && [ "$INCLUDE_X86" != true ]; then continue; fi
            RESULT=0
            if [ "$V8_ONLY" = true ]; then
              RESULT=3
            else
              python3 .github/scripts/select_native_artifacts.py \
                --repo "$GITHUB_REPOSITORY" --abis "$ABI" --compiler-only \
                > "$RUNNER_TEMP/reused-native-$ABI" || RESULT=$?
            fi
            KEY=arm_run_id
            if [ "$ABI" = x86_64 ]; then KEY=x86_run_id; fi
            if [ "$RESULT" -eq 0 ]; then
              echo "$KEY=$(cat "$RUNNER_TEMP/reused-native-$ABI")" >> "$GITHUB_OUTPUT"
            elif [ "$RESULT" -eq 3 ] && [ "$V8_ONLY" != true ]; then
              echo "$KEY=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            fi
            case "$RESULT" in
              0) echo "$ABI 复用已验证原生内核" ;;
              3)
                TARGET="$(jq -r --arg abi "$ABI" '.[] | select(.abi==$abi) | .rust_target' <<< "$ABI_MATRIX_JSON")"
                V8_KEY="$(python3 .github/scripts/v8_artifacts.py key --target "$TARGET")"
                MISSING="$(jq -c --arg abi "$ABI" --arg key "$V8_KEY" --argjson missing "$MISSING" '$missing + map(select(.abi == $abi) + {v8_key:$key})' <<< "$ABI_MATRIX_JSON")"
                ;;
              *) exit "$RESULT" ;;
            esac
          done
          if [ "$V8_ONLY" = true ]; then
            echo "provider_reuse=false" >> "$GITHUB_OUTPUT"
            echo "matrix=$MISSING" >> "$GITHUB_OUTPUT"
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PROVIDER_STATUS=0
          python3 .github/scripts/select_native_artifacts.py --repo "$GITHUB_REPOSITORY" --provider-only > "$RUNNER_TEMP/provider-run" || PROVIDER_STATUS=$?
          case "$PROVIDER_STATUS" in
            0) echo "provider_reuse=true" >> "$GITHUB_OUTPUT"; echo "复用 Rust 回归凭证 $(cat "$RUNNER_TEMP/provider-run")" ;;
            3) echo "provider_reuse=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$PROVIDER_STATUS" ;;
          esac
          echo "matrix=$MISSING" >> "$GITHUB_OUTPUT"
          if [ "$MISSING" = '[]' ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "只编译缺失或已改变的 ABI：$MISSING"
          fi

  v8:
    name: V8 官方源码产物 · ${{ matrix.abi }}
    # V8 official sources do not depend on provider model-contract results.
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.result == 'success' && needs.reuse.outputs.reuse != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.reuse.outputs.matrix) }}
    concurrency:
      group: android-v8-${{ matrix.v8_key }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /.github/scripts/
            .github/actions/ci-android
            .github/actions/ci-rust
            .github/ci
            /.github/actions/run-emulator/
            /tools/build/
            /.github/workflows/
            /android-app/tools/prepare_android_v8.sh
            /android-app/tools/adapt_android_v8_build.py
            /android-app/tools/v8_toolchain_provenance.py
            /upstream/codex/codex-rs/Cargo.lock
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: 查询同输入的已验收原始 V8 产物编号
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/v8_artifacts.py probe --repo "$GITHUB_REPOSITORY" --target "${{ matrix.rust_target }}" --key "${{ matrix.v8_key }}"
      - name: 使用 Runner Android SDK（仅补齐缺项）
        if: steps.probe.outputs.available == 'false'
        uses: ./.github/actions/ci-android
        with:
          mode: v8
      - name: 使用官方 Rust 和 Cargo 缓存
        if: steps.probe.outputs.available == 'false'
        uses: ./.github/actions/ci-rust
        with:
          target: ${{ matrix.rust_target }}
          cache-scope: v8
      - name: 回归独立 V8 凭证规则（手动专项）
        if: github.event_name == 'workflow_dispatch'
        run: python3 -m unittest discover -s .github/scripts -p test_v8_artifacts.py
      - name: 使用锁定的 LLVM 和原生编译工具
        if: steps.probe.outputs.available == 'false'
        run: bash .github/scripts/ci-llvm.sh
      - name: 启用官方逐编译单元缓存（支持中断后复用）
        if: steps.probe.outputs.available == 'false'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.20.1
      - name: 从官方源码编译 V8
        if: steps.probe.outputs.available == 'false'
        env:
          SCCACHE_GHA_ENABLED: "on"
          # Compile in the client process so process-group CPU observation remains accurate.
          SCCACHE_CLIENT_SIDE: "1"
          SCCACHE_GHA_VERSION: ${{ matrix.v8_key }}
          SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'READ_ONLY' || 'READ_WRITE' }}
        run: python3 tools/build/build_progress.py --label "V8 ${{ matrix.abi }}" -- bash android-app/tools/prepare_android_v8.sh "${{ matrix.rust_target }}" "$GITHUB_WORKSPACE/.android-v8-cache/${{ matrix.rust_target }}"
      - name: 独立核验完整 V8 文件、来源及构建输入
        if: steps.probe.outputs.available == 'false'
        run: python3 .github/scripts/v8_artifacts.py verify --target "${{ matrix.rust_target }}" --key "${{ matrix.v8_key }}" --folder ".android-v8-cache/${{ matrix.rust_target }}"
      - name: 发布本次已核验的 V8 二进制及来源凭证
        if: steps.probe.outputs.available == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v8-binary-${{ matrix.v8_key }}
          # Same-run producer reruns replace the name only after verification;
          # consumers resolve the new immutable ID and independently check its digest.
          overwrite: true
          compression-level: 0
          path: .android-v8-cache/${{ matrix.rust_target }}/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  native:
    name: 编译 ${{ matrix.abi }} 核心
    # Do not spend hours compiling Android binaries for a source revision that
    # has already failed the native host contract. A verified receipt also qualifies.
    needs: [reuse, provider-contract, v8]
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.v8_only) && needs.reuse.result == 'success' && needs.reuse.outputs.reuse != 'true' && needs.v8.result == 'success' && (needs.provider-contract.result == 'success' || (needs.provider-contract.result == 'skipped' && needs.reuse.outputs.provider_reuse == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.reuse.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: 检出已锁定的官方源码快照
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            .github/scripts
            .github/actions/ci-android
            .github/actions/ci-rust
            .github/ci
            tools/build
            .github/ci
            upstream/codex
            CODEX_UPSTREAM_COMMIT
            android-app/tools/prepare_android_mxc.py
            android-app/tools/resolve_codex_catalog_version.py
            android-app/tools/test_resolve_codex_catalog_version.py
            android-app/tools/prepare_android_code_mode.py
            android-app/tools/test_prepare_android_code_mode.py
            android-app/tools/prepare_android_realtime_privacy.py
            android-app/tools/test_prepare_android_realtime_privacy.py
            android-app/tools/prepare_android_remote_delivery.py
            android-app/tools/test_prepare_android_remote_delivery.py
            android-app/tools/prepare_android_v8.sh
            android-app/tools/adapt_android_v8_build.py
            android-app/tools/v8_toolchain_provenance.py
      - name: 使用 Runner Android SDK（仅补齐缺项）
        uses: ./.github/actions/ci-android
        with:
          mode: native
      - name: 使用官方 Rust 和 Cargo 缓存
        uses: ./.github/actions/ci-rust
        with:
          target: ${{ matrix.rust_target }}
          cache-scope: workspace
      - name: 检查源码快照版本
        run: |
          set -euo pipefail
          test -f upstream/codex/codex-rs/app-server/Cargo.toml
          cat CODEX_UPSTREAM_COMMIT
          python3 android-app/tools/resolve_codex_catalog_version.py --marker CODEX_UPSTREAM_COMMIT \
            --lock upstream/codex/codex-rs/models-manager/android-client-release.txt
          grep -Fq 'android_catalog_client_version()' upstream/codex/codex-rs/models-manager/src/lib.rs
          python3 -m unittest discover -s android-app/tools -p 'test_resolve_codex_catalog_version.py'
      # Check the pristine lock before any Android adaptation modifies Cargo.lock.
      - name: 下载并核验独立 V8 产物及原始构建输入
        id: v8-consume
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/v8_artifacts.py consume --repo "$GITHUB_REPOSITORY" --target "${{ matrix.rust_target }}" --key "${{ matrix.v8_key }}" --folder ".android-v8-cache/${{ matrix.rust_target }}"
      - name: 为 V8 恢复补齐官方 SDK 缺项
        if: steps.v8-consume.outputs.rebuild == 'true'
        run: bash .github/scripts/ci-android-sdk.sh v8
      - name: 使用锁定的 LLVM 和原生编译工具
        if: steps.v8-consume.outputs.rebuild == 'true'
        run: bash .github/scripts/ci-llvm.sh
      - name: 启用官方逐编译单元缓存（支持中断后复用）
        if: steps.v8-consume.outputs.rebuild == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.20.1
      - name: 从固定官方源码重建并核验 V8 产物
        if: steps.v8-consume.outputs.rebuild == 'true'
        env:
          SCCACHE_GHA_ENABLED: "on"
          # Compile in the client process so process-group CPU observation remains accurate.
          SCCACHE_CLIENT_SIDE: "1"
          SCCACHE_GHA_VERSION: ${{ matrix.v8_key }}
          SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'READ_ONLY' || 'READ_WRITE' }}
        run: |
          set -euo pipefail
          python3 tools/build/build_progress.py --label "V8 recovery ${{ matrix.abi }}" -- bash android-app/tools/prepare_android_v8.sh "${{ matrix.rust_target }}" "$GITHUB_WORKSPACE/.android-v8-cache/${{ matrix.rust_target }}"
          python3 .github/scripts/v8_artifacts.py verify --target "${{ matrix.rust_target }}" --key "${{ matrix.v8_key }}" --folder ".android-v8-cache/${{ matrix.rust_target }}"
      - name: 保存独立恢复产物与来源凭证
        if: steps.v8-consume.outputs.rebuild == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v8-recovery-${{ matrix.v8_key }}
          overwrite: true
          compression-level: 0
          path: .android-v8-cache/${{ matrix.rust_target }}/*
          if-no-files-found: error
          retention-days: 90
      - name: 将 Android 平台接入上游现有 OpenSSL 源码编译配置
        shell: bash
        run: |
          set -euo pipefail
          cat >> upstream/codex/codex-rs/core/Cargo.toml <<'TOML'
          # Android target uses the same source-built OpenSSL strategy as Linux musl.
          # This addition only applies to the CI checkout; upstream snapshot stays intact.
          [target.aarch64-linux-android.dependencies]
          openssl-sys = { workspace = true, features = ["vendored"] }

          [target.x86_64-linux-android.dependencies]
          openssl-sys = { workspace = true, features = ["vendored"] }
          TOML
          grep -A 2 'target.aarch64-linux-android.dependencies' upstream/codex/codex-rs/core/Cargo.toml
      - name: 应用 Android 适配并完整准备锁定的 Rust 依赖
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/codex/codex-rs
          python3 "$GITHUB_WORKSPACE/android-app/tools/prepare_android_code_mode.py" \
            "$GITHUB_WORKSPACE/upstream/codex/codex-rs/install-context/src/lib.rs" \
            --host-source "$GITHUB_WORKSPACE/upstream/codex/codex-rs/code-mode-host/src/main.rs" \
            --features-source "$GITHUB_WORKSPACE/upstream/codex/codex-rs/features/src/lib.rs"
          python3 -B -m unittest discover -s "$GITHUB_WORKSPACE/android-app/tools" -p test_prepare_android_code_mode.py
          python3 -B -m unittest discover -s "$GITHUB_WORKSPACE/android-app/tools" -p test_prepare_android_realtime_privacy.py
          python3 "$GITHUB_WORKSPACE/android-app/tools/prepare_android_realtime_privacy.py" \
            "$GITHUB_WORKSPACE/upstream/codex/codex-rs/codex-api/src/endpoint/realtime_websocket/methods.rs"
          python3 -B -m unittest discover -s "$GITHUB_WORKSPACE/android-app/tools" -p test_prepare_android_remote_delivery.py
          python3 "$GITHUB_WORKSPACE/android-app/tools/prepare_android_remote_delivery.py" "$GITHUB_WORKSPACE/upstream/codex/codex-rs"
          # Prepare the final locked graph, including host tools, before offline compilation.
          cargo fetch --locked
          cargo fetch --locked --offline
          python3 "$GITHUB_WORKSPACE/android-app/tools/prepare_android_mxc.py" --cargo-home "${CARGO_HOME:-$HOME/.cargo}"
      - name: 使用 Android Bionic 编译 App Server 与 Code Mode Host
        shell: bash
        run: |
          set -euo pipefail
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET="${{ matrix.rust_target }}"
          TARGET_ENV="$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')"
          TARGET_C="$(echo "$TARGET" | tr '-' '_')"
          export "CARGO_TARGET_${TARGET_ENV}_LINKER=$BIN/${{ matrix.clang }}"
          export "CC_${TARGET_C}=$BIN/${{ matrix.clang }}"
          export "CXX_${TARGET_C}=$BIN/${{ matrix.clangxx }}"
          export "AR_${TARGET_C}=$BIN/llvm-ar"
          # OpenSSL's Android Configure uses prefixed ranlib/ar names; modern NDK
          # ships LLVM tools without those aliases. Provide the standard names.
          export AR="$BIN/llvm-ar"
          export RANLIB="$BIN/llvm-ranlib"
          mkdir -p "$RUNNER_TEMP/android-tool-aliases"
          ln -sf "$BIN/llvm-ar" "$RUNNER_TEMP/android-tool-aliases/${TARGET}-ar"
          ln -sf "$BIN/llvm-ranlib" "$RUNNER_TEMP/android-tool-aliases/${TARGET}-ranlib"
          ln -sf "$BIN/llvm-nm" "$RUNNER_TEMP/android-tool-aliases/${TARGET}-nm"
          export PATH="$RUNNER_TEMP/android-tool-aliases:$BIN:$PATH"
          command -v "${TARGET}-ranlib"
          test -x "$(command -v "${TARGET}-ranlib")"
          export CMAKE_ANDROID_NDK="$ANDROID_NDK_HOME"
          export CMAKE_ANDROID_API=29
          export OPENSSL_STATIC=1
          # Android 15+ supports devices using 16 KB memory pages.
          # Link all ELF LOAD segments on 16 KB boundaries.
          RUST_LINK_FLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
          if [ "$TARGET" = "aarch64-linux-android" ]; then
            # ARM64 sandbox V8 needs the NDK compiler-rt cache-flush builtin.
            BUILTINS="$("$BIN/${{ matrix.clang }}" -print-file-name=libclang_rt.builtins-aarch64-android.a)"
            test -f "$BUILTINS"
            "$BIN/llvm-nm" --defined-only "$BUILTINS" | grep -E " __clear_cache"
            RUST_LINK_FLAGS="$RUST_LINK_FLAGS -C link-arg=$BUILTINS"
          fi
          export "CARGO_TARGET_${TARGET_ENV}_RUSTFLAGS=$RUST_LINK_FLAGS"
          cd upstream/codex/codex-rs
          export CARGO_BUILD_JOBS="$(python3 "$GITHUB_WORKSPACE/tools/build/build_progress.py" --jobs rust)"
          python3 "$GITHUB_WORKSPACE/tools/build/build_progress.py" --label "Rust ${{ matrix.abi }}" -- cargo build --locked --offline --release \
            -p codex-app-server --bin codex-app-server \
            -p codex-code-mode-host --bin codex-code-mode-host \
            --target "$TARGET"
          # Git, rg and other CLI tools are imported from the verified 777 runtime.
          COMPONENTS=(codex-app-server codex-code-mode-host)
          for NAME in "${COMPONENTS[@]}"; do
            CORE="target/$TARGET/release/$NAME"
            test -s "$CORE"
            file "$CORE"
            readelf -h "$CORE" | grep -q '${{ matrix.elf_arch }}'
            readelf -l "$CORE" | grep -q '/system/bin/linker64'
            mapfile -t LOAD_ALIGNS < <(readelf -Wl "$CORE" | awk '$1=="LOAD" {print $NF}')
            test "${#LOAD_ALIGNS[@]}" -gt 0
            for ALIGN in "${LOAD_ALIGNS[@]}"; do
              if (( ALIGN < 16384 )); then
                echo "$NAME ELF 内存页对齐不足 16 KB：$ALIGN" >&2
                exit 1
              fi
            done
            sha256sum "$CORE"
          done
      - name: 上传原生内核二进制
        id: native-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-android-native-${{ matrix.abi }}
          path: |
            upstream/codex/codex-rs/target/${{ matrix.rust_target }}/release/codex-app-server
            upstream/codex/codex-rs/target/${{ matrix.rust_target }}/release/codex-code-mode-host
          if-no-files-found: error
          retention-days: 90
      - name: 生成按源码指纹索引的原生构建凭证
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
          ARTIFACT_ID: ${{ steps.native-upload.outputs.artifact-id }}
        run: |
          python3 .github/scripts/native_index.py create --abi "$ABI" --artifact-id "$ARTIFACT_ID" --out "$RUNNER_TEMP/native-index.json" --github-output "$GITHUB_OUTPUT"
        id: index
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-index-${{ matrix.abi }}-${{ steps.index.outputs.fingerprint }}
          path: ${{ runner.temp }}/native-index.json
          if-no-files-found: error
          retention-days: 90
      - name: 上传 V8 官方源码构建来源及校验证据
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v8-source-evidence-${{ matrix.abi }}-${{ steps.index.outputs.fingerprint }}
          path: |
            .android-v8-cache/${{ matrix.rust_target }}/BUILD_INPUTS
            .android-v8-cache/${{ matrix.rust_target }}/SOURCE_PROVENANCE
            .android-v8-cache/${{ matrix.rust_target }}/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  provider-contract:
    name: 国内服务商目录与模型能力 Rust 回归测试
    needs: reuse
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.v8_only) && needs.reuse.outputs.provider_reuse != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            .github/scripts
            .github/actions/ci-android
            .github/actions/ci-rust
            .github/ci
            tools/build
            .github/ci
            upstream/codex
            android-app/tools/prepare_android_remote_delivery.py
            android-app/tools/test_prepare_android_remote_delivery.py
      - name: 使用官方 Rust 和 Cargo 缓存
        uses: ./.github/actions/ci-rust
      - name: 执行国内目录、端点绑定及合成工具回传测试
        working-directory: upstream/codex/codex-rs
        run: |
          set -euo pipefail
          export CARGO_BUILD_JOBS="$(python3 "$GITHUB_WORKSPACE/tools/build/build_progress.py" --jobs rust)"
          cargo test --locked -p codex-models-manager --lib android_catalog_version_tests
          cargo test --locked -p codex-models-manager --lib image_input
          cargo test --locked -p codex-model-provider --lib domestic_
          cargo test --locked -p codex-model-provider-info --lib domestic_workspace_tests
          cargo test --locked -p codex-api --lib body_model_reporting
          cargo test --locked -p codex-app-server --test all media_sample_native_
      - name: 验证工作站真实文件安全读取并构建 Linux 执行器
        working-directory: upstream/codex/codex-rs
        run: |
          set -euo pipefail
          export CARGO_BUILD_JOBS="$(python3 "$GITHUB_WORKSPACE/tools/build/build_progress.py" --jobs rust)"
          python3 -B -m unittest discover -s "$GITHUB_WORKSPACE/android-app/tools" -p test_prepare_android_remote_delivery.py
          python3 "$GITHUB_WORKSPACE/android-app/tools/prepare_android_remote_delivery.py" --exec-only .
          cargo test --locked -p codex-exec-server --lib local_file_system_read::tests::android_delivery_ 2>&1 | tee "$RUNNER_TEMP/android-delivery-rust-tests.log"
          grep -F "test local_file_system_read::tests::android_delivery_enforces_the_actual_read_limit ... ok" "$RUNNER_TEMP/android-delivery-rust-tests.log"
          grep -F "test local_file_system_read::tests::android_delivery_rejects_leaf_and_parent_links ... ok" "$RUNNER_TEMP/android-delivery-rust-tests.log"
          grep -F "test local_file_system_read::tests::android_delivery_chunk_returns_verified_digest_and_bounded_ranges ... ok" "$RUNNER_TEMP/android-delivery-rust-tests.log"
          grep -F "test local_file_system_read::tests::android_delivery_chunk_rejects_leaf_and_parent_links ... ok" "$RUNNER_TEMP/android-delivery-rust-tests.log"
          cargo build --locked -p codex-exec-server-cli --bin codex-exec-server
          mkdir -p "$RUNNER_TEMP/android-delivery-executor"
          install -m 0755 target/debug/codex-exec-server "$RUNNER_TEMP/android-delivery-executor/codex-exec-server"
          "$RUNNER_TEMP/android-delivery-executor/codex-exec-server" --help
          cp "$RUNNER_TEMP/android-delivery-rust-tests.log" "$RUNNER_TEMP/android-delivery-executor/RUST_TESTS.log"
          git rev-parse HEAD > "$RUNNER_TEMP/android-delivery-executor/SOURCE_COMMIT"
          (cd "$RUNNER_TEMP/android-delivery-executor" && sha256sum codex-exec-server SOURCE_COMMIT RUST_TESTS.log > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: 生成 Rust 回归凭证
        id: provider-index
        run: python3 .github/scripts/native_index.py provider --out "$RUNNER_TEMP/provider-index.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-delivery-executor-linux-x86_64-${{ steps.provider-index.outputs.fingerprint }}
          path: ${{ runner.temp }}/android-delivery-executor/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-index-${{ steps.provider-index.outputs.fingerprint }}
          path: ${{ runner.temp }}/provider-index.json
          if-no-files-found: error
          retention-days: 90

  verified:
    name: 原生核心统一验收
    needs: [reuse, native, provider-contract, v8]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      arm_run_id: ${{ needs.reuse.outputs.arm_run_id }}
      x86_run_id: ${{ needs.reuse.outputs.x86_run_id }}
    steps:
      - name: 核对真实编译或复用结果
        env:
          V8_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.v8_only }}
          REUSE: ${{ needs.reuse.result }}
          REUSED: ${{ needs.reuse.outputs.reuse }}
          NATIVE: ${{ needs.native.result }}
          V8: ${{ needs.v8.result }}
          TEST: ${{ needs.provider-contract.result }}
          PROVIDER_REUSED: ${{ needs.reuse.outputs.provider_reuse }}
          ARM: ${{ needs.reuse.outputs.arm_run_id }}
          X86: ${{ needs.reuse.outputs.x86_run_id }}
          INCLUDE_ARM: ${{ inputs.include_arm }}
          INCLUDE_X86: ${{ inputs.include_x86 }}
        run: |
          set -euo pipefail
          test "$REUSE" = success
          if [ "$V8_ONLY" = true ]; then
            test "$V8" = success
            test "$NATIVE" = skipped
            test "$TEST" = skipped
            test -z "$ARM$X86"
            exit 0
          fi
          if [ "$INCLUDE_ARM" = true ]; then test -n "$ARM"; else test -z "$ARM"; fi
          if [ "$INCLUDE_X86" = true ]; then test -n "$X86"; else test -z "$X86"; fi
          if [ "$REUSED" = true ]; then test "$NATIVE" = skipped; test "$V8" = skipped; else test "$NATIVE" = success; test "$V8" = success; fi
          if [ "$PROVIDER_REUSED" = true ]; then test "$TEST" = skipped; else test "$TEST" = success; fi
