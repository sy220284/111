name: 编译 Android 原生 Codex 核心

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-native-codex.yml"
      - ".github/scripts/select_native_artifacts.py"
      - "CODEX_UPSTREAM_COMMIT"
      - "upstream/codex/**"
      - "android-app/tools/prepare_android_mxc.py"
      - "android-app/tools/prepare_android_code_mode.py"
      - "android-app/tools/prepare_android_v8.sh"
  pull_request:
    paths:
      - ".github/workflows/build-native-codex.yml"
      - "android-app/tools/prepare_android_code_mode.py"
      - "android-app/tools/prepare_android_v8.sh"
      - "android-app/tools/package_native_runtime.sh"
      - ".github/scripts/select_native_artifacts.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Keep independent branches from blocking each other; supersede stale PR builds.
  group: android-native-codex-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reuse:
    name: 复用已验证原生内核（源码及编译配置一致）
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      reuse: ${{ steps.detect.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/scripts
      - name: 查找双架构可复用内核
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESULT=0
          python3 .github/scripts/select_native_artifacts.py \
            --repo "$GITHUB_REPOSITORY" --abis arm64-v8a x86_64 \
            > "$RUNNER_TEMP/reused-native-run" || RESULT=$?
          if [ "$RESULT" -eq 0 ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "复用原生构建 $(cat "$RUNNER_TEMP/reused-native-run")，跳过 Rust/NDK 重编译"
          elif [ "$RESULT" -eq 3 ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "源码、编译参数变更或可用产物缺失，启动原生编译"
          else
            exit "$RESULT"
          fi

  native:
    name: 编译 ${{ matrix.abi }} 核心
    needs: reuse
    if: needs.reuse.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-linux-android
            clang: aarch64-linux-android29-clang
            clangxx: aarch64-linux-android29-clang++
            abi: arm64-v8a
            elf_arch: AArch64
          - rust_target: x86_64-linux-android
            clang: x86_64-linux-android29-clang
            clangxx: x86_64-linux-android29-clang++
            abi: x86_64
            elf_arch: X86-64
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: 检出已锁定的官方源码快照
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            upstream/codex
            CODEX_UPSTREAM_COMMIT
            android-app/tools/prepare_android_mxc.py
            android-app/tools/prepare_android_code_mode.py
            android-app/tools/prepare_android_v8.sh
      - name: 检查源码快照版本
        run: |
          set -euo pipefail
          test -f upstream/codex/codex-rs/app-server/Cargo.toml
          cat CODEX_UPSTREAM_COMMIT
      - name: 配置 Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$TOOL"
          "$TOOL" "ndk;27.2.12479018"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.clang }}"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - name: 安装 Codex 源码锁定的 Rust 1.99.1 和 Android 目标
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.rust_target }}
      - name: 验证当前 Rust 工具链与安卓标准库
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/codex/codex-rs
          rustup target add "${{ matrix.rust_target }}" --toolchain 1.99.1
          rustc --version
          cargo --version
          rustup show active-toolchain
          rustup target list --installed | grep -Fx "${{ matrix.rust_target }}"
          test -d "$(rustc --print sysroot)/lib/rustlib/${{ matrix.rust_target }}/lib"
      - name: 缓存 Rust 构建依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/codex/codex-rs
          key: codex-android-${{ matrix.rust_target }}
      - name: 缓存沙箱版本的 Android V8 静态库与绑定
        uses: actions/cache@v4
        with:
          path: .android-v8-cache/${{ matrix.rust_target }}
          key: android-v8-${{ matrix.rust_target }}-152.2.0-sandbox-${{ hashFiles('android-app/tools/prepare_android_v8.sh') }}
      - name: 将 Android 平台接入上游现有 OpenSSL 源码编译配置
        shell: bash
        run: |
          set -euo pipefail
          cat >> upstream/codex/codex-rs/core/Cargo.toml <<'TOML'
          # Android target uses the same source-built OpenSSL strategy as Linux musl.
          # This addition only applies to the CI checkout; upstream snapshot stays intact.
          [target.aarch64-linux-android.dependencies]
          openssl-sys = { workspace = true, features = ["vendored"] }

          [target.x86_64-linux-android.dependencies]
          openssl-sys = { workspace = true, features = ["vendored"] }
          TOML
          grep -A 2 'target.aarch64-linux-android.dependencies' upstream/codex/codex-rs/core/Cargo.toml
      - name: 获取依赖并修复 MXC SDK 的 Android 平台编译条件
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/codex/codex-rs
          cargo fetch --locked --target "${{ matrix.rust_target }}"
          python3 "$GITHUB_WORKSPACE/android-app/tools/prepare_android_mxc.py" --cargo-home "${CARGO_HOME:-$HOME/.cargo}"
          python3 "$GITHUB_WORKSPACE/android-app/tools/prepare_android_code_mode.py" \
            "$GITHUB_WORKSPACE/upstream/codex/codex-rs/install-context/src/lib.rs" \
            --host-source "$GITHUB_WORKSPACE/upstream/codex/codex-rs/code-mode-host/src/main.rs"
      - name: 准备已核验的 Android V8 沙箱库
        shell: bash
        run: |
          set -euo pipefail
          bash android-app/tools/prepare_android_v8.sh \
            "${{ matrix.rust_target }}" "$GITHUB_WORKSPACE/.android-v8-cache/${{ matrix.rust_target }}"
      - name: 使用 Android Bionic 编译 App Server 与 Code Mode Host
        shell: bash
        run: |
          set -euo pipefail
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET="${{ matrix.rust_target }}"
          TARGET_ENV="$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')"
          TARGET_C="$(echo "$TARGET" | tr '-' '_')"
          export "CARGO_TARGET_${TARGET_ENV}_LINKER=$BIN/${{ matrix.clang }}"
          export "CC_${TARGET_C}=$BIN/${{ matrix.clang }}"
          export "CXX_${TARGET_C}=$BIN/${{ matrix.clangxx }}"
          export "AR_${TARGET_C}=$BIN/llvm-ar"
          # OpenSSL's Android Configure uses prefixed ranlib/ar names; modern NDK
          # ships LLVM tools without those aliases. Provide the standard names.
          export AR="$BIN/llvm-ar"
          export RANLIB="$BIN/llvm-ranlib"
          mkdir -p "$RUNNER_TEMP/android-tool-aliases"
          ln -sf "$BIN/llvm-ar" "$RUNNER_TEMP/android-tool-aliases/${TARGET}-ar"
          ln -sf "$BIN/llvm-ranlib" "$RUNNER_TEMP/android-tool-aliases/${TARGET}-ranlib"
          ln -sf "$BIN/llvm-nm" "$RUNNER_TEMP/android-tool-aliases/${TARGET}-nm"
          export PATH="$RUNNER_TEMP/android-tool-aliases:$BIN:$PATH"
          command -v "${TARGET}-ranlib"
          test -x "$(command -v "${TARGET}-ranlib")"
          export CMAKE_ANDROID_NDK="$ANDROID_NDK_HOME"
          export CMAKE_ANDROID_API=29
          export OPENSSL_STATIC=1
          # Android 15+ supports devices using 16 KB memory pages.
          # Link all ELF LOAD segments on 16 KB boundaries.
          export "CARGO_TARGET_${TARGET_ENV}_RUSTFLAGS=-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
          cd upstream/codex/codex-rs
          cargo build --locked --release \
            -p codex-app-server --bin codex-app-server \
            -p codex-code-mode-host --bin codex-code-mode-host \
            --target "$TARGET"
          for NAME in codex-app-server codex-code-mode-host; do
            CORE="target/$TARGET/release/$NAME"
            test -s "$CORE"
            file "$CORE"
            readelf -h "$CORE" | grep -q '${{ matrix.elf_arch }}'
            readelf -l "$CORE" | grep -q '/system/bin/linker64'
            mapfile -t LOAD_ALIGNS < <(readelf -Wl "$CORE" | awk '$1=="LOAD" {print $NF}')
            test "${#LOAD_ALIGNS[@]}" -gt 0
            for ALIGN in "${LOAD_ALIGNS[@]}"; do
              if (( ALIGN < 16384 )); then
                echo "$NAME ELF 内存页对齐不足 16 KB：$ALIGN" >&2
                exit 1
              fi
            done
            sha256sum "$CORE"
          done
      - name: 上传原生内核与构建清单
        uses: actions/upload-artifact@v4
        with:
          name: codex-android-native-${{ matrix.abi }}
          path: |
            upstream/codex/codex-rs/target/${{ matrix.rust_target }}/release/codex-app-server
            upstream/codex/codex-rs/target/${{ matrix.rust_target }}/release/codex-code-mode-host
          if-no-files-found: error
          retention-days: 90
