name: 111 统一质量验收

on:
  pull_request:
    branches: [main, validation/combined-111-reply-20261126]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runtime_x86:
        description: 手动全量验收（始终包含 x86_64 真实内核专项）
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # A new head supersedes the previous acceptance for the same PR, including
  # queued reusable-workflow jobs. Distinct PRs and main keep independent lanes.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: 统一变更分类
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      runtime: ${{ steps.plan.outputs.runtime }}
      receipt: ${{ steps.plan.outputs.receipt }}
      native_key: ${{ steps.plan.outputs.native_key }}
      run_static: ${{ steps.plan.outputs.run_static }}
      run_compile: ${{ steps.plan.outputs.run_compile }}
      compile_run_id: ${{ steps.plan.outputs.compile_run_id }}
      compile_apk_id: ${{ steps.plan.outputs.compile_apk_id }}
      compile_integrity_id: ${{ steps.plan.outputs.compile_integrity_id }}
      run_ui: ${{ steps.plan.outputs.run_ui }}
      run_package: ${{ steps.plan.outputs.run_package }}
      run_preflight: ${{ steps.plan.outputs.run_preflight }}
      run_compat: ${{ steps.plan.outputs.run_compat }}
      run_runtime: ${{ steps.plan.outputs.run_runtime }}
      run_sign: ${{ steps.plan.outputs.run_sign }}
      device_matrix: ${{ steps.plan.outputs.device_matrix }}
      device_shards: ${{ steps.plan.outputs.device_shards }}
      device_api: ${{ steps.plan.outputs.device_api }}
      device_image_api: ${{ steps.plan.outputs.device_image_api }}
      device_sdk_platform: ${{ steps.plan.outputs.device_sdk_platform }}
      device_runtime_profile: ${{ steps.plan.outputs.device_runtime_profile }}
      device_release: ${{ steps.plan.outputs.device_release }}
      device_target: ${{ steps.plan.outputs.device_target }}
      device_ram: ${{ steps.plan.outputs.device_ram }}
      device_cores: ${{ steps.plan.outputs.device_cores }}
      device_disk: ${{ steps.plan.outputs.device_disk }}
      device_mesa_threads: ${{ steps.plan.outputs.device_mesa_threads }}
      device_emulator_options: ${{ steps.plan.outputs.device_emulator_options }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 安装固定 CI 工具
        run: python3 tools/build/platform_toolchain.py host "$RUNNER_TEMP/111-platform" python gh
      - name: 分类并验证调度规则
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_FORCE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '主线强制切换新版')) }}
          CI_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_x86 }}
        run: |
          set -euo pipefail
          python3 .github/scripts/run_ci_script_tests.py plan
          python3 -m unittest discover -s tools/build -p 'test_*.py'
          python3 -m unittest discover -s android-app/tools -p 'test_device_matrix.py'
          python3 -m unittest discover -s android-app/tools -p 'test_verify_ui_matrix_evidence.py'
          python3 -m unittest discover -s android-app/tools -p 'test_merge_ui_shards.py'
          python3 .github/scripts/ci_policy.py
      - name: 非产品变更基础检查
        if: steps.plan.outputs.full == 'false'
        shell: bash
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --check "$CI_BASE" "$CI_HEAD"
          git ls-files -z -- '.github/scripts/*.sh' 'tools/build/*.sh' | xargs -0 -r -n1 bash -n
          git ls-files -z -- '.github/workflows/*.yml' '.github/workflows/*.yaml' '.github/actions/**/action.yml' '.github/actions/**/action.yaml' | xargs -0 -r ruby -ryaml -e 'ARGV.each { |path| YAML.parse_stream(File.read(path)) }'
          python3 .github/scripts/run_ci_script_tests.py preflight
          python3 -m unittest discover -s android-app/tools -p 'test_run_static_audit.py'
          python3 -m unittest discover -s android-app/tools -p 'test_architecture_callgraph.py'
          python3 -m unittest discover -s android-app/tools -p 'test_device_video.py'
          python3 -m unittest discover -s android-app/tools -p 'test_check_architecture_boundaries.py'
  native:
    needs: [plan, static-ui, preflight]
    if: always() && !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.run_package == 'true' || needs.plan.outputs.run_runtime == 'true') && (needs.static-ui.result == 'success' || needs.static-ui.result == 'skipped') && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
    uses: ./.github/workflows/build-native-codex.yml
    with:
      include_arm: ${{ needs.plan.outputs.run_package == 'true' }}
      include_x86: ${{ needs.plan.outputs.run_runtime == 'true' }}
      native_key: ${{ needs.plan.outputs.native_key }}

  runtime-arm64:
    needs: [plan, preflight]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run_package == 'true' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
    uses: ./.github/workflows/prepare-developer-runtime.yml
    with:
      abi: arm64-v8a
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  runtime-x86:
    needs: [plan, preflight]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run_runtime == 'true' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
    uses: ./.github/workflows/prepare-developer-runtime.yml
    with:
      abi: x86_64
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  static-ui:
    name: 协议、视觉规范与静态覆盖检查
    needs: plan
    if: needs.plan.outputs.run_static == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 仅检出 Android UI 源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          sparse-checkout: |
            /android-app/
            /upstream/codex/codex-rs/model-provider/catalogs/
            /.github/workflows/
            /.github/scripts/
            /.github/actions/ci-android/
            /.github/actions/ci-rust/
            /.github/ci/
            /.github/actions/run-emulator/
            /.github/actions/ci-emulator/
            /tools/build/
            /docs/设计系统.md
            /docs/对标应用29项界面交付核对表-20261123.md
            /docs/第五版接口与界面组件映射矩阵.md
            /docs/接口协议动作清单与落地验收台账-20261122.md
            /docs/ui-assets/
            /upstream/codex/codex-rs/app-server-protocol/src/protocol/common.rs
            /upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/thread.rs
            /upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/turn.rs
            /upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/project.rs
            /upstream/codex/codex-rs/app-server-protocol/schema/json/v2/
          sparse-checkout-cone-mode: false
      - name: 安装固定 CI 工具
        run: python3 tools/build/platform_toolchain.py host "$RUNNER_TEMP/111-platform" python
      - name: 阻断未经审查的官方协议及字段变更
        run: |
          python3 -B -m unittest discover -s android-app/tools -p 'test_review_upstream_protocol.py'
          python3 -B android-app/tools/review_upstream_protocol.py
      - name: 统一静态审计规则回归
        run: |
          python3 -m unittest discover -s android-app/tools -p 'test_protocol_contract.py'
          python3 -m unittest discover -s android-app/tools -p 'test_check_protocol_schema_alignment.py'
          python3 -m unittest discover -s android-app/tools -p 'test_verify_protocol_methods.py'
          python3 -m unittest discover -s android-app/tools -p 'test_audit_ui_rpc_calls.py'
          python3 -m unittest discover -s android-app/tools -p 'test_ui_mutation_keys.py'
          python3 -m unittest discover -s android-app/tools -p 'test_check_full_feature_workflows.py'
          python3 -m unittest discover -s android-app/tools -p 'test_sync_ui_protocol_docs.py'
          python3 -m unittest discover -s android-app/tools -p 'test_check_ui_protocol_matrix.py'
          python3 -m unittest discover -s android-app/tools -p 'test_check_design_system_tokens.py'
          python3 -m unittest discover -s android-app/tools -p 'test_check_ui_assets.py'
          python3 -m unittest discover -s android-app/tools -p 'test_check_component_system.py'
          python3 -m unittest discover -s android-app/tools -p 'test_run_static_audit.py'
          python3 -m unittest discover -s android-app/tools -p 'test_architecture_callgraph.py'
          python3 -m unittest discover -s android-app/tools -p 'test_check_architecture_boundaries.py'
      - name: 一次加载源码，执行协议、功能、设计与架构调用候选审计
        run: python3 android-app/tools/run_static_audit.py --repository . --output .
      - name: 复用 Python 锁定依赖下载缓存
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build/platform-toolchain.json', '.github/ci/requirements.lock') }}
      - name: 验证截图收集与功能验收独立记录
        run: |
          python3 -m unittest discover -s android-app/tools -p 'test_collect_ui_screenshots.py'
          python3 -m unittest discover -s android-app/tools -p 'test_run_ui_device_checks.py'
          python3 -m unittest discover -s android-app/tools -p 'test_device_video.py'
          python3 -m venv .ui-visual-test-venv
          .ui-visual-test-venv/bin/pip install --require-hashes -r .github/ci/requirements.lock
          .ui-visual-test-venv/bin/python -m unittest discover -s android-app/tools -p 'test_ui_visual_audit.py'
      - name: 验证自更新证据判定与安装完成条件
        run: python3 -m unittest discover -s android-app/tools -p 'test_verify_self_update_open.py'
      - name: 保存静态协议与 UI 规范报告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-android-ui-static-reports
          path: |
            component-system-audit.json
            ui-assets-audit.json
            ui-assets-audit.md
            ui-coverage.md
            ui-coverage.json
            full-feature-workflows.md
            full-feature-workflows.json
            interaction-coverage.json
            protocol-contract-audit.json
            static-audit-summary.json
            architecture-callgraph.json
            architecture-boundaries.json
          if-no-files-found: ignore
          retention-days: 14

  verify-ui:
    name: Kotlin 编译、协议单元测试与 Android Lint
    needs: plan
    if: needs.plan.outputs.run_compile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 仅检出 Android UI 源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          sparse-checkout: |
            /android-app/
            /upstream/codex/codex-rs/model-provider/catalogs/
            /.github/workflows/
            /.github/scripts/
            /.github/actions/ci-android/
            /.github/actions/ci-rust/
            /.github/ci/
            /.github/actions/run-emulator/
            /.github/actions/ci-emulator/
            /tools/build/
            /docs/设计系统.md
            /docs/对标应用29项界面交付核对表-20261123.md
            /docs/第五版接口与界面组件映射矩阵.md
            /docs/接口协议动作清单与落地验收台账-20261122.md
            /docs/ui-assets/
            /upstream/codex/codex-rs/app-server-protocol/src/protocol/common.rs
            /upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/thread.rs
            /upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/turn.rs
            /upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/project.rs
            /upstream/codex/codex-rs/app-server-protocol/schema/json/v2/
          sparse-checkout-cone-mode: false
      - name: 使用 Runner Android SDK（仅补齐缺项）
        uses: ./.github/actions/ci-android
        with:
          mode: build
      - name: 验证 Compose、协议测试与静态检查
        run: bash .github/scripts/ci-gradle.sh -p android-app --dependency-verification strict :app:verifyAndroidTestRuntime :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: 复用 Python 锁定依赖下载缓存
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build/platform-toolchain.json', '.github/ci/requirements.lock') }}
      - name: 使用真实 Kotlin 请求样例逐字段校验 Rust Schema
        run: |
          test -s android-app/app/build/protocol-fixtures/requests.json
          python3 -m venv .ci-schema-venv
          .ci-schema-venv/bin/python -m pip install --require-hashes -r .github/ci/requirements.lock
          .ci-schema-venv/bin/python -m unittest discover \
            -s android-app/tools -p 'test_check_protocol_wire_fixtures.py'
          .ci-schema-venv/bin/python android-app/tools/check_protocol_wire_fixtures.py \
            --protocol upstream/codex/codex-rs/app-server-protocol/src/protocol/common.rs \
            --schemas upstream/codex/codex-rs/app-server-protocol/schema/json/v2 \
            --project-rust upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/project.rs \
            --thread-rust upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/thread.rs \
            --turn-rust upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/turn.rs \
            --fixtures android-app/app/build/protocol-fixtures/requests.json \
            --report wire-fixtures-audit.json
      - name: 保存测试与 Lint 报告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-android-ui-check-reports
          path: |
            android-app/app/build/reports/tests/
            android-app/app/build/reports/android-test-dependencies.txt
            android-app/app/build/reports/lint-results-debug.html
            android-app/app/build/test-results/testDebugUnitTest/
            wire-fixtures-audit.json
            android-app/app/build/protocol-fixtures/requests.json
          if-no-files-found: ignore
          retention-days: 14
      - name: 保存独立编译的 UI 与设备测试安装包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-android-ui-apks
          compression-level: 0
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14


      - name: 生成 UI 测试安装包字节凭证
        run: |
          cd android-app/app/build/outputs/apk
          sha256sum debug/app-debug.apk androidTest/debug/app-debug-androidTest.apk > "$RUNNER_TEMP/ui-apk-sha256.txt"
      - name: 保存 UI 测试安装包字节凭证
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-apk-integrity
          path: ${{ runner.temp }}/ui-apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

  ui-emulator:
    name: Android ${{ matrix.android_release }} (API ${{ matrix.api }}) · ${{ matrix.profile }} ${{ matrix.mode }} UI 交互与截图验收 · ${{ matrix.shard }}
    needs: [plan, verify-ui]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run_ui == 'true' && (needs.verify-ui.result == 'success' || (needs.verify-ui.result == 'skipped' && needs.plan.outputs.run_compile == 'false'))
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.device_shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: 检出截图采集器
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /.github/scripts/
            /.github/actions/ci-android/
            /.github/actions/ci-rust/
            /.github/ci/
            /.github/actions/run-emulator/
            /.github/actions/ci-emulator/
            /tools/build/
            /android-app/tools/collect_ui_screenshots.py
            /android-app/tools/ui_evidence_manifest.py
            /android-app/tools/run_ui_device_checks.py
            /android-app/tools/run_ui_motion_checks.py
            /android-app/tools/ui_visual_audit.py
            /android-app/tools/requirements-ui-visual.txt
            /android-app/tools/device_matrix.py
            /android-app/tools/device-matrix.json
            /android-app/tools/verify_self_update_open.py
            /docs/ui-assets/素材接入清单.json
          sparse-checkout-cone-mode: false
      - name: 安装固定 CI 工具
        run: python3 tools/build/platform_toolchain.py host "$RUNNER_TEMP/111-platform" gh
      - name: 取回 UI APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.run_compile == 'true' && 'codex-android-ui-apks' || '' }}
          artifact-ids: ${{ needs.plan.outputs.compile_apk_id }}
          path: apks
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.compile_run_id }}
      - name: 取回 UI 安装包字节凭证
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.run_compile == 'true' && 'ui-apk-integrity' || '' }}
          artifact-ids: ${{ needs.plan.outputs.compile_integrity_id }}
          path: apk-integrity
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.compile_run_id }}
      - name: 校验安装包完整性后启动模拟器
        run: |
          set -euo pipefail
          cd apks
          sha256sum -c ../apk-integrity/ui-apk-sha256.txt
      - name: 核对原始成功分片及真实安装包输入
        id: shard-reuse
        env:
          GH_TOKEN: ${{ github.token }}
          CI_COMPILE_PROOF: ${{ toJSON(fromJSON(needs.plan.outputs.receipt).reused.compile) }}
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ui_shard_reuse.py --repo "$GITHUB_REPOSITORY" --source "$TEST_SOURCE_SHA" --profile ${{ matrix.profile }} --mode ${{ matrix.mode }} --shard ${{ matrix.shard }}
      - name: 使用 Runner 模拟器及独立镜像缓存
        if: steps.shard-reuse.outputs.reused != 'true'
        uses: ./.github/actions/ci-emulator
      - name: 允许模拟器硬件加速
        if: steps.shard-reuse.outputs.reused != 'true'
        run: |
          sudo adduser "$USER" kvm || true
          sudo chmod 666 /dev/kvm
      - name: 在真实 Android 环境验证侧栏导航并生成首页截图
        if: steps.shard-reuse.outputs.reused != 'true'
        uses: ./.github/actions/run-emulator
        env:
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # All nine jobs use the shared SwiftShader GLES configuration.
          # Retain full guest CPU/memory and resolution; no hardware GPU assumed.
          LP_NUM_THREADS: ${{ needs.plan.outputs.device_mesa_threads }}
        with:
          profile: ${{ matrix.profile }}
          script: |
            python3 android-app/tools/device_matrix.py --verify-resources ui-device-resources.json
            adb install -r apks/debug/app-debug.apk
            adb shell appops set io.github.sy220284.codexandroid MANAGE_EXTERNAL_STORAGE allow
            adb install -r apks/androidTest/debug/app-debug-androidTest.apk
            # New AVDs already boot at the matrix's physical baseline. Validate
            # the actual state before motion or adaptive setup, without forcing HOME to relayout.
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "${{ matrix.api }}"
            baseline_font_scale="$(adb shell settings get system font_scale | tr -d '\r')"
            case "$baseline_font_scale" in
              null|1.0) ;;
              *) printf 'Unexpected initial AVD font scale: %s\n' "$baseline_font_scale" >&2; exit 1 ;;
            esac
            # The emulator has a hardware keyboard. Explicitly allow the software IME,
            # otherwise performTextInput succeeds while keyboard screenshots are false positives.
            adb shell settings put secure show_ime_with_hard_keyboard 1
            test "$(adb shell settings get secure show_ime_with_hard_keyboard | tr -d '\r')" = "1"
            adb shell ime list -s
            test "$(adb shell ime list -s | tr -d '\r' | grep -c .)" -gt 0
            test "$(adb shell wm size | awk '/(Override|Physical) size:/ {value=$3} END {print value}' | tr -d '\r')" = "${{ matrix.width_px }}x${{ matrix.height_px }}"
            test "$(adb shell wm density | awk '/(Override|Physical) density:/ {value=$3} END {print value}' | tr -d '\r')" = "${{ matrix.density_dpi }}"
            # The instrumentation test captures the home screen after a visible
            # Compose assertion, so slow devices cannot record the splash screen.
            adb shell am start -W -n io.github.sy220284.codexandroid/.MainActivity
            mkdir -p ui-screenshots
            # Clipboard-copy validation creates an Android system preview overlay. Run it last
            # so the overlay cannot cover screenshots of later business pages.
            # One runner preserves raw JUnit logs, screenshot evidence and classified
            # failure details; it must fail the job even when adb returns success.
            python3 android-app/tools/run_ui_device_checks.py --profile ${{ matrix.profile }} --mode ${{ matrix.mode }} --shard ${{ matrix.shard }}
            # Motion is measured once per physical profile, on its baseline device.
            # Only the designated mainstream emulator replaces the running app, then presses the
            # system installer's actual Install and Open buttons. Execute after
            # screenshots: package replacement kills the old app process.
            if [ "${{ matrix.self_update }}" = "true" ]; then bash -o pipefail -c 'python3 android-app/tools/verify_self_update_open.py --apk apks/debug/app-debug.apk --commit "${{ github.event.pull_request.head.sha || github.sha }}" --report self-update-open.json --screenshot self-update-after-open.png 2>&1 | tee self-update-open.log'; fi
            # Run observational performance after mandatory functional testing.
            # A bounded diagnostic may fail or time out; keep its actual exit code.
            if [ "${{ matrix.motion }}" = "true" ]; then bash -c 'status=0; timeout --kill-after=10s 360s python3 android-app/tools/run_ui_motion_checks.py --profile "${{ matrix.profile }}" || status=$?; printf "%s\\n" "$status" > ui-motion-exit; echo "Performance observation exit=$status (non-blocking)"'; fi
      - name: 保存独立分流的原始日志、截图与验收凭证
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-shard-${{ matrix.profile }}-${{ matrix.mode }}-${{ matrix.shard }}
          path: |
            ui-shard-input.json
            ui-shard-origin.json
            ui-device-resources.json
            ui-instrument-result.log
            ui-baseline-diagnosis.json
            ui-adaptive-result.log
            ui-adaptive-diagnosis.json
            ui-motion-exit
            ui-motion.log
            ui-motion-diagnosis.json
            ui-motion-performance.json
            ui-motion-environment.json
            ui-motion-failure.*
            ui-screenshots-adaptive/
            self-update-open.log
            self-update-open.json
            self-update-after-open.png
            ui-screenshots/
          if-no-files-found: error
          retention-days: 14

  ui-collect:
    name: UI 分流证据汇总 · ${{ matrix.profile }} ${{ matrix.mode }}
    needs: [plan, ui-emulator]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run_ui == 'true' && (needs.ui-emulator.result == 'success' || needs.ui-emulator.result == 'failure')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.device_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /.github/scripts/
            /.github/actions/ci-android/
            /.github/actions/ci-rust/
            /.github/ci/
            /.github/actions/run-emulator/
            /.github/actions/ci-emulator/
            /tools/build/
            /android-app/tools/
            /docs/ui-assets/素材接入清单.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: 安装固定 CI 工具
        run: python3 tools/build/platform_toolchain.py host "$RUNNER_TEMP/111-platform" python gh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ui-shard-${{ matrix.profile }}-${{ matrix.mode }}-*
          path: ui-shards
      - name: 核对并汇总两个独立模拟器的完整用例和截图
        env:
          GH_TOKEN: ${{ github.token }}
          CI_COMPILE_PROOF: ${{ toJSON(fromJSON(needs.plan.outputs.receipt).reused.compile) }}
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 android-app/tools/merge_ui_shards.py --profile ${{ matrix.profile }} --mode ${{ matrix.mode }} --root ui-shards
      - name: 复用 Python 锁定依赖下载缓存
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build/platform-toolchain.json', '.github/ci/requirements.lock') }}
      - name: 安装独立视觉审计依赖
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 -m venv .ui-visual-venv
          .ui-visual-venv/bin/pip install --require-hashes -r .github/ci/requirements.lock
      - name: 截图内容及历史视觉变化审计（仅记录）
        if: always() && !cancelled()
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .ui-visual-venv/bin/python android-app/tools/ui_visual_audit.py --profile ${{ matrix.profile }} --mode ${{ matrix.mode }} --repo "$GITHUB_REPOSITORY"
      - name: 保存视觉审计基线与差异
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-android-ui-visual-api${{ matrix.api }}-${{ matrix.profile }}-${{ matrix.mode }}
          path: ui-visual-evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: 保存 UI 设备测试与真实屏幕截图
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-android-ui-device-evidence-api${{ matrix.api }}-${{ matrix.profile }}-${{ matrix.mode }}
          path: |
            ui-instrument-result.log
            ui-baseline-diagnosis.json
            ui-adaptive-result.log
            ui-adaptive-diagnosis.json
            ui-motion-exit
            ui-motion.log
            ui-motion-diagnosis.json
            ui-motion-performance.json
            ui-motion-environment.json
            ui-motion-failure.*
            ui-screenshots-adaptive/
            self-update-open.log
            self-update-open.json
            self-update-after-open.png
            ui-screenshots/
            ui-shards/*/*.log
            ui-shards/*/ui-*-diagnosis.json
            ui-shards/*/ui-device-resources.json
            ui-shards/*/ui-shard-input.json
            ui-shards/*/ui-shard-origin.json
          if-no-files-found: ignore
          retention-days: 14

      - name: 保存供全矩阵核对的小型验收凭证
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-proof-${{ matrix.profile }}-${{ matrix.mode }}
          path: |
            ui-${{ matrix.mode }}-diagnosis.json
            ui-visual-evidence/report.json
            ui-motion-diagnosis.json
            ui-motion-performance.json
            ui-motion-environment.json
            ui-motion-exit
            self-update-open.json
          if-no-files-found: error
          retention-days: 14

  ui-evidence:
    name: 四组 UI 用例与证据一致性验收
    needs: [plan, ui-collect]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run_ui == 'true' && (needs.ui-collect.result == 'success' || needs.ui-collect.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            tools/build
            android-app/tools
          persist-credentials: false
      - name: 安装固定 CI 工具
        run: python3 tools/build/platform_toolchain.py host "$RUNNER_TEMP/111-platform" python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ui-proof-*
          path: ui-proofs
      - name: 核对四种配置、八台独立设备的实际用例集合与证据
        if: always() && !cancelled()
        env:
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 android-app/tools/verify_ui_matrix_evidence.py ui-proofs

  build:
    needs: [plan, native, runtime-arm64]
    if: needs.plan.outputs.run_package == 'true' && needs.native.result == 'success' && needs.runtime-arm64.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 检出 Android 工程及源码版本标记
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            android-app
            upstream/codex/codex-rs/model-provider/catalogs
            CODEX_UPSTREAM_COMMIT
            .github/scripts
            .github/actions/ci-android
            .github/actions/ci-rust
            .github/ci
            .github/actions/run-emulator
            .github/actions/ci-emulator
            tools/build
            tools/runtime
      - name: 使用 Runner Android SDK（仅补齐缺项）
        uses: ./.github/actions/ci-android
        with:
          mode: build
      - name: 取回 ARM64 原生核心
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-android-native-arm64-v8a
          run-id: ${{ needs.native.outputs.arm_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-arm64
      - name: 直接核验并装配 ARM64 产品运行时
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_ID: ${{ needs.runtime-arm64.outputs.artifact_id }}
          RUNTIME_SOURCE: ${{ needs.runtime-arm64.outputs.source }}
          RUNTIME_KEY: ${{ needs.runtime-arm64.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/assemble-product-runtime.sh arm64-v8a "$RUNTIME_ID" "$RUNTIME_SOURCE" "$RUNTIME_KEY" "$RUNNER_TEMP/native-arm64"
          head -n 1 CODEX_UPSTREAM_COMMIT
      - name: 下载并校验官方安卓增量恢复组件
        shell: bash
        run: bash .github/scripts/prepare-android-patcher.sh arm64-v8a
      - name: 制作可在安卓端回放的真实增量更新样本
        shell: bash
        run: bash .github/scripts/create-android-update-fixture.sh
      - name: 编译 Android APK 和设备测试包（单元测试由独立 UI 工作流执行）
        run: bash .github/scripts/ci-gradle.sh -p android-app --dependency-verification strict :app:assembleDebug :app:assembleDebugAndroidTest -PcodexSplitAbi=true -PcodexReleaseTargetAbi=arm64-v8a --no-daemon --stacktrace
      - name: 验证 ARM64 APK 的原生功能组件和 ABI
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk"
          test -s "android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          python3 .github/scripts/audit_apk_contents.py --apk "$APK" --abi arm64-v8a --mode full --report "$RUNNER_TEMP/arm64-apk-audit.json"
          python3 .github/scripts/verify_git_corresponding_source.py "$APK" "$RUNNER_TEMP/git-corresponding-source.tar.xz"

      - name: 保存完整 APK 审计及字节摘要
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-android-arm64-apk-audit
          path: ${{ runner.temp }}/arm64-apk-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: 上传 ARM64 安卓手机专用 APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-android-arm64-apk
          path: android-app/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: 上传同一 APK 的 Git 对应源码
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-android-arm64-git-corresponding-source
          path: ${{ runner.temp }}/git-corresponding-source.tar.xz
          if-no-files-found: error
          retention-days: 30
      - name: 上传设备仪器测试 APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-android-instrumentation-apk
          path: android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 30

      - name: 生成完整 R8 专项候选的临时测试签名
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/create-ci-signing-key.sh
      - name: 构建含真实 ARM64 内核的 R8 压缩候选
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/ci-gradle.sh -p android-app --dependency-verification strict :app:lintRelease :app:assembleRelease \
            -PcodexR8Candidate=true -PcodexSplitAbi=true -PcodexReleaseTargetAbi=arm64-v8a \
            -PcodexReleaseVersionName=0.1.0-111.999 -PcodexReleaseVersionCode=999 --no-daemon --stacktrace
          APK="android-app/app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          test -s android-app/app/build/outputs/mapping/release/mapping.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --min-sdk-version 29 "$APK"
          mkdir -p "$RUNNER_TEMP/r8-candidate"
          python3 .github/scripts/audit_apk_contents.py --apk "$APK" --abi arm64-v8a --mode full --report "$RUNNER_TEMP/r8-candidate/apk-audit.json"
          cp "$APK" android-app/app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/r8-candidate/"
          wc -c "$APK" | tee "$RUNNER_TEMP/r8-candidate/size.txt"
      - name: 保存完整 R8 专项候选包及真实原生组件审计
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-arm64-candidate-not-for-release
          path: ${{ runner.temp }}/r8-candidate/
          if-no-files-found: error
          retention-days: 14

  runtime-test:
    name: Android ${{ needs.plan.outputs.device_release }} (API ${{ needs.plan.outputs.device_api }}) 真实内核及异常恢复验收（x86_64）
    needs: [plan, native, runtime-x86]
    if: needs.native.result == 'success' && needs.runtime-x86.result == 'success' && needs.plan.outputs.run_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 检出同提交 Android 工程与原生配方
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            android-app
            upstream/codex/codex-rs/model-provider/catalogs
            CODEX_UPSTREAM_COMMIT
            .github/scripts
            .github/actions/ci-android
            .github/actions/ci-rust
            .github/ci
            .github/actions/run-emulator
            .github/actions/ci-emulator
            tools/build
            tools/runtime
      - name: 使用 Runner Android 编译环境
        uses: ./.github/actions/ci-android
        with:
          mode: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-android-native-x86_64
          run-id: ${{ needs.native.outputs.x86_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-x86
      - name: 直接核验并装配 x86_64 产品运行时
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_ID: ${{ needs.runtime-x86.outputs.artifact_id }}
          RUNTIME_SOURCE: ${{ needs.runtime-x86.outputs.source }}
          RUNTIME_KEY: ${{ needs.runtime-x86.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/assemble-product-runtime.sh x86_64 "$RUNTIME_ID" "$RUNTIME_SOURCE" "$RUNTIME_KEY" "$RUNNER_TEMP/native-x86"
          bash .github/scripts/prepare-android-patcher.sh x86_64
          bash .github/scripts/create-android-update-fixture.sh
          bash .github/scripts/ci-gradle.sh -p android-app --dependency-verification strict -PcodexTargetAbi=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
          python3 .github/scripts/audit_apk_contents.py --apk android-app/app/build/outputs/apk/debug/app-debug.apk --abi x86_64 --mode full
          mkdir -p "$RUNNER_TEMP/runtime-baseline" "$RUNNER_TEMP/runtime-api37"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/runtime-baseline/app.apk"
          cp android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/runtime-baseline/test.apk"
          bash .github/scripts/ci-gradle.sh -p android-app --dependency-verification strict -PcodexTargetAbi=x86_64 -PcodexAndroid17Candidate=true :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/runtime-api37/app.apk"
          cp android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/runtime-api37/test.apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$RUNNER_TEMP/runtime-api37/app.apk" | grep -Fx "targetSdkVersion:'37'"
          python3 .github/scripts/audit_apk_contents.py --apk "$RUNNER_TEMP/runtime-api37/app.apk" --abi x86_64 --mode full
      - name: 使用 Runner 模拟器及独立镜像缓存
        uses: ./.github/actions/ci-emulator
      - name: 允许模拟器硬件加速
        run: |
          sudo adduser "$USER" kvm || true
          sudo chmod 666 /dev/kvm
      - name: 执行真实内核启动、终端、回收与恢复
        uses: ./.github/actions/run-emulator
        with:
          profile: ${{ needs.plan.outputs.device_runtime_profile }}
          script: |
            python3 android-app/tools/device_matrix.py --verify-resources runtime-evidence/device-resources.json
            bash .github/scripts/run-android-runtime-tests.sh "$RUNNER_TEMP/runtime-baseline/app.apk" "$RUNNER_TEMP/runtime-baseline/test.apk" x86_64 runtime-evidence "$RUNNER_TEMP/runtime-api37/app.apk" "$RUNNER_TEMP/runtime-api37/test.apk"
      - name: 保存真实内核验收证据
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-android-real-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 30


  verify-apk:
    name: ARM64 手机安装包二次核验
    needs: [plan, build]
    # Independent integrity verification; the final gate still requires runtime when selected.
    if: needs.build.result == 'success' && needs.plan.outputs.run_package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Jobs have separate workspaces. The APK and its audit script are both
      # required; the upload artifact contains only the APK, not repository files.
      - name: 检出 APK 安全检查脚本
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          sparse-checkout: |
            /tools/build/
            /.github/scripts/audit_apk_contents.py
          sparse-checkout-cone-mode: false
      - name: 安装固定 CI 工具
        run: python3 tools/build/platform_toolchain.py host "$RUNNER_TEMP/111-platform" python
      - name: 取回 ARM64 原生 APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-android-arm64-apk
          path: apks
      - name: 取回同一构建的完整审计凭证
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-android-arm64-apk-audit
          path: audit
      - name: 独立核对上传下载 APK 的完整字节哈希
        run: python3 .github/scripts/audit_apk_contents.py --apk apks/app-arm64-v8a-debug.apk --abi arm64-v8a --mode full --verify-report audit/arm64-apk-audit.json

  preflight:
    name: 发布脚本回归检查
    needs: plan
    if: needs.plan.outputs.run_preflight == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: 安装固定 CI 工具
        run: python3 tools/build/platform_toolchain.py host "$RUNNER_TEMP/111-platform" python
      - name: 检查版本号、Shell 语法和中文发布说明
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-111\.[0-9]+$' .github/release-version
          bash -n .github/scripts/publish-verified-release.sh
          bash -n .github/scripts/verify-release-device.sh
          bash -n .github/scripts/prepare-release-assets.sh
          bash -n .github/scripts/prepare-android-patcher.sh
          bash -n .github/scripts/create-android-update-fixture.sh
          python3 .github/scripts/run_ci_script_tests.py preflight
          python3 android-app/tools/prepare_android_code_mode.py --check \
            upstream/codex/codex-rs/install-context/src/lib.rs \
            --host-source upstream/codex/codex-rs/code-mode-host/src/main.rs \
            --features-source upstream/codex/codex-rs/features/src/lib.rs
          python3 -m unittest discover -s android-app/tools -p 'test_prepare_android_code_mode.py'
          python3 -m unittest discover -s android-app/tools -p 'test_prepare_android_remote_delivery.py'
          python3 android-app/tools/prepare_android_remote_delivery.py --check upstream/codex/codex-rs
          python3 -m unittest discover -s android-app/tools -p 'test_prepare_prebuilt_developer_runtime.py'
          bash -n android-app/tools/package_native_runtime.sh
          bash -n android-app/tools/prepare_android_v8.sh
          python3 -m unittest discover -s android-app/tools -p 'test_adapt_android_v8_build.py'

  release-signing-smoke:
    name: PR 内验证 Release 签名构建
    needs: [plan, static-ui, preflight]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run_sign == 'true' && (needs.static-ui.result == 'success' || needs.static-ui.result == 'skipped') && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            android-app
            upstream/codex/codex-rs/model-provider/catalogs
            .github/scripts
            .github/actions/ci-android
            .github/actions/ci-rust
            .github/ci
            .github/actions/run-emulator
            .github/actions/ci-emulator
            tools/build
      - name: 使用 Runner Android SDK（仅补齐缺项）
        uses: ./.github/actions/ci-android
        with:
          mode: build
      - name: 生成仅本次 CI 有效的测试签名
        run: bash .github/scripts/create-ci-signing-key.sh
      - name: 校验并装配正式版增量恢复组件
        shell: bash
        run: bash .github/scripts/prepare-android-patcher.sh arm64-v8a
      - name: 真实编译并验证 ARM64 手机签名 Release APK
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/ci-gradle.sh -p android-app --dependency-verification strict :app:lintRelease :app:assembleRelease \
            -PcodexSplitAbi=true \
            -PcodexReleaseTargetAbi=arm64-v8a \
            -PcodexReleaseVersionName=0.1.0-111.999 \
            -PcodexReleaseVersionCode=999 --no-daemon --stacktrace
          APK="android-app/app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          test -s "$APK"
          python3 .github/scripts/audit_apk_contents.py --apk "$APK" --abi arm64-v8a --mode ui-smoke
          test ! -e "android-app/app/build/outputs/apk/release/app-x86_64-release.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --min-sdk-version 29 "$APK"
          BADGE="$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | sed -n '1p')"
          [[ "$BADGE" == *"name='io.github.sy220284.codexandroid'"* ]]
          [[ "$BADGE" == *"versionCode='999'"* ]]
          [[ "$BADGE" == *"versionName='0.1.0-111.999'"* ]]


  compatibility:
    name: MXC 和 Code Mode Host 源码适配预演
    needs: plan
    if: needs.plan.outputs.run_compat == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          sparse-checkout: |
            /tools/build/
            /CODEX_UPSTREAM_COMMIT
            /.github/scripts/merge_codex_upstream.py
            /.github/scripts/test_merge_codex_upstream.py
            /upstream/codex/
            /android-app/tools/prepare_android_mxc.py
            /android-app/tools/prepare_android_code_mode.py
            /android-app/tools/rehearse_upstream_upgrade.py
            /android-app/tools/test_rehearse_upstream_upgrade.py
          sparse-checkout-cone-mode: false
      - name: 安装固定 CI 工具
        run: python3 tools/build/platform_toolchain.py host "$RUNNER_TEMP/111-platform" python
      - name: 检验升级预演逻辑的正常和异常场景
        run: python3 -m unittest discover -s android-app/tools -p 'test_rehearse_upstream_upgrade.py'
      - name: 只检出候选 Cargo.toml 固定的 MXC 提交
        shell: bash
        run: |
          set -euo pipefail
          MXC_REV="$(python3 - <<'PY'
          import pathlib
          import re
          text = pathlib.Path("upstream/codex/codex-rs/Cargo.toml").read_text()
          found = re.findall(
              r'(?m)^\s*mxc-sdk\s*=\s*\{\s*git\s*=\s*"https://github.com/microsoft/mxc"\s*,\s*rev\s*=\s*"([0-9a-f]{40})"',
              text,
          )
          if len(found) != 1:
              raise SystemExit("候选 MXC 版本缺失或不唯一")
          print(found[0])
          PY
          )"
          git init -q "$RUNNER_TEMP/mxc-source"
          git -C "$RUNNER_TEMP/mxc-source" -c protocol.version=2 fetch --depth=1 \
            https://github.com/microsoft/mxc.git "$MXC_REV"
          git -C "$RUNNER_TEMP/mxc-source" checkout --detach -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mxc-source" rev-parse HEAD)" = "$MXC_REV"
          test -s "$RUNNER_TEMP/mxc-source/src/mxc-sdk/src/core/mxc_engine/dispatch.rs"
      - name: 校验真实候选源码与补丁兼容性
        run: |
          python3 android-app/tools/rehearse_upstream_upgrade.py \
            --codex-rs upstream/codex/codex-rs \
            --mxc-dispatch "$RUNNER_TEMP/mxc-source/src/mxc-sdk/src/core/mxc_engine/dispatch.rs"

  quality:
    name: 111 合并验收
    needs: [plan, native, runtime-arm64, runtime-x86, static-ui, verify-ui, ui-emulator, ui-collect, ui-evidence, build, runtime-test, verify-apk, preflight, release-signing-smoke, compatibility]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /tools/build/
            /.github/scripts/
            /.github/ci/
            /android-app/tools/
            /android-app/app/gradle.lockfile
            /android-app/gradle/verification-metadata.xml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: 安装固定 CI 工具
        run: python3 tools/build/platform_toolchain.py host "$RUNNER_TEMP/111-platform" python gh
      - name: 汇总并强制核对所有适用验收
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci_gate.py
      - name: 强制核对已审查的 Gradle 依赖基线
        if: needs.plan.outputs.full == 'true'
        run: |
          set -euo pipefail
          test -s android-app/app/gradle.lockfile || { echo "::error::须审查并提交真实依赖锁文件"; exit 1; }
          test -s android-app/gradle/verification-metadata.xml || { echo "::error::须审查并提交依赖验证元数据"; exit 1; }
      - name: 保存可核验的验收凭证
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-acceptance-receipt
          path: ci-acceptance-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: 记录任务耗时、取消与资源使用
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci_metrics.py
