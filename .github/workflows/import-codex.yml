name: 手动增量合并官方 Codex 并创建审核 PR

on:
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: 指定完整官方 main 祖先提交 SHA；留空使用官方 main 最新提交
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-upstream-import-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  import:
    name: 三方增量合并并创建审核 PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 验证增量合并回归
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_merge_codex_upstream.py'
      - name: 获取官方提交并三方合并
        shell: bash
        env:
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        run: |
          set -euo pipefail
          TARGET="$(bash .github/scripts/fetch_codex_upstream.sh "$UPSTREAM_SHA")"
          python3 -B .github/scripts/merge_codex_upstream.py --target "$TARGET"
          bash .github/scripts/refresh_codex_catalog_lock.sh
          cat CODEX_UPSTREAM_COMMIT
          python3 -B android-app/tools/review_upstream_protocol.py --candidate "$(git write-tree)" --report-only
          if find upstream/codex -type f -size +95M -print -quit | grep -q .; then
            echo "::error::存在超过 95 MB 的文件，需要 LFS 或分包"
            exit 1
          fi
      - name: 提交增量升级分支并创建中文草稿 PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "上游源码无变化，无需创建 PR"
            exit 0
          fi
          SHA="$(head -n 1 CODEX_UPSTREAM_COMMIT)"
          BASE_SHA="$(git rev-parse HEAD)"
          BRANCH="chore/codex-upstream-${SHA:0:12}-${BASE_SHA:0:12}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::已有升级分支 $BRANCH，请先处理已有 PR"
            exit 1
          fi
          git switch -c "$BRANCH"
          git commit -m "增量合并官方 Codex：${SHA:0:12}"
          git push -u origin "$BRANCH"
          gh pr create --draft --base "$GITHUB_REF_NAME" --head "$BRANCH" \
            --title "增量合并官方 Codex：${SHA:0:12}" \
            --body "## 本次变更

          - 基于原锁定官方提交、111 当前源码和新官方提交进行 Git 三方合并。
          - 官方目标：$SHA；保留独立修改，真实冲突须人工审计。
          - 合并前验收：协议与界面差异、ARM64 核心、APK 和三档设备、Android 兼容适配。"
