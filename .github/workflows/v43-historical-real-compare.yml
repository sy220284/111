name: 2.1.88真实源码全仓函数候选对照

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/batch-restoration-candidates.cjs'
      - 'scripts/review-historical-candidates.cjs'
      - 'tests/review-historical-candidates.test.cjs'
      - 'tests/v44-real-historical-703.test.cjs'
      - 'scripts/audit-historical-business-chains.cjs'
      - 'tests/historical-business-chains.test.cjs'
      - 'tests/v45-real-business-703.test.cjs'
      - 'src/chunk-9z5ybxhe.js'
      - 'src/chunk-wrtp8qz8.js'
      - 'src/chunk-bwt94x0y.js'
      - 'src/chunk-t2adf9g4.js'
      - '.github/workflows/v43-historical-real-compare.yml'

permissions:
  contents: read

jobs:
  compare:
    name: 固定版本2.1.88与2.1.310真实函数全仓候选对照
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: 按lockfile安装固定AST分析依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 拉取固定提交的真实2.1.88参考源码，不复制旧版进111
        shell: bash
        run: |
          set -euo pipefail
          ref=c8cd253554319f32ff64ff7000636199f720c9bc
          root="$RUNNER_TEMP/v2188"
          git init -q "$root"
          git -C "$root" remote add origin https://github.com/Exhen/claude-code-2.1.88.git
          git -C "$root" -c protocol.version=2 fetch -q --depth=1 origin "$ref"
          git -C "$root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$ref"
          test -f "$root/source/src/utils/array.ts"
          echo "OLD_SOURCE_ROOT=$root/source/src" >> "$GITHUB_ENV"
      - name: 执行真实两代源文件全仓函数指纹与歧义扫描
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          mkdir -p .generated
          node scripts/batch-restoration-candidates.cjs \
            --old "$OLD_SOURCE_ROOT" --new src --all --max 5000 \
            --reference '2.1.88 public mirror commit c8cd253554319f32ff64ff7000636199f720c9bc' \
            --out .generated/v43-historical-real-full.json
          node scripts/review-historical-candidates.cjs \
            --candidates .generated/v43-historical-real-full.json \
            --old "$OLD_SOURCE_ROOT" --new src --expected 703 \
            --out .generated/v44-reviewed-703.json
          node --test tests/v44-real-historical-703.test.cjs
          node tools/analysis/code-graph.cjs scan --full --output .generated/v45-full-code-graph.json > /dev/null
          node scripts/audit-historical-business-chains.cjs \
            --audited .generated/v44-reviewed-703.json \
            --graph .generated/v45-full-code-graph.json \
            --src src --out .generated/v45-703-business-chains.json
          node --test tests/v45-real-business-703.test.cjs

          node - <<'NODE'
          const fs=require('node:fs');
          const j=JSON.parse(fs.readFileSync('.generated/v43-historical-real-full.json','utf8'));
          if(!j.scanned.oldFiles || j.scanned.newFiles!==2551)throw Error('did not scan full old and new source sets');
          const audit=JSON.parse(fs.readFileSync('.generated/v44-reviewed-703.json','utf8'));
          if(audit.summary.sourceLocationsValidated!==703||audit.items.length!==703)throw Error('703-case review incomplete');
          const chains=JSON.parse(fs.readFileSync('.generated/v45-703-business-chains.json','utf8'));
          if(chains.summary.examined!==703||chains.summary.sourceDefinitionsLocated!==703)throw Error('703 function-chain reconciliation incomplete');
          const out=[
            '## 真实跨版本源码匹配统计（候选，非等价证明）',
            '| 指标 | 实测 |','|---|---:|',
            ...Object.entries(j.scanned).map(([k,v])=>`| ${k} | ${v} |`),
            ...Object.entries(j.counts).map(([k,v])=>`| ${k} | ${v} |`),
            ...Object.entries(audit.summary.classification).map(([k,v])=>`| independent:${k} | ${v} |`),
            ...Object.entries(chains.summary).filter(([k,v])=>typeof v==='number').map(([k,v])=>`| chain:${k} | ${v} |`),
            `| 逐条独立结构证据核查 | ${audit.summary.reviewedWithIndependentStaticEvidence} |`,
            `| 经过行为等价验证 | ${audit.summary.runtimeBehaviorVerified} |`,
            `| 已证明语义等价 | ${audit.summary.semanticEquivalenceConfirmed} |`,
            '',
            '固定参考：Exhen/claude-code-2.1.88@c8cd253554319f32ff64ff7000636199f720c9bc',
            '原始资料库ZIP未在CI进行字节等价校验；候选不得自动覆盖新版实现。'
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,out+'\n');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 111-v43-real-historical-function-candidates
          path: |
            .generated/v43-historical-real-full.json
            .generated/v44-reviewed-703.json
            .generated/v45-703-business-chains.json
          retention-days: 30
