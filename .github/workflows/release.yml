name: 111 Android 正式发布

'on':
  workflow_run:
    workflows: ['111 统一质量验收']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: android-release-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  # Only supersede outdated PR signing checks; keep published releases serialized.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: 手动发布脚本回归检查
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  check-release:
    name: 识别待发布源码与版本
    needs: preflight
    if: >-
      !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       needs.preflight.result == 'success') ||
       (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      decision: ${{ steps.detect.outputs.decision }}
      version: ${{ steps.detect.outputs.version }}
      version_code: ${{ steps.detect.outputs.version_code }}
      release_sha: ${{ steps.detect.outputs.release_sha }}
      previous_tag: ${{ steps.detect.outputs.previous_tag }}
      native_run_id: ${{ steps.detect.outputs.native_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: 安装固定发布工具
        run: python3 tools/build/platform_toolchain.py host "$RUNNER_TEMP/111-platform" python gh
      - name: 仅为未发布的客户端变更递增版本
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          git fetch origin main
          LATEST_MAIN="$(git rev-parse FETCH_HEAD)"
          # 仅仓库维护变更可沿用已验收候选，绝不混合不同 SHA 的设备证据。
          SELECT_STATUS=0
          select_args=(--repo "$GITHUB_REPOSITORY" --latest-main "$LATEST_MAIN")
          if [ -n "$TRIGGER_SHA" ]; then select_args+=(--trigger-sha "$TRIGGER_SHA"); fi
          RELEASE_SHA="$(python3 .github/scripts/select_release_candidate.py "${select_args[@]}")" || SELECT_STATUS=$?
          if [ "$SELECT_STATUS" -eq 3 ]; then
            echo "::notice::等待当前客户端候选通过完整验收"
            echo "decision=waiting-ci" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$SELECT_STATUS" -ne 0 ]; then
            exit "$SELECT_STATUS"
          fi
          # 退役台账使用当前 main 的版本，即使已验收产品候选更早。
          git show "$LATEST_MAIN:.github/scripts/release_lifecycle.py" > "$RUNNER_TEMP/release_lifecycle.py"
          git show "$LATEST_MAIN:.github/scripts/retired-releases.json" > "$RUNNER_TEMP/retired-releases.json"
          python3 "$RUNNER_TEMP/release_lifecycle.py" select --ledger "$RUNNER_TEMP/retired-releases.json" --source "$RELEASE_SHA" > "$RUNNER_TEMP/release-lifecycle.json"
          git checkout --detach "$RELEASE_SHA"
          set -euo pipefail
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

          EXISTING="$(jq -er .existing "$RUNNER_TEMP/release-lifecycle.json")"
          if [ -n "$EXISTING" ]; then
            echo "::notice::当前源码已发布：$EXISTING"
            echo "decision=already-published" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_TAG="$(jq -er .previous_tag "$RUNNER_TEMP/release-lifecycle.json")"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$PREVIOUS_TAG" ]; then
            git merge-base --is-ancestor "$PREVIOUS_TAG" "$RELEASE_SHA" || {
              echo "::error::上版提交不在当前发布链上，需要人工检查主分支历史"; exit 1;
            }
            GATE_STATUS=0
            python3 .github/scripts/release_change_gate.py \
              --base "$PREVIOUS_TAG" --head "$RELEASE_SHA" || GATE_STATUS=$?
            if [ "$GATE_STATUS" -eq 3 ]; then
              echo "::notice::仅有无关变更，跳过重复 APK"
              echo "decision=no-client-change" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$GATE_STATUS" -ne 0 ]; then
              echo "::error::无法确认 Android 发版输入，终止发布"
              exit "$GATE_STATUS"
            fi
          fi

          # 统一的原生内核复用判据：上游源码树、版本、依赖修补器及
          # 实际 Rust/NDK 编译配方全部一致，且产物未过期。
          LOOKUP_STATUS=0
          python3 .github/scripts/select_native_artifacts.py \
            --repo "$GITHUB_REPOSITORY" --abis arm64-v8a \
            > "$RUNNER_TEMP/native-release-run" || LOOKUP_STATUS=$?
          if [ "$LOOKUP_STATUS" -eq 3 ]; then
            echo "::notice::尚无与当前源码及编译参数完全一致的 ARM64 原生内核，等待原生构建后再发版"
            echo "decision=waiting-native" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$LOOKUP_STATUS" -ne 0 ]; then
            echo "::error::原生内核复用查询异常，已终止发布"
            exit "$LOOKUP_STATUS"
          fi
          NATIVE_ID="$(cat "$RUNNER_TEMP/native-release-run")"
          echo "native_run_id=$NATIVE_ID" >> "$GITHUB_OUTPUT"
          echo "复用已验证 ARM64 原生构建 $NATIVE_ID"

          FALLBACK="$(tr -d '\r\n' < .github/release-version)"
          if [[ ! "$FALLBACK" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-111\.([0-9]+)$ ]]; then
            echo "::error::初始化版本格式非法"; exit 1
          fi
          BASE="${BASH_REMATCH[1]}"
          SEQUENCE="${BASH_REMATCH[2]}"
          MAX_SEQUENCE=0
          LATEST_TAG=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-111\.([0-9]+)$ ]]; then
              if (( 10#${BASH_REMATCH[2]} > MAX_SEQUENCE )); then
                MAX_SEQUENCE="$((10#${BASH_REMATCH[2]}))"
              fi
              LATEST_TAG="$tag"
            fi
          done < <(git tag -l 'v*-111.*' | sort -V)
          if [ -n "$LATEST_TAG" ]; then
            LATEST_BASE="${LATEST_TAG#v}"
            LATEST_BASE="${LATEST_BASE%-111.*}"
            if [ "$(printf '%s\n%s\n' "$BASE" "$LATEST_BASE" | sort -V | tail -n 1)" = "$LATEST_BASE" ]; then
              BASE="$LATEST_BASE"
            fi
            SEQUENCE="$((MAX_SEQUENCE + 1))"
          fi
          if (( 10#$SEQUENCE > 2100000000 )); then
            echo "::error::Android versionCode 超出限制"; exit 1
          fi
          VERSION="$BASE-111.$((10#$SEQUENCE))"
          {
            echo "version=$VERSION"
            echo "version_code=$((10#$SEQUENCE))"
            echo "decision=publish"
          } >> "$GITHUB_OUTPUT"
          echo "准备发布 $RELEASE_SHA -> v$VERSION"

  developer-runtime:
    needs: check-release
    if: ${{ !cancelled() && needs.check-release.result == 'success' && needs.check-release.outputs.decision == 'publish' }}
    uses: ./.github/workflows/prepare-developer-runtime.yml
    with:
      abi: arm64-v8a
      source_sha: ${{ needs.check-release.outputs.release_sha }}

  release:
    name: 签名并保存唯一 ARM64 候选 APK
    needs: [check-release, developer-runtime]
    # The PR-only preflight is skipped for workflow_run. Check the actual
    # acceptance result explicitly instead of inheriting an implicit success().
    if: ${{ !cancelled() && needs.check-release.result == 'success' && needs.developer-runtime.result == 'success' && needs.check-release.outputs.decision == 'publish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-release.outputs.release_sha }}
          fetch-depth: 0
      - name: 安装固定发布工具
        run: python3 tools/build/platform_toolchain.py host "$RUNNER_TEMP/111-platform" gh

      - name: 使用 Runner Android SDK（仅补齐缺项）
        uses: ./.github/actions/ci-android
        with:
          mode: build
      - name: 阻断未经审查的依赖基线
        shell: bash
        run: |
          set -euo pipefail
          test -s android-app/app/gradle.lockfile
          test -s android-app/gradle/verification-metadata.xml
      - name: 校验正式签名材料
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::请为 111 配置 RELEASE_KEYSTORE（Base64）与 RELEASE_KEY_PASSWORD（密钥库及私钥共用密码）"
            exit 1
          fi
          KEYSTORE_B64="${KEYSTORE_B64#RELEASE_KEYSTORE=}"
          KEYSTORE_B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
          KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD#RELEASE_KEY_PASSWORD=}"
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          KEYSTORE_PATH="$RUNNER_TEMP/111-release.keystore"
          REMAINDER="$(("${#KEYSTORE_B64}" % 4))"
          case "$REMAINDER" in
            0) ;;
            2) KEYSTORE_B64="${KEYSTORE_B64}==" ;;
            3) KEYSTORE_B64="${KEYSTORE_B64}=" ;;
            *) echo "::error::签名密钥库 Base64 不完整"; exit 1 ;;
          esac
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias 111-release >/dev/null
          chmod 600 "$KEYSTORE_PATH"
          {
            echo "CODEX_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "CODEX_RELEASE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "CODEX_RELEASE_KEY_ALIAS=111-release"
          } >> "$GITHUB_ENV"


      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-android-native-arm64-v8a
          run-id: ${{ needs.check-release.outputs.native_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-arm64

      - name: 直接核验并装配正式 ARM64 产品运行时
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_ID: ${{ needs.developer-runtime.outputs.artifact_id }}
          RUNTIME_SOURCE: ${{ needs.developer-runtime.outputs.source }}
          RUNTIME_KEY: ${{ needs.developer-runtime.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/assemble-product-runtime.sh arm64-v8a "$RUNTIME_ID" "$RUNTIME_SOURCE" "$RUNTIME_KEY" "$RUNNER_TEMP/native-arm64"

      - name: 装配官方 ARM64 增量恢复组件
        shell: bash
        run: bash .github/scripts/prepare-android-patcher.sh arm64-v8a

      - name: 生成与已合并 PR 一致的中文更新说明
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.check-release.outputs.previous_tag }}
          RELEASE_SHA: ${{ needs.check-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/generate-release-notes.py \
            --repo "$GITHUB_REPOSITORY" --base "$PREVIOUS_TAG" \
            --head "$RELEASE_SHA" --output "$RUNNER_TEMP/release-notes.md"

      - name: 测试并构建正式签名 APK
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/ci-gradle.sh -p android-app --dependency-verification strict :app:lintRelease :app:assembleRelease \
            -PcodexSplitAbi=true \
            -PcodexReleaseTargetAbi=arm64-v8a \
            -PcodexReleaseVersionName="${{ needs.check-release.outputs.version }}" \
            -PcodexReleaseVersionCode="${{ needs.check-release.outputs.version_code }}" \
            --no-daemon --stacktrace

      - name: 核验签名、应用包名、版本与 ABI
        id: verify-signature
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.check-release.outputs.previous_tag }}
        run: |
          set -euo pipefail
          DIR="android-app/app/build/outputs/apk/release"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          APKSIG_JAR="$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar"
          VERSION="${{ needs.check-release.outputs.version }}"
          CODE="${{ needs.check-release.outputs.version_code }}"
          APK="$DIR/app-arm64-v8a-release.apk"
          test -s "$APK"
          test ! -e "$DIR/app-x86_64-release.apk"
          BADGE="$("$AAPT" dump badging "$APK" | sed -n '1p')"
          [[ "$BADGE" == *"name='io.github.sy220284.codexandroid'"* ]]
          [[ "$BADGE" == *"versionCode='$CODE'"* ]]
          [[ "$BADGE" == *"versionName='$VERSION'"* ]]
          CERT="$(java --class-path "$APKSIG_JAR" .github/scripts/VerifyApkSigning.java "$APK")"
          [[ "$CERT" =~ ^[0-9a-f]{64}$ ]]
          EXPECTED_CERT="$(keytool -exportcert -keystore "$CODEX_RELEASE_KEYSTORE_PATH" -storepass:env CODEX_RELEASE_PASSWORD -alias "$CODEX_RELEASE_KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)"
          if [ "$CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::候选 APK 签名证书与正式密钥库不一致"
            exit 1
          fi
          echo "候选 APK 签名验证通过：$CERT"
          if [ -n "$PREVIOUS_TAG" ]; then
            mkdir -p "$RUNNER_TEMP/previous-cert"
            gh release download "$PREVIOUS_TAG" --pattern "codex-android-arm64-v8a-*.apk" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/previous-cert"
            shopt -s nullglob
            OLD_FILES=("$RUNNER_TEMP/previous-cert"/codex-android-arm64-v8a-*.apk)
            if [ "${#OLD_FILES[@]}" -ne 1 ] || [ ! -s "${OLD_FILES[0]:-}" ]; then
              echo "::error::上一正式版本必须提供唯一且非空的 ARM64 APK"
              exit 1
            fi
            OLD="${OLD_FILES[0]}"
            OLD_BADGE="$("$AAPT" dump badging "$OLD" | sed -n '1p')"
            OLD_CODE="${PREVIOUS_TAG##*.}"
            if [[ "$OLD_BADGE" != *"name='io.github.sy220284.codexandroid'"* ||
                  "$OLD_BADGE" != *"versionCode='$OLD_CODE'"* ||
                  "$OLD_BADGE" != *"versionName='${PREVIOUS_TAG#v}'"* ]]; then
              echo "::error::上版已下载 APK 的应用身份或版本与正式标签不一致"
              exit 1
            fi
            OLD_CERT="$(java --class-path "$APKSIG_JAR" .github/scripts/VerifyApkSigning.java "$OLD")"
            [[ "$OLD_CERT" =~ ^[0-9a-f]{64}$ ]]
            if [ "$CERT" != "$OLD_CERT" ]; then
              echo "::error::候选 APK 与上一个正式版本的签名证书不同，禁止覆盖升级"
              exit 1
            fi
            printf 'previous_apk=%s\n' "$OLD" >> "$GITHUB_OUTPUT"
            echo "已核对上一正式版本 $PREVIOUS_TAG 的应用身份与签名证书一致性"
          fi
          PREVIOUS_ARGS=()
          if [ -n "$PREVIOUS_TAG" ]; then PREVIOUS_ARGS=(--previous-apk "$OLD"); fi
          python3 .github/scripts/audit_apk_contents.py --apk "$APK" --abi arm64-v8a --mode full \
            "${PREVIOUS_ARGS[@]}" --report "$RUNNER_TEMP/release-apk-audit.json"

      - name: 制作校验清单及可回放增量更新包
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
          RELEASE_TAG: v${{ needs.check-release.outputs.version }}
          PREVIOUS_TAG: ${{ needs.check-release.outputs.previous_tag }}
          PREVIOUS_APK: ${{ steps.verify-signature.outputs.previous_apk }}
        run: |
          set -euo pipefail
          bash .github/scripts/prepare-release-assets.sh
          if [ -n "$PREVIOUS_TAG" ]; then
            python3 .github/scripts/verify_upgrade_assets.py \
              --previous "$PREVIOUS_APK" \
              --previous-tag "$PREVIOUS_TAG" --sums "$RUNNER_TEMP/previous-cert/SHA256SUMS.txt" \
              --candidate .release-assets --version "$RELEASE_VERSION" \
              --output "$RUNNER_TEMP/upgrade-assets.json"
          fi

      - name: 保存唯一正式候选
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: .release-assets/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: 保存正式 APK 逐文件体积及版本差异
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk-audit
          path: ${{ runner.temp }}/release-apk-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: 保存中文发布说明
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
      - name: 清理签名材料
        if: always()
        run: rm -f "$RUNNER_TEMP/111-release.keystore"


  publish:
    name: 远端回读后正式公开
    needs: [check-release, release]
    if: ${{ !cancelled() && needs.check-release.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-release.outputs.release_sha }}
          fetch-depth: 0
      - name: 安装固定发布工具
        run: python3 tools/build/platform_toolchain.py host "$RUNNER_TEMP/111-platform" python gh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: .release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes
      - name: 核验正式候选全部资产摘要
        run: |
          set -euo pipefail
          (cd .release-assets && sha256sum -c SHA256SUMS.txt)
      - name: 发布前再次核对 main 客户端源码
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          python3 .github/scripts/select_release_candidate.py \
            --repo "$GITHUB_REPOSITORY" --latest-main "$(git rev-parse FETCH_HEAD)" \
            --trigger-sha "$(git rev-parse HEAD)" --check-only

      - name: 生成草稿、上传并回读全部资产
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.check-release.outputs.version }}
          SHA: ${{ needs.check-release.outputs.release_sha }}
        run: bash .github/scripts/publish-verified-release.sh

  cleanup:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 只保留版本最高的三个正式发行版
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "111-release-retention",
          }

          releases = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  batch = json.load(resp)

              if not batch:
                  break

              releases.extend(
                  release for release in batch
                  if not release.get("draft")
                  and not release.get("prerelease")
                  and release.get("published_at")
              )
              if len(batch) < 100:
                  break
              page += 1

          version_pattern = re.compile(r"^v(\d+)\.(\d+)\.(\d+)-111\.(\d+)$")

          def release_sort_key(release):
              match = version_pattern.match(release.get("tag_name") or "")
              if match:
                  version = tuple(int(part) for part in match.groups())
                  return (1, *version, release.get("published_at") or "", release.get("id") or 0)
              return (0, 0, 0, 0, 0, release.get("published_at") or "", release.get("id") or 0)

          formal_releases = [
              release for release in releases
              if version_pattern.match(release.get("tag_name") or "")
          ]
          formal_releases.sort(key=release_sort_key, reverse=True)

          keep = formal_releases[:3]
          remove = formal_releases[3:]

          print("保留版本号最高的 3 个已发布版本：")
          for release in keep:
              print(f"  - {release['tag_name']} ({release['published_at']})")

          if not remove:
              print("没有需要清理的旧发行版。")
              raise SystemExit(0)

          print(f"准备删除 {len(remove)} 个旧发行版；Git 标签与提交历史不会删除。")
          for release in remove:
              url = f"https://api.github.com/repos/{repo}/releases/{release['id']}"
              req = urllib.request.Request(url, headers=headers, method="DELETE")
              try:
                  with urllib.request.urlopen(req) as resp:
                      if resp.status not in (200, 204):
                          raise RuntimeError(
                              f"删除 {release['tag_name']} 失败：HTTP {resp.status}"
                          )
              except Exception as exc:
                  raise RuntimeError(
                      f"删除 {release['tag_name']} 失败：{exc}"
                  ) from exc
              print(f"已删除：{release['tag_name']}")
          PY

  release-result:
    name: 正式发布闭环验收
    needs: [preflight, check-release, developer-runtime, release, publish, cleanup]
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 核对发布决策和完整链路
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TRIGGER_ELIGIBLE: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
          MAIN_CI_CONCLUSION: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion || '' }}
        run: python3 .github/scripts/release_outcome.py
