name: 本次增量基线真实升级测试

on:
  push:
    branches: [test/codex-incremental-upgrade-20261125]

permissions:
  contents: write

concurrency:
  group: codex-incremental-upgrade-test-20261125
  cancel-in-progress: false

jobs:
  real-upgrade:
    name: 真实官方增量与独立核心修改保护
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TARGET: 87de5e932dd03bb9efece4a6dd3eab4c5de45701
      OLD: 0e8c7683c4a85f00667bd762265358a407124f2e
      PR96: b6141780eba8304c1e9bbf8c93db2594c824318f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 回归测试
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_merge_codex_upstream.py' -v
      - name: 对 PR 96 真实源码进行隔离预演并检查原始改动
        shell: bash
        run: |
          set -euo pipefail
          test "$(head -n 1 CODEX_UPSTREAM_COMMIT)" = "$OLD"
          test "$(bash .github/scripts/fetch_codex_upstream.sh "$TARGET")" = "$TARGET"
          git fetch --no-tags origin "$PR96"
          git worktree add --detach "$RUNNER_TEMP/pr96" "$PR96"
          test "$(head -n 1 "$RUNNER_TEMP/pr96/CODEX_UPSTREAM_COMMIT")" = "$OLD"
          BEFORE="$(git -C "$RUNNER_TEMP/pr96" write-tree)"
          set +e
          python3 -B .github/scripts/merge_codex_upstream.py --repo "$RUNNER_TEMP/pr96" --target "$TARGET" > "$RUNNER_TEMP/pr96-merge.log" 2>&1
          RESULT=$?
          set -e
          cat "$RUNNER_TEMP/pr96-merge.log"
          if [[ "$RESULT" == 0 ]]; then
            test "$(head -n 1 "$RUNNER_TEMP/pr96/CODEX_UPSTREAM_COMMIT")" = "$TARGET"
            echo "PR #96 真实三方合并通过；仍需接口、编译与实机验证。" >> "$GITHUB_STEP_SUMMARY"
          else
            grep -F '三方合并未通过，原基线和工作区未改动' "$RUNNER_TEMP/pr96-merge.log"
            test "$(git -C "$RUNNER_TEMP/pr96" write-tree)" = "$BEFORE"
            test "$(head -n 1 "$RUNNER_TEMP/pr96/CODEX_UPSTREAM_COMMIT")" = "$OLD"
            test -z "$(git -C "$RUNNER_TEMP/pr96" status --porcelain)"
            echo "PR #96 存在真实冲突；已确认原修改及基线完整保留，待单独合并。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 对测试分支实际执行增量升级并核验源码树
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/scripts/merge_codex_upstream.py --target "$TARGET"
          bash .github/scripts/refresh_codex_catalog_lock.sh
          test "$(head -n 1 CODEX_UPSTREAM_COMMIT)" = "$TARGET"
          # main currently has only the intentional .vscode omission.
          TREE="$(git write-tree)"
          git diff --name-status "$TARGET^{tree}" "$TREE:upstream/codex" | tee "$RUNNER_TEMP/remaining-local.txt"
          test -z "$(grep -v $'^D\t.vscode/' "$RUNNER_TEMP/remaining-local.txt")"
          git diff --cached --stat
      - name: 提交真实升级结果到测试分支
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "测试：真实增量合并官方 Codex 87de5e932dd0"
          git push origin HEAD:refs/heads/test/codex-incremental-upgrade-20261125
          echo "真实升级提交：$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
