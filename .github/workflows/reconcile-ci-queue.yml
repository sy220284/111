name: CI 过期队列实时收敛

on:
  pull_request_target:
    types: [synchronize, closed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只检查，不取消
        type: boolean
        default: true
      cutover:
        description: 强制清退旧版统一验收，保留当前主线版本（需关闭只检查）
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: ci-queue-reconcile-${{ github.event.pull_request.number || 'repository' }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '主线强制切换新版')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Privileged event: execute trusted main only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/ci
            .github/workflows
      - name: 收敛已关闭或被替代的验收
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          CUTOVER: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '主线强制切换新版')) || (github.event_name == 'workflow_dispatch' && inputs.cutover) }}
          CUTOVER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          if [ "$CUTOVER" = true ]; then
            args+=(--cutover-sha "$CUTOVER_SHA" --cutover-run "$GITHUB_RUN_ID")
          elif [ -n "$PR_NUMBER" ]; then
            args+=(--pr "$PR_NUMBER")
          fi
          if [ "$DRY_RUN" != true ]; then args+=(--apply); fi
          python3 .github/scripts/ci_queue_policy.py "${args[@]}"
