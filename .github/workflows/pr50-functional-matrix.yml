name: 111 PR50 真实功能分项并行验收
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/verification/2026-10-28-全仓联合验收触发.md'
      - 'core/**'
      - 'plugins/**'
      - 'runtime/**'
      - 'bin/**'
      - 'tests/**'
      - 'scripts/**'
      - 'resources/**'
      - 'package.json'
      - '.github/workflows/pr50-functional-matrix.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/verification/2026-10-28-全仓联合验收触发.md'
permissions:
  contents: read
jobs:
  actual-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@v2
      - name: 安装锁定依赖并核对运行时
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --version
          bun --version
      - name: 逐项执行完整 npm test 的真实子检查并分别记录结果
        run: node scripts/run-pr50-functional-matrix.cjs 6 ${{ matrix.part }}

  governance-regression:
    name: 可信整合验收正反例回归
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: 实际运行可信门禁的所有正反例
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/restoration-delivery-gate.test.cjs
