name: 111 双 ABI 开发运行时产物
on:
  workflow_call:
    inputs:
      abi:
        required: true
        type: string
      source_sha:
        required: true
        type: string
    outputs:
      manifest_sha:
        value: ${{ jobs.prepare.outputs.manifest_sha }}
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    name: ${{ inputs.abi == 'arm64-v8a' && 'ARM64 工具链产物核验' || 'x86_64 工具链产物核验' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      manifest_sha: ${{ steps.bundle.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: 提取并核验 777 预编译组件
        env:
          GH_TOKEN: ${{ github.token }}
          ABI: ${{ inputs.abi }}
        run: |
          set -euo pipefail
          bash tools/runtime/build-111-runtime.sh "$ABI" "$RUNNER_TEMP/runtime"
      - name: 验证实际 CLI 原生装配和依赖闭环
        env:
          ABI: ${{ inputs.abi }}
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDK_MANAGER" "ndk;27.2.12479018"
          case "$ABI" in arm64-v8a) TARGET=aarch64-linux-android;; x86_64) TARGET=x86_64-linux-android;; *) exit 2;; esac
          CLANG="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/${TARGET}29-clang"
          python3 android-app/tools/prepare_prebuilt_developer_runtime.py "$ABI" --prepared-dir "$RUNNER_TEMP/runtime" --native "$RUNNER_TEMP/cli-native" --assets "$RUNNER_TEMP/cli-assets" --clang "$CLANG" --git-source-output "$RUNNER_TEMP/git-source.tar.xz"
      - name: 生成可复用离线组件并回读
        id: bundle
        env:
          ABI: ${{ inputs.abi }}
        run: |
          set -euo pipefail
          case "$ABI" in arm64-v8a) COMPONENT=runtime-arm64;; x86_64) COMPONENT=runtime-x86;; *) exit 2;; esac
          PIN="$(python3 tools/dev/component-bundle.py pack "$COMPONENT" "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/runtime-bundle" --head "$(git rev-parse HEAD)")"
          python3 tools/dev/component-bundle.py install "$COMPONENT" "$RUNNER_TEMP/runtime-bundle" "$RUNNER_TEMP/installed" --manifest-sha "$PIN"
          echo "manifest_sha=$PIN" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 111-runtime-${{ inputs.abi }}
          path: ${{ runner.temp }}/runtime-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
