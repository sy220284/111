name: 111 开发工具链

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/dev/**'
      - 'tools/analysis/ghidra-headless.sh'
      - 'tools/analysis/integrated-reverse-evidence.py'
      - 'tests/test_integrated_reverse_evidence.py'
      - 'tests/cli-live-daemon-worker-recovery.test.cjs'
      - 'tools/analysis/ghidra-scripts/**'
      - '.github/workflows/dev-toolchain.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/bun-jsc-compat.test.cjs'
      - 'tools/analysis/jelly-runner.cjs'
      - 'tests/jelly-runner.test.cjs'
  pull_request:
    branches: [main]
    paths:
      - 'tools/dev/**'
      - 'tools/analysis/ghidra-headless.sh'
      - 'tools/analysis/ghidra-scripts/**'
      - '.github/workflows/dev-toolchain.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/bun-jsc-compat.test.cjs'
      - 'tools/analysis/jelly-runner.cjs'
      - 'tests/jelly-runner.test.cjs'

permissions:
  contents: read

concurrency:
  group: 111-toolchain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: 构建 Node、npm 离线缓存和 actionlint 组件
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: 校验工具链清单和离线校验器
        run: |
          set -euo pipefail
          bash -n tools/dev/ai-toolchain.sh
          bash tools/dev/ai-toolchain.sh self-test
          python3 tools/dev/test-toolchain.py
      - name: 执行真实联网安装入口和完整源码、CLI 验收
        run: |
          set -euo pipefail
          npm_config_cache="$RUNNER_TEMP/111-npm-cache" bash scripts/install.sh
      - name: 生成三个独立组件产物并登记校验和
        run: |
          set -euo pipefail
          source tools/dev/toolchain-versions.env
          out="$RUNNER_TEMP/111-components"
          mkdir -p "$out"
          node_root="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          mkdir -p "$RUNNER_TEMP/node-stage/node/bin" "$RUNNER_TEMP/node-stage/node/lib/node_modules"
          cp "$node_root/bin/node" "$RUNNER_TEMP/node-stage/node/bin/node"
          cp -a "$node_root/lib/node_modules/npm" "$RUNNER_TEMP/node-stage/node/lib/node_modules/"
          ln -s ../lib/node_modules/npm/bin/npm-cli.js "$RUNNER_TEMP/node-stage/node/bin/npm"
          ln -s ../lib/node_modules/npm/bin/npx-cli.js "$RUNNER_TEMP/node-stage/node/bin/npx"
          node_dir="$out/111-toolchain-node-latest"
          mkdir -p "$node_dir"
          printf 'ARTIFACT_SCHEMA=1\nARTIFACT_COMPONENT=node\nARTIFACT_ARCH=x64\nARTIFACT_NODE_VERSION=%s\n' "$NODE_VERSION" > "$node_dir/component.env"
          tar -czf "$node_dir/payload.tar.gz" -C "$RUNNER_TEMP/node-stage" node
          (cd "$node_dir"; sha256sum component.env payload.tar.gz > SHA256SUMS; sha256sum -c SHA256SUMS)

          mkdir -p "$RUNNER_TEMP/cache-stage/npm-cache"
          cp -a "$RUNNER_TEMP/111-npm-cache/_cacache" "$RUNNER_TEMP/cache-stage/npm-cache/"
          cache_dir="$out/111-toolchain-npm-cache-latest"
          mkdir -p "$cache_dir"
          printf 'ARTIFACT_SCHEMA=1\nARTIFACT_COMPONENT=npm-cache\nARTIFACT_ARCH=x64\nARTIFACT_NODE_VERSION=%s\nARTIFACT_LOCK_SHA256=%s\n' \
            "$NODE_VERSION" "$(sha256sum package-lock.json | awk '{print $1}')" > "$cache_dir/component.env"
          tar -czf "$cache_dir/payload.tar.gz" -C "$RUNNER_TEMP/cache-stage" npm-cache
          (cd "$cache_dir"; sha256sum component.env payload.tar.gz > SHA256SUMS; sha256sum -c SHA256SUMS)

          printf -v archive 'actionlint_%s_linux_amd64.tar.gz' "$ACTIONLINT_VERSION"
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive" \
            -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_X64_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint-stage/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint-stage/bin" actionlint
          "$RUNNER_TEMP/actionlint-stage/bin/actionlint" -version
          lint_dir="$out/111-toolchain-actionlint-latest"
          mkdir -p "$lint_dir"
          printf 'ARTIFACT_SCHEMA=1\nARTIFACT_COMPONENT=actionlint\nARTIFACT_ARCH=x64\nARTIFACT_NODE_VERSION=%s\n' "$NODE_VERSION" > "$lint_dir/component.env"
          tar -czf "$lint_dir/payload.tar.gz" -C "$RUNNER_TEMP/actionlint-stage" bin
          (cd "$lint_dir"; sha256sum component.env payload.tar.gz > SHA256SUMS; sha256sum -c SHA256SUMS)
      - name: 验证官方 SHA256 并制作 Bun/JSC 可选离线组件
        run: |
          set -euo pipefail
          source tools/dev/toolchain-versions.env
          archive="bun-linux-x64-baseline.zip"
          curl --fail --location --retry 3 \
            "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/$archive" \
            -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$BUN_LINUX_X64_BASELINE_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bun-unpacked" "$RUNNER_TEMP/bun-stage/bin"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/bun-unpacked"
          install -m 755 "$RUNNER_TEMP/bun-unpacked/bun-linux-x64-baseline/bun" "$RUNNER_TEMP/bun-stage/bin/bun"
          test "$("$RUNNER_TEMP/bun-stage/bin/bun" --version)" = "$BUN_VERSION"
          dir="$RUNNER_TEMP/111-components/111-toolchain-bun-latest"
          mkdir -p "$dir"
          printf 'ARTIFACT_SCHEMA=1\nARTIFACT_COMPONENT=bun\nARTIFACT_ARCH=x64\nARTIFACT_NODE_VERSION=%s\nARTIFACT_BUN_VERSION=%s\n' \
            "$NODE_VERSION" "$BUN_VERSION" > "$dir/component.env"
          tar -czf "$dir/payload.tar.gz" -C "$RUNNER_TEMP/bun-stage" bin
          (cd "$dir"; sha256sum component.env payload.tar.gz > SHA256SUMS; sha256sum -c SHA256SUMS)
      - name: Bun/JSC 原生运行时执行真实 CLI 与 MCP stdio 业务链
        env:
          CLAUDE_E2E_RUNTIME: ${{ runner.temp }}/bun-stage/bin/bun
        run: |
          set -euo pipefail
          PATH="${RUNNER_TEMP}/bun-stage/bin:${PATH}" npm run verify:bun:runtime
          npm run check:cli-live-mcp
          npm run check:cli-live-model-turn
          npm run check:cli-live-mcp-tools
          npm run check:daemon-live-supervisor
          npm run check:daemon-worker-recovery
      - name: 上传 Node 组件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 111-toolchain-node-latest
          path: ${{ runner.temp }}/111-components/111-toolchain-node-latest/
          retention-days: 30
          if-no-files-found: error
      - name: 上传 npm 离线依赖缓存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 111-toolchain-npm-cache-latest
          path: ${{ runner.temp }}/111-components/111-toolchain-npm-cache-latest/
          retention-days: 30
          if-no-files-found: error
      - name: 上传 actionlint 组件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 111-toolchain-actionlint-latest
          path: ${{ runner.temp }}/111-components/111-toolchain-actionlint-latest/
          retention-days: 30
          if-no-files-found: error
      - name: 上传 Bun/JSC 可选参照运行时
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 111-toolchain-bun-latest
          path: ${{ runner.temp }}/111-components/111-toolchain-bun-latest/
          retention-days: 30
          if-no-files-found: error

  verify-offline:
    name: 全新环境离线安装、真实测试与重复使用
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEV111_TOOLS_ROOT: ${{ github.workspace }}/111-tools
      DEV111_STATE_DIR: ${{ github.workspace }}/111-status
      DEV111_TOOLCHAIN_ENV_FILE: ${{ github.workspace }}/111-env
      DEV111_ARTIFACTS_DIR: ${{ github.workspace }}/.111-toolchain-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: 111-toolchain-*-latest
          path: ${{ github.workspace }}/.111-toolchain-artifacts
          merge-multiple: false
      - name: 检查清单、验证产物并按需安装
        run: |
          set -euo pipefail
          bash tools/dev/ai-toolchain.sh plan --profile full
          for c in node npm-cache actionlint bun; do
            bash tools/dev/ai-toolchain.sh verify-artifact "$c" "$DEV111_ARTIFACTS_DIR/111-toolchain-$c-latest"
          done
          # 直接调用 run，检验仅凭已下载 Artifact 自动完成 build 档依赖安装。
          bash tools/dev/ai-toolchain.sh run -- node --version
          bash tools/dev/ai-toolchain.sh plan --profile build | grep -F '"missing_artifacts":[]'
          # full 档在复用上述组件基础上只补 actionlint。
          bash tools/dev/ai-toolchain.sh bootstrap --profile full --artifacts-dir "$DEV111_ARTIFACTS_DIR"
          bash tools/dev/ai-toolchain.sh check --profile full
      - name: 按需安装 compat 档的 Bun/JSC 并复验真实 API
        run: |
          set -euo pipefail
          bash tools/dev/ai-toolchain.sh plan --profile compat | grep -F '111-toolchain-bun-latest'
          bash tools/dev/ai-toolchain.sh bootstrap --profile compat --artifacts-dir "$DEV111_ARTIFACTS_DIR"
          bash tools/dev/ai-toolchain.sh check --profile compat
          bash tools/dev/ai-toolchain.sh run -- bun --version
          bash tools/dev/ai-toolchain.sh run -- node tools/dev/bun-jsc-compat.cjs report --json \
            --bun "$DEV111_TOOLS_ROOT/bin/bun" --require-bun --output "$RUNNER_TEMP/111-bun-jsc-offline.json" > /dev/null
      - name: 真实离线源码测试、CLI 版本与工作流语法
        run: |
          set -euo pipefail
          bash tools/dev/ai-toolchain.sh run -- node --version
          bash tools/dev/ai-toolchain.sh run -- npm test
          bash tools/dev/ai-toolchain.sh run -- actionlint .github/workflows/dev-toolchain.yml
          bash tools/dev/ai-toolchain.sh run -- node bin/claude-310.mjs --version
      - name: 清空 node_modules 后执行离线安装入口
        run: |
          set -euo pipefail
          rm -rf node_modules
          bash scripts/install.sh --offline
          bash tools/dev/ai-toolchain.sh check --profile full
      - name: 移除产物后复查并证明无重复下载
        run: |
          set -euo pipefail
          rm -rf "$DEV111_ARTIFACTS_DIR"
          bash tools/dev/ai-toolchain.sh check --profile compat
          output="$(bash tools/dev/ai-toolchain.sh plan --profile compat)"
          echo "$output"
          echo "$output" | grep -F '"missing_artifacts":[]'
      - name: 再次启动真实 CLI 帮助入口（失败直接阻断）
        id: cli_runtime
        run: timeout 45s bash tools/dev/ai-toolchain.sh run -- node bin/claude-310.mjs --help
      - name: 汇总结果
        if: always()
        run: |
          echo "111 Node/npm/TypeScript/ws 离线安装及真实测试结果：以步骤日志为准。" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.cli_runtime.outcome }}" = success ]; then
            echo "CLI --help：通过；不等同于完整业务会话通过。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CLI --help：未通过，Node 与 Bun/JSC 运行时仍存在独立兼容缺口。" >> "$GITHUB_STEP_SUMMARY"
          fi

  bun-compat:
    name: Bun/JSC 真实 API 参照探针与源码差距报告
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: 验证 AST 扫描规则、实际源码调用点与 Bun/JSC 行为
        env:
          DEV111_RUNTIME_DIFF_OUT: ${{ runner.temp }}/111-node-bun-live-differential
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:bun-jsc
          node tools/dev/bun-jsc-compat.cjs report --json --bun "$(command -v bun)" --require-bun \
            --output "$RUNNER_TEMP/111-bun-jsc-compat.json" > /dev/null
          node - "$RUNNER_TEMP/111-bun-jsc-compat.json" <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const observed = r.capabilities.filter(x => x.observed);
          const checks = r.runtimeProbe.checks;
          const rows = [
            '## Bun/JSC 实际兼容性诊断',
            '源码模块: ' + r.scannedModules + '; AST 错误: ' + r.parseErrors.length,
            '源码观测 API: ' + observed.map(x => x.api + '(' + x.occurrences + ')').join(', '),
            '参照运行时版本: ' + r.runtimeProbe.bunVersion,
            '参照探针：' + checks.map(x => x.api + '=' + x.status).join(', '),
            '**注意**：Bun 参照 API 通过，不代表 111 已实现 Node 兼容层或全部业务行为。'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows.join('\n\n') + '\n');
          NODE
      - name: 上传可追溯 Bun/JSC 兼容诊断报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 111-bun-jsc-compat-report
          path: ${{ runner.temp }}/111-bun-jsc-compat.json
          retention-days: 30
          if-no-files-found: warn

      - name: 验证真实Node/Bun业务链观测归档的范围与完备性
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/111-node-bun-live-differential/summary.json" <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const path=process.argv[2];
          const r=JSON.parse(fs.readFileSync(path,'utf8'));
          assert.equal(r.kind,'111-node-bun-live-differential');
          assert.equal(r.status,'local_fixture_parity_passed');
          assert.equal(r.originalELFCompared,false);
          assert.equal(r.cloudParity,false);
          assert.deepEqual(r.cases.map(x=>x.name),['model-sse','mcp-tool-loop']);
          assert.ok(r.cases.every(x=>x.passed&&
            x.variants.node.status===0&&x.variants.bun.status===0&&
            x.variants.node.tracePresent===true&&x.variants.bun.tracePresent===true));
          console.log(JSON.stringify({status:r.status,
            scenarios:r.cases.map(x=>x.name),
            originalELFCompared:r.originalELFCompared,cloudParity:r.cloudParity}));
          NODE
      - name: 上传真正执行的Node/Bun CLI与MCP差分证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 111-node-bun-live-differential-evidence
          path: ${{ runner.temp }}/111-node-bun-live-differential/
          retention-days: 30
          if-no-files-found: warn

  jelly-package:
    name: 固定Jelly版本构建可离线安装组件
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: 真实构建Jelly静态分析器与带锁依赖
        run: |
          set -euo pipefail
          source tools/dev/toolchain-versions.env
          prefix="$RUNNER_TEMP/jelly-stage/jelly"
          mkdir -p "$prefix"
          npm install --prefix "$prefix" --ignore-scripts --no-audit --no-fund --save-exact --package-lock=true "@cs-au-dk/jelly@$JELLY_VERSION"
          test "$(node -p 'require(process.argv[1]).version' "$prefix/node_modules/@cs-au-dk/jelly/package.json")" = "$JELLY_VERSION"
          test -s "$prefix/package-lock.json"
          test -s "$prefix/node_modules/@cs-au-dk/jelly/lib/main.js"
          node "$prefix/node_modules/@cs-au-dk/jelly/lib/main.js" --help >/dev/null
          dir="$RUNNER_TEMP/111-components/111-toolchain-jelly-latest"
          mkdir -p "$dir"
          printf 'ARTIFACT_SCHEMA=1\nARTIFACT_COMPONENT=jelly\nARTIFACT_ARCH=x64\nARTIFACT_NODE_VERSION=%s\nARTIFACT_JELLY_VERSION=%s\n' "$NODE_VERSION" "$JELLY_VERSION" > "$dir/component.env"
          tar -czf "$dir/payload.tar.gz" -C "$RUNNER_TEMP/jelly-stage" jelly
          (cd "$dir"; sha256sum component.env payload.tar.gz > SHA256SUMS; sha256sum -c SHA256SUMS)
          bash tools/dev/ai-toolchain.sh verify-artifact jelly "$dir"
      - name: 上传真实Jelly离线组件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 111-toolchain-jelly-latest
          path: ${{ runner.temp }}/111-components/111-toolchain-jelly-latest/
          retention-days: 30
          if-no-files-found: error

  jelly-offline-analyze:
    name: 下载离线产物、安装Jelly并分析真实恢复模块
    needs: jelly-package
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: 下载同一工作流构建的不可变Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: 111-toolchain-jelly-latest
          path: ${{ runner.temp }}/111-artifacts/111-toolchain-jelly-latest
      - name: 验证checksum，离线安装并验收正式工具链
        env:
          DEV111_TOOLS_ROOT: ${{ runner.temp }}/111-installed
          DEV111_STATE_DIR: ${{ runner.temp }}/111-state
          DEV111_TOOLCHAIN_ENV_FILE: ${{ runner.temp }}/111-env
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/jelly-runner.test.cjs
          bash -n tools/dev/ai-toolchain.sh
          python3 tools/dev/test-toolchain.py
          bash tools/dev/ai-toolchain.sh bootstrap --profile analysis --artifacts-dir "$RUNNER_TEMP/111-artifacts"
          bash tools/dev/ai-toolchain.sh check --profile analysis
          bash tools/dev/ai-toolchain.sh plan --profile analysis | tee "$RUNNER_TEMP/111-jelly-plan.json"
          grep -F '"missing_artifacts":[]' "$RUNNER_TEMP/111-jelly-plan.json"
          "$DEV111_TOOLS_ROOT/bin/jelly" --help >/dev/null
          timeout 160s node tools/analysis/jelly-runner.cjs \
            --jelly "$DEV111_TOOLS_ROOT/bin/jelly" \
            --out "$RUNNER_TEMP/111-jelly-analysis" \
            --timeout 110 \
            --entry core/chunk-sdz0xp27.js \
            --entry core/chunk-01qhvw6m.js
          node - "$RUNNER_TEMP/111-jelly-analysis/111-jelly-evidence.json" <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const report=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          assert.equal(report.successes,2);
          assert.equal(report.requestedEntries,2);
          assert.ok(report.records.every(r=>r.sourceSHA256.length===64 && r.jellyJsonBytes>0));
          assert.ok(report.records.every(r=>r.runtimeCallsConfirmed===0));
          console.log(JSON.stringify({status:'analyzed',records:report.records.map(({entry,jellyJsonBytes,topLevelKeys,graphCollectionCounts})=>({entry,jellyJsonBytes,topLevelKeys,graphCollectionCounts}))}));
          NODE
          # Large recovered modules are explored separately and remain honest
          # partial/failed evidence if Jelly runs out of its bounded budget.
          timeout 300s node tools/analysis/jelly-runner.cjs \
            --jelly "$DEV111_TOOLS_ROOT/bin/jelly" \
            --out "$RUNNER_TEMP/111-jelly-analysis/large-modules" \
            --timeout 110 \
            --entry core/chunk-tqjdehqd.js \
            --entry core/chunk-6d8swme1.js || echo '大型模块存在独立Jelly分析缺口，保留failed_or_partial报告用于复核'
      - name: 上传可复核Jelly真实分析及运行记录
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 111-jelly-points-to-real-source-report
          path: ${{ runner.temp }}/111-jelly-analysis/
          retention-days: 30
          if-no-files-found: warn

  ghidra-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: 校验工具链脚本及清单
        run: |
          set -euo pipefail
          bash -n tools/dev/ai-toolchain.sh tools/analysis/ghidra-headless.sh
          python3 tools/dev/test-toolchain.py
          bash tools/dev/ai-toolchain.sh plan --profile reverse
      - name: 下载官方 Ghidra 12.2 并校验源 SHA256
        run: |
          set -euo pipefail
          source tools/dev/toolchain-versions.env
          archive="ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_RELEASE_DATE}.zip"
          curl --fail --location --retry 3 \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/$archive" \
            -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GHIDRA_ZIP_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra-extract" "$RUNNER_TEMP/ghidra-stage"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/ghidra-extract"
          folder="$RUNNER_TEMP/ghidra-extract/ghidra_${GHIDRA_VERSION}_PUBLIC"
          test -x "$folder/support/analyzeHeadless"
          grep -Eq "^application\.version=${GHIDRA_VERSION}$" "$folder/Ghidra/application.properties"
          mv "$folder" "$RUNNER_TEMP/ghidra-stage/ghidra"
          dest="$RUNNER_TEMP/111-components/111-toolchain-ghidra-latest"
          mkdir -p "$dest"
          printf 'ARTIFACT_SCHEMA=1\nARTIFACT_COMPONENT=ghidra\nARTIFACT_ARCH=x64\nARTIFACT_NODE_VERSION=%s\nARTIFACT_GHIDRA_VERSION=%s\nARTIFACT_GHIDRA_ZIP_SHA256=%s\n' \
            "$NODE_VERSION" "$GHIDRA_VERSION" "$GHIDRA_ZIP_SHA256" > "$dest/component.env"
          tar -czf "$dest/payload.tar.gz" -C "$RUNNER_TEMP/ghidra-stage" ghidra
          (cd "$dest" && sha256sum component.env payload.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
          bash tools/dev/ai-toolchain.sh verify-artifact ghidra "$dest"
      - name: 打包 Temurin JDK 25 离线组件
        run: |
          set -euo pipefail
          source tools/dev/toolchain-versions.env
          "$JAVA_HOME/bin/java" -version 2>&1 | grep -Eq 'version "25([."]|\+)'
          mkdir -p "$RUNNER_TEMP/jdk-stage"
          mkdir -p "$RUNNER_TEMP/jdk-stage/jdk"
          cp -a "$(readlink -f "$JAVA_HOME")/." "$RUNNER_TEMP/jdk-stage/jdk/"
          test -x "$RUNNER_TEMP/jdk-stage/jdk/bin/java"
          test "$(du -sm "$RUNNER_TEMP/jdk-stage/jdk" | cut -f1)" -gt 30
          dest="$RUNNER_TEMP/111-components/111-toolchain-jdk-latest"
          mkdir -p "$dest"
          printf 'ARTIFACT_SCHEMA=1\nARTIFACT_COMPONENT=jdk\nARTIFACT_ARCH=x64\nARTIFACT_NODE_VERSION=%s\nARTIFACT_JDK_MAJOR=%s\n' \
            "$NODE_VERSION" "$GHIDRA_JDK_MAJOR" > "$dest/component.env"
          tar -czf "$dest/payload.tar.gz" -C "$RUNNER_TEMP/jdk-stage" jdk
          (cd "$dest" && sha256sum component.env payload.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
          bash tools/dev/ai-toolchain.sh verify-artifact jdk "$dest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 111-toolchain-ghidra-latest
          path: ${{ runner.temp }}/111-components/111-toolchain-ghidra-latest/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: 拆分 Ghidra 离线载荷以支持小于 512 MiB 的下载接口
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/111-components/111-toolchain-ghidra-latest"
          mkdir -p "$RUNNER_TEMP/ghidra-split/00" "$RUNNER_TEMP/ghidra-split/01"
          split --bytes=320m --numeric-suffixes=0 --suffix-length=2 "$dir/payload.tar.gz" "$RUNNER_TEMP/ghidra-part-"
          test -f "$RUNNER_TEMP/ghidra-part-00"
          test -f "$RUNNER_TEMP/ghidra-part-01"
          test "$(find "$RUNNER_TEMP" -maxdepth 1 -name 'ghidra-part-*' | wc -l)" -eq 2
          mv "$RUNNER_TEMP/ghidra-part-00" "$RUNNER_TEMP/ghidra-split/00/payload.part-00"
          mv "$RUNNER_TEMP/ghidra-part-01" "$RUNNER_TEMP/ghidra-split/01/payload.part-01"
          cp "$dir/component.env" "$dir/SHA256SUMS" "$RUNNER_TEMP/ghidra-split/00/"
          cat "$RUNNER_TEMP/ghidra-split/00/payload.part-00" "$RUNNER_TEMP/ghidra-split/01/payload.part-01" | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/ghidra-rejoined.sha"
          test "$(cat "$RUNNER_TEMP/ghidra-rejoined.sha")" = "$(sha256sum "$dir/payload.tar.gz" | cut -d' ' -f1)"
          test "$(stat -c %s "$RUNNER_TEMP/ghidra-split/00/payload.part-00")" -lt 536870912
          test "$(stat -c %s "$RUNNER_TEMP/ghidra-split/01/payload.part-01")" -lt 536870912
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 111-toolchain-ghidra-part-00
          path: ${{ runner.temp }}/ghidra-split/00/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 111-toolchain-ghidra-part-01
          path: ${{ runner.temp }}/ghidra-split/01/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 111-toolchain-jdk-latest
          path: ${{ runner.temp }}/111-components/111-toolchain-jdk-latest/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  ghidra-verify-offline:
    needs: ghidra-package
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      DEV111_TOOLS_ROOT: ${{ github.workspace }}/.111-installed
      DEV111_STATE_DIR: ${{ github.workspace }}/.111-state
      DEV111_TOOLCHAIN_ENV_FILE: ${{ github.workspace }}/.111-env
      DEV111_ARTIFACTS_DIR: ${{ github.workspace }}/.111-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: 111-toolchain-*-latest
          path: ${{ github.workspace }}/.111-artifacts
          merge-multiple: false
      - name: 离线安装与重复检查
        run: |
          set -euo pipefail
          for c in jdk ghidra; do
            bash tools/dev/ai-toolchain.sh verify-artifact "$c" "$DEV111_ARTIFACTS_DIR/111-toolchain-$c-latest"
          done
          bash tools/dev/ai-toolchain.sh bootstrap --profile reverse --artifacts-dir "$DEV111_ARTIFACTS_DIR"
          bash tools/dev/ai-toolchain.sh check --profile reverse
          bash tools/dev/ai-toolchain.sh plan --profile reverse | grep -F '"missing_artifacts":[]'
      - name: 真实 ELF 函数反编译及结果核验
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/111-fixture.c" <<'C'
          __attribute__((noinline)) int twice(int x) { return x * 2; }
          int main(void) { return twice(21) == 42 ? 0 : 1; }
          C
          gcc -O0 -o "$RUNNER_TEMP/111-fixture" "$RUNNER_TEMP/111-fixture.c"
          bash tools/dev/ai-toolchain.sh run --profile reverse -- bash tools/analysis/ghidra-headless.sh \
            --input "$RUNNER_TEMP/111-fixture" --output "$RUNNER_TEMP/111-ghidra-evidence"
          python3 - "$RUNNER_TEMP/111-ghidra-evidence" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          s = json.loads((root / 'summary.json').read_text())
          assert s['total_functions'] >= 2, s
          assert s['decompiled_functions'] >= 2, s
          assert s['total_functions'] == s['decompiled_functions'] + s['failed_functions']
          source = (root / 'decompiled.c').read_text()
          assert 'twice' in source and 'main' in source, s
          assert '\tok\t' in (root / 'functions.tsv').read_text()
          assert len((root / 'input.sha256').read_text().split()[0]) == 64
          print(s)
          PY
      - name: 验证联合取证校验器的正反例
        run: python3 -m unittest discover -s tests -p 'test_integrated_reverse_evidence.py' -v
      - name: 同一提交重建JS函数调用图
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:code-graph
          node --max-old-space-size=4096 tools/analysis/code-graph.cjs scan --full --output "$RUNNER_TEMP/current-graph.json" > /dev/null
      - name: 真实反编译两个原生N-API二进制
        run: |
          set -euo pipefail
          for name in audio-capture.node clipboard-napi.node; do
            timeout 1100s bash tools/dev/ai-toolchain.sh run --profile reverse -- bash tools/analysis/ghidra-headless.sh --input "resources/bunfs/$name" --output "$RUNNER_TEMP/native/$name"
          done
      - name: 绑定本提交源码和原生字节并输出真实成功/失败证据
        run: |
          set -euo pipefail
          python3 tools/analysis/integrated-reverse-evidence.py --repo . --graph "$RUNNER_TEMP/current-graph.json" --native-root "$RUNNER_TEMP/native" --commit "$GITHUB_SHA" --toolchain-run "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/native/integrated-evidence.json"
          cp "$RUNNER_TEMP/current-graph.json" "$RUNNER_TEMP/native/source-graph.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: 111-integrated-native-source-evidence
          path: ${{ runner.temp }}/native/
          retention-days: 30
          if-no-files-found: warn
      - name: 删除下载缓存后仍可重复使用
        run: |
          set -euo pipefail
          rm -rf "$DEV111_ARTIFACTS_DIR"
          bash tools/dev/ai-toolchain.sh check --profile reverse
          bash tools/dev/ai-toolchain.sh plan --profile reverse | grep -F '"missing_artifacts":[]'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: 111-ghidra-elf-decompilation-evidence
          path: ${{ runner.temp }}/111-ghidra-evidence/
          retention-days: 30
          if-no-files-found: warn
