name: 111 开发工具链产物与离线验收

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dev-toolchain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shared:
    name: 777 固定共享产物与工作流检查
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装真实共享产物并执行回归
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash tools/dev/check-ci-toolchain.sh

  android:
    uses: ./.github/workflows/prepare-host-toolchain.yml
    with:
      group: android
      source_sha: ${{ github.sha }}

  rust:
    uses: ./.github/workflows/prepare-host-toolchain.yml
    with:
      group: rust
      source_sha: ${{ github.sha }}

  node:
    uses: ./.github/workflows/prepare-aux-toolchain.yml
    with:
      group: node
      source_sha: ${{ github.sha }}

  wheelhouse:
    uses: ./.github/workflows/prepare-aux-toolchain.yml
    with:
      group: wheelhouse
      source_sha: ${{ github.sha }}

  emulator:
    uses: ./.github/workflows/prepare-aux-toolchain.yml
    with:
      group: emulator
      source_sha: ${{ github.sha }}

  llvm:
    uses: ./.github/workflows/prepare-aux-toolchain.yml
    with:
      group: llvm
      source_sha: ${{ github.sha }}

  patcher:
    uses: ./.github/workflows/prepare-aux-toolchain.yml
    with:
      group: patcher
      source_sha: ${{ github.sha }}
