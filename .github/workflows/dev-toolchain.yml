name: 111 开发工具链产物与离线验收

on:
  push:
    branches: [main, validation/combined-111-reply-20261126]
    paths:
      - 'tools/dev/**'
      - 'tools/runtime/**'
      - 'android-app/**'
      - 'upstream/codex/codex-rs/Cargo.lock'
      - 'upstream/codex/codex-rs/rust-toolchain.toml'
      - '.github/workflows/dev-toolchain.yml'
      - '.github/workflows/prepare-developer-runtime.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/build-native-codex.yml'
      - '.github/actionlint.yaml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  maven-metadata-audit:
    name: Maven Central 缺失元数据独立摘要审查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 tools/dev/audit_maven_metadata.py

  shared:
    name: 777 固定共享产物与工作流检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 安装真实共享产物并执行回归
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/dev -p 'test_*.py'
          python3 tools/dev/ai-toolchain.py --root "$RUNNER_TEMP/shared" shared-install --artifacts-dir "$RUNNER_TEMP/downloads" --download > "$RUNNER_TEMP/shared.json"
          NODE="$(jq -r '.node' "$RUNNER_TEMP/shared.json")"
          LINT="$(jq -r '.actionlint' "$RUNNER_TEMP/shared.json")"
          "$NODE/bin/node" --version
          "$LINT/actionlint" .github/workflows/dev-toolchain.yml .github/workflows/prepare-developer-runtime.yml .github/workflows/ci.yml .github/workflows/release.yml
          # GitHub 已实际运行 queue: max，777 固定 actionlint 尚未认识该新字段。
          # 仅在原生工作流过滤此已确认的解析差异；不屏蔽其它错误。
          "$LINT/actionlint" -ignore 'unexpected key "queue" for "concurrency" section' .github/workflows/build-native-codex.yml
          python3 -m unittest discover -s android-app/tools -p 'test_prepare_prebuilt_developer_runtime.py'
          python3 -m unittest discover -s .github/scripts -p 'test_audit_apk_contents.py'

  runtime-arm64:
    uses: ./.github/workflows/prepare-developer-runtime.yml
    with:
      abi: arm64-v8a
      source_sha: ${{ github.sha }}

  runtime-x86:
    uses: ./.github/workflows/prepare-developer-runtime.yml
    with:
      abi: x86_64
      source_sha: ${{ github.sha }}

  android:
    name: 111 专用 JDK、Android SDK、Gradle 离线依赖
    concurrency:
      group: 111-dev-toolchain-android-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: 准备独立 SDK 与 Gradle 缓存
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "platform-tools"
          mkdir -p "$RUNNER_TEMP/gradle-home" "$RUNNER_TEMP/stage/android-sdk" "$RUNNER_TEMP/stage/gradle" "$RUNNER_TEMP/bundles"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"
          printf '%s  %s\n' 2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046 android-app/gradle/wrapper/gradle-wrapper.jar | sha256sum -c -
      - name: 验证已提交的 Gradle 依赖基线与所有 Android 变体
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/dependency-baseline.jks"
          keytool -genkeypair -noprompt -keystore "$STORE" -storetype PKCS12 -alias 111-release -keyalg RSA -keysize 2048 -validity 1 -storepass ci-only-password -keypass ci-only-password -dname "CN=111 dependency baseline"
          export CODEX_RELEASE_KEYSTORE_PATH="$STORE" CODEX_RELEASE_PASSWORD=ci-only-password CODEX_RELEASE_KEY_ALIAS=111-release
          tasks=(:app:verifyAndroidTestRuntime :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease :app:assembleRelease)
          test -s android-app/app/gradle.lockfile
          test -s android-app/gradle/verification-metadata.xml
          ./android-app/gradlew -p android-app "${tasks[@]}" -PcodexReleaseVersionName=0.1.0-111.999 -PcodexReleaseVersionCode=999 --dependency-verification strict --no-daemon --stacktrace
          git diff --exit-code -- android-app/app/gradle.lockfile android-app/gradle/verification-metadata.xml
          echo "committed" > "$RUNNER_TEMP/baseline-status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 111-toolchain-gradle-dependency-baseline
          path: |
            android-app/app/gradle.lockfile
            android-app/gradle/verification-metadata.xml
          if-no-files-found: error
      - name: 打包各独立组件并在新目录重新安装
        run: |
          set -euo pipefail
          cp -aL "$JAVA_HOME" "$RUNNER_TEMP/stage/jdk"
          SDK="$RUNNER_TEMP/stage/android-sdk"
          for path in platforms/android-35 platforms/android-36 build-tools/35.0.0 build-tools/36.0.0 ndk/27.2.12479018 platform-tools licenses cmdline-tools; do
            mkdir -p "$SDK/$(dirname "$path")"
            cp -a "$ANDROID_HOME/$path" "$SDK/$path"
          done
          mkdir -p "$RUNNER_TEMP/stage/gradle/caches"
          cp -a "$GRADLE_USER_HOME/wrapper" "$RUNNER_TEMP/stage/gradle/"
          cp -a "$GRADLE_USER_HOME/caches/modules-2" "$RUNNER_TEMP/stage/gradle/caches/"
          find "$RUNNER_TEMP/stage/gradle" -type f -name '*.lock' -delete
          for c in jdk android-sdk gradle; do
            python3 tools/dev/component-bundle.py pack "$c" "$RUNNER_TEMP/stage/$c" "$RUNNER_TEMP/bundles/$c" --head "$GITHUB_SHA" > "$RUNNER_TEMP/$c.sha256"
            rm -rf "$RUNNER_TEMP/stage/$c"
          done
          python3 tools/dev/ai-toolchain.py --root "$RUNNER_TEMP/host" host-install --artifacts-dir "$RUNNER_TEMP/bundles" --pins-dir "$RUNNER_TEMP" --source-sha "$GITHUB_SHA" --components jdk android-sdk gradle > "$RUNNER_TEMP/host-paths.json"
          for c in jdk android-sdk gradle; do
            jq -er --arg name "$c" '.[$name]' "$RUNNER_TEMP/host-paths.json" > "$RUNNER_TEMP/$c.path"
          done
      - name: 禁用外网后重新执行 Android 构建
        run: |
          set -euo pipefail
          python3 tools/dev/ai-toolchain.py --root "$RUNNER_TEMP/host" host-env --components jdk android-sdk gradle > "$RUNNER_TEMP/host-env.json"
          JAVA_HOME="$(jq -er .JAVA_HOME "$RUNNER_TEMP/host-env.json")"
          export JAVA_HOME
          ANDROID_HOME="$(jq -er .ANDROID_HOME "$RUNNER_TEMP/host-env.json")"
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          GRADLE_USER_HOME="$(jq -er .GRADLE_USER_HOME "$RUNNER_TEMP/host-env.json")"
          export GRADLE_USER_HOME
          export PATH="$JAVA_HOME/bin:$PATH"
          export CODEX_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/dependency-baseline.jks" CODEX_RELEASE_PASSWORD=ci-only-password CODEX_RELEASE_KEY_ALIAS=111-release
          bash tools/dev/run-without-network.sh \
            "JAVA_HOME=$JAVA_HOME" "ANDROID_HOME=$ANDROID_HOME" "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" \
            "GRADLE_USER_HOME=$GRADLE_USER_HOME" "CODEX_RELEASE_KEYSTORE_PATH=$CODEX_RELEASE_KEYSTORE_PATH" \
            "CODEX_RELEASE_PASSWORD=$CODEX_RELEASE_PASSWORD" "CODEX_RELEASE_KEY_ALIAS=$CODEX_RELEASE_KEY_ALIAS" \
            "$GITHUB_WORKSPACE/android-app/gradlew" -p android-app :app:clean :app:verifyAndroidTestRuntime :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease :app:assembleRelease -PcodexReleaseVersionName=0.1.0-111.999 -PcodexReleaseVersionCode=999 --offline --dependency-verification strict --no-daemon --stacktrace
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s android-app/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 111-toolchain-jdk
          path: ${{ runner.temp }}/bundles/jdk/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 111-toolchain-android-sdk
          path: ${{ runner.temp }}/bundles/android-sdk/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 111-toolchain-gradle
          path: ${{ runner.temp }}/bundles/gradle/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 111-toolchain-android-manifest-pins
          path: |
            ${{ runner.temp }}/jdk.sha256
            ${{ runner.temp }}/android-sdk.sha256
            ${{ runner.temp }}/gradle.sha256
            ${{ runner.temp }}/baseline-status
          if-no-files-found: error

  rust:
    name: Rust 1.99.1 双 ABI 工具及 Cargo 离线依赖
    concurrency:
      group: 111-dev-toolchain-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.99.1"
          targets: aarch64-linux-android,x86_64-linux-android
      - name: 固定 Cargo 缓存并打包可搬移工具
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/stage/cargo"
          mkdir -p "$CARGO_HOME" "$RUNNER_TEMP/bundles"
          TOOLCHAIN="$(rustc +1.99.1 --print sysroot)"
          cp -a "$TOOLCHAIN" "$RUNNER_TEMP/stage/rust"
          cd upstream/codex/codex-rs
          cargo +1.99.1 fetch --locked
          cargo +1.99.1 fetch --locked --target aarch64-linux-android
          cargo +1.99.1 fetch --locked --target x86_64-linux-android
          cd "$GITHUB_WORKSPACE"
          for c in rust cargo; do
            python3 tools/dev/component-bundle.py pack "$c" "$RUNNER_TEMP/stage/$c" "$RUNNER_TEMP/bundles/$c" --head "$GITHUB_SHA" > "$RUNNER_TEMP/$c.sha256"
            rm -rf "$RUNNER_TEMP/stage/$c"
          done
          python3 tools/dev/ai-toolchain.py --root "$RUNNER_TEMP/host" host-install --artifacts-dir "$RUNNER_TEMP/bundles" --pins-dir "$RUNNER_TEMP" --source-sha "$GITHUB_SHA" --components rust cargo > "$RUNNER_TEMP/host-paths.json"
          for c in rust cargo; do
            jq -er --arg name "$c" '.[$name]' "$RUNNER_TEMP/host-paths.json" > "$RUNNER_TEMP/$c.path"
          done
      - name: 验证搬移后的 Rust 与双 ABI 缓存
        run: |
          set -euo pipefail
          python3 tools/dev/ai-toolchain.py --root "$RUNNER_TEMP/host" host-env --components rust cargo > "$RUNNER_TEMP/host-env.json"
          CARGO_HOME="$(jq -er .CARGO_HOME "$RUNNER_TEMP/host-env.json")"
          export CARGO_HOME
          PATH="$(jq -er .PATH "$RUNNER_TEMP/host-env.json")"
          export PATH
          RUSTC="$(command -v rustc)"
          export RUSTC
          RUSTDOC="$(command -v rustdoc)"
          export RUSTDOC
          export CARGO_NET_OFFLINE=true
          rustc --version | grep -F '1.99.1'
          for target in aarch64-linux-android x86_64-linux-android; do
            test -d "$(rustc --print sysroot)/lib/rustlib/$target/lib"
          done
          cd upstream/codex/codex-rs
          for target in aarch64-linux-android x86_64-linux-android; do
            test -d "$CARGO_HOME/git/db"
            cargo fetch --locked --offline --target "$target"
            bash "$GITHUB_WORKSPACE/tools/dev/run-without-network.sh" \
              "CARGO_HOME=$CARGO_HOME" "RUSTC=$RUSTC" "RUSTDOC=$RUSTDOC" "CARGO_NET_OFFLINE=true" \
              "$(command -v cargo)" fetch --locked --offline --target "$target"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 111-toolchain-rust
          path: ${{ runner.temp }}/bundles/rust/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 111-toolchain-cargo
          path: ${{ runner.temp }}/bundles/cargo/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 111-toolchain-rust-manifest-pins
          path: |
            ${{ runner.temp }}/rust.sha256
            ${{ runner.temp }}/cargo.sha256
          if-no-files-found: error
