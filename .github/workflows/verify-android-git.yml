name: 安卓 Git ARM64 交叉编译验收

on:
  push:
    paths:
      - "android-app/tools/build_android_git.sh"
      - ".github/workflows/verify-android-git.yml"
  pull_request:
    paths:
      - "android-app/tools/build_android_git.sh"
      - ".github/workflows/verify-android-git.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Fast Git checks must not cancel slower full native Codex/V8 builds.
  group: android-git-verify-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-git:
    name: Android Git / ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            clang: aarch64-linux-android29-clang
            elf_arch: AArch64
    steps:
      - name: 检出安卓 Git 交叉编译脚本
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            android-app/tools/build_android_git.sh
          sparse-checkout-cone-mode: false
      - name: 安装锁定的 Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" "ndk;27.2.12479018"
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.clang }}"
      - name: 独立编译 Git 并验证安卓 ABI、加载器和 16KB 对齐
        shell: bash
        run: |
          set -euo pipefail
          BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET="${{ matrix.target }}"
          DEST="$RUNNER_TEMP/android-git/${{ matrix.abi }}/git"
          bash android-app/tools/build_android_git.sh "$TARGET" "$BIN" "${{ matrix.clang }}" "$DEST"
          test -s "$DEST"
          file "$DEST"
          "$BIN/llvm-readelf" -h "$DEST" | grep -F "${{ matrix.elf_arch }}"
          "$BIN/llvm-readelf" -l "$DEST" | grep -F '/system/bin/linker64'
          mapfile -t LOAD_ALIGNS < <("$BIN/llvm-readelf" -Wl "$DEST" | awk '$1=="LOAD" {print $NF}')
          test "${#LOAD_ALIGNS[@]}" -gt 0
          for ALIGN in "${LOAD_ALIGNS[@]}"; do
            if (( ALIGN < 16384 )); then
              echo "Git ELF 的 LOAD 段内存页对齐不足 16KB: $ALIGN" >&2
              exit 1
            fi
          done
          sha256sum "$DEST"
      - name: 保存已验证的安卓 Git 工具
        uses: actions/upload-artifact@v4
        with:
          name: verified-android-git-${{ matrix.abi }}
          path: ${{ runner.temp }}/android-git/${{ matrix.abi }}/git
          if-no-files-found: error
          retention-days: 14
