name: 一次性提交文件历史真实源码修复
on:
  push:
    branches:
      - test/111-file-checkpoint-rewind-real-disk-20261029
    paths:
      - scripts/one-shot-file-history-mtime.cjs
permissions:
  contents: write
jobs:
  patch-real-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - run: node scripts/one-shot-file-history-mtime.cjs
      - name: 提交真实源码及来源验收修复
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复文件历史回退忽略旧时间戳内容变化的问题"
          git push origin HEAD:test/111-file-checkpoint-rewind-real-disk-20261029
